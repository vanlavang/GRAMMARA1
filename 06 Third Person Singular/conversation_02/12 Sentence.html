<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Scramble Sentences</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
@font-face {
  font-family: 'UTM Avo';
  src: url('fonts/utm-avo.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}


    body {
      font-family: 'utm avo', Roboto, sans-serif;
      margin: 0;
      background-color: #f0e2cd;
      padding-top: 100px;
      padding-bottom: 120px;
    }

    header {
  background-color: #f3dbc1;
  padding: 10px;
  display: flex;
  justify-content: center;
  gap: 12px;
  border-bottom: 2px solid #d4bfa6;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 9999; /* Đảm bảo luôn nằm trên cùng */
}

header button {
  background-color: #ffffff;
  border: 2px solid #d4bfa6;
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: normal;
  color: #8b5e3c;
  transition: 0.3s;
  font-family: 'UTM Avo', sans-serif;
}

/* Nút Conversation 02 đang hoạt động */
header button.active-nav {
  font-weight: bold !important;
  background-color: #bd8e6f !important; /* Màu cam đậm của bạn */
  color: #ffffff !important;
  border-color: #a04000;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

header button:not(.active-nav):hover {
  background-color: #fdf5e6;
}

    header nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    header a {
      font-size: 18px;
      padding: 10px 20px;
      border: 1px solid #c9a77b;
      background: #fff3e0;
      border-radius: 10px;
      text-decoration: none;
      color: black;
    }

    .sidebar {
      width: 180px; 
      background: #f3dbc1;
      padding: 10px 5px; 
      display: flex;
      flex-direction: column;
      font-family: 'utm avo', Roboto, sans-serif;
      gap: 8px;
      position: fixed;
      top: 100px;
      bottom: 0;
      overflow-y: auto;
      z-index: 10;
      transform: translateX(0);

    }

    .sidebar.right.hidden {
      transform: translateX(100%);
    }
    .sidebar.left.hidden {
      transform: translateX(-100%);
    }

    .sidebar.left { left: 0; }
    .sidebar.right { right: 0; }

    .sidebar button {
      width: 100%; 
      font-size: 15px;
      padding: 12px 5px; 
      background: #ffffff;
      border: 1px solid #d4bfa6;
      border-radius: 8px;
      font-family: 'utm avo', Roboto, sans-serif;
      cursor: pointer;
      text-align: center; 
      box-sizing: border-box; 
    }

    .sidebar button:hover {
      background: #fefaf3;
    }

    .sidebar button.active {
      background-color: #d35400; 
      color: #fff;               
      border: 2px solid #a04000;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .sidebar button.active b {
      color: #fff;
    }
    .toggle-btn {
      position: fixed;
      top: 50px;
      width: 70px;
      height: 50px;
      background-color: #d4bfa6;
      color: #000;
      border: none;
      font-size: 16px;
      cursor: pointer;
      z-index: 100;
    }

    .toggle-left { left: 0; border-radius: 0 10px 10px 0; }
    .toggle-right { right: 0; border-radius: 10px 0 0 10px; }

    .container {
      background: #fffaf2;
      margin: 20px auto;
      padding: 20px;
      width: 95%;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 8px;
      text-align: center;
    }

    #drop-area, #word-bank {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 20px auto;
      min-height: 80px;
      padding: 20px;
      max-width: 90%;
      border: 2px dashed #ccc;
      border-radius: 6px;
      background-color: #fefaf3;
    }

    .word {
      background: #fff;
      border: 2px solid #333;
      border-radius: 5px;
      padding: 8px 15px;
      margin: 5px;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .word:hover { background: #eee; }
    .word.used { background: #ddd; color: #999; pointer-events: none; }

    #result {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }

    .score-summary {
      margin-top: 20px;
      font-size: 18px;
    }

    .footer-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #f3dbc1;
      border-top: 2px solid #d4bfa6;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 15px 10px;
      z-index: 1000;
      font-size: 16px;
    }

    .footer-bar button {
      padding: 10px 16px;
      background-color: #cecdc9;
      color: black;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    .footer-bar button:hover {
      background-color: #7d7867;
      transform: scale(1.05);
    }

    .btn-speed-active {
      background-color: #ffcc80 !important;
      font-weight: bold;
    }

    .footer-section {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .footer-label {
      font-weight: bold;
      color: #333;
    }

    #timer {
      font-weight: bold;
      font-size: 18px;
      color: #444;
    }

    #trans-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #ffffff;
      border: 4px solid #c9a77b;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
      z-index: 10001;
      text-align: center;
      max-width: 85%;
      min-width: 300px;
      animation: fadeIn 0.3s ease;
      cursor: pointer;
    }

    #close-popup {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #c9a77b;
      cursor: pointer;
      line-height: 1;
    }

    #trans-text {
      font-size: 36px;
      font-weight: bold;
      color: #2c3e50;
      line-height: 1.3;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -55%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>
 <header id="mainHeader">
  <nav style="display: flex; gap: 10px;">
    <button onclick="window.location.href='../conversation_01/conversation_01.html'">
      Conversation 01
    </button>
    
    <button class="active-nav" onclick="window.location.href='../conversation_02/conversation_02.html'">
      <b>Conversation 02</b>
    </button>
    
    <button onclick="window.location.href='../conversation_03/conversation_03.html'">
      Conversation 03
    </button>
    
    <button onclick="window.location.href='../conversation_04/conversation_04.html'">
      Conversation 04
    </button>
  </nav>
</header>

  <button class="toggle-btn toggle-left" onclick="toggleSidebar('left')">Menu</button>
  <button class="toggle-btn toggle-right" onclick="toggleSidebar('right')">Menu</button>

  <div class="sidebar left hidden" id="leftSidebar">
    <button onclick="location.href='01 Vocabulary 1.html'"><b>Vocabulary 1</b></button>
    <button onclick="location.href='02 Vocabulary 2.html'"><b>Vocabulary 2</b></button>
    <button onclick="location.href='03 Vocabulary memory matching.html'"><b>Memory Matching</b></button>
    <button onclick="location.href='04 grammar.html'"><b>Grammar</b></button>
    <button onclick="location.href='05 Sentence Swap Game.html'"><b>Sentence Swap</b></button>
    <button onclick="location.href='06 Reorder.html'"><b>Reorder</b></button>
    <button onclick="location.href='07 Dropdown.html'"><b>Dropdown</b></button>
  </div>

  <div class="sidebar right hidden" id="rightSidebar">
    <button onclick="location.href='08 quiz.html'"><b>Quiz</b></button>
    <button onclick="location.href='09 true false.html'"><b>True / False</b></button>
    <button onclick="location.href='10 Wh questions.html'"><b>WH Questions</b></button>
    <button onclick="location.href='11 Speaking.html'"><b>Speaking</b></button>
    <button class="active" onclick="location.href='12 Sentence.html'"><b>Sentence</b></button>
    <button onclick="location.href='13 Cloze.html'"><b>Cloze</b></button>
    <button onclick="location.href='14 Dictation.html'"><b>Dictation</b></button>
    <button onclick="location.href='story.html'"><b>Story</b></button>
  </div>

  <div class="container">
    <div id="drop-area" oncontextmenu="showTranslation(event)"></div>
    <div id="word-bank" oncontextmenu="playFullSentence(event)"></div>
    <div id="result"></div>
    <div class="score-summary" id="summary"></div>
  </div>

  <div id="trans-popup" onclick="this.style.display='none'">
    <span id="close-popup">&times;</span>
    <h3>Nghĩa tiếng Việt</h3>
    <div id="trans-text"></div>
  </div>

  <div class="footer-bar">
    <div class="footer-section">
      <span class="footer-label">Question:</span>
      <span id="current-question">1</span> / <span id="total-question">10</span>
    </div>

    <div class="footer-section">
      <span class="footer-label">⏱️ Time:</span> <span id="timer">0</span>s
    </div>

    <div class="footer-section">
      <button id="speed-btn" onclick="toggleSpeed()">Speed: 1x</button>
      <button onclick="checkSentence()">Check</button>
      <button onclick="undo()">Undo</button>
      <button onclick="restart()">Restart</button>
      <button onclick="showHint()">Hint</button>
      <button onclick="nextSentence()">Next</button>
      <button onclick="shuffleAll()">Shuffle All</button>
    </div>
  </div>

<script>
const originalSentences = [
  {
    id: 1,
    text: "David is Tom's older brother.",
    vi: "David là anh trai của Tom."
  },
  {
    id: 2,
    text: "He studies engineering at a university.",
    vi: "Anh ấy học ngành kỹ thuật tại một trường đại học."
  },
  {
    id: 3,
    text: "He lives in a small apartment near his school.",
    vi: "Anh ấy sống trong một căn hộ nhỏ gần trường học."
  },
  {
    id: 4,
    text: "David does not live with his family anymore.",
    vi: "David không còn sống cùng gia đình nữa."
  },
  {
    id: 5,
    text: "He is very busy with his classes every day.",
    vi: "Anh ấy rất bận với các lớp học mỗi ngày."
  },
  {
    id: 6,
    text: "He does not have much free time.",
    vi: "Anh ấy không có nhiều thời gian rảnh."
  },
  {
    id: 7,
    text: "He seldom comes home during the school year.",
    vi: "Anh ấy hiếm khi về nhà trong năm học."
  },
  {
    id: 8,
    text: "However, he calls his mother every week.",
    vi: "Tuy nhiên, anh ấy gọi cho mẹ mỗi tuần."
  },
  {
    id: 9,
    text: "Tom misses his older brother a lot.",
    vi: "Tom rất nhớ anh trai của mình."
  },
  {
    id: 10,
    text: "They see each other during the holidays.",
    vi: "Họ gặp nhau trong các kỳ nghỉ."
  },
  {
    id: 11,
    text: "The family enjoys spending time together.",
    vi: "Gia đình thích dành thời gian bên nhau."
  },
  {
    id: 12,
    text: "Tom thinks David is a hardworking student.",
    vi: "Tom nghĩ David là một học sinh chăm chỉ."
  },
  {
    id: 13,
    text: "He hopes to be like his brother someday.",
    vi: "Cậu ấy hy vọng một ngày nào đó sẽ giống anh trai mình."
  }
];
function shuffle(array) {
  return array.map(x => ({ val: x, sort: Math.random() }))
              .sort((a, b) => a.sort - b.sort)
              .map(x => x.val);
}

let sentences = shuffle([...originalSentences]);
let currentIndex = 0;
let correctWords = [];
let history = [];
let correctCount = 0;
let totalTime = 0;
let timer = 0;
let interval = null;
let popupTimeout = null;
let currentPlaybackRate = 1;

function toggleSpeed() {
    const btn = document.getElementById("speed-btn");
    if (currentPlaybackRate === 1) {
        currentPlaybackRate = 0.75;
        btn.classList.add("btn-speed-active");
    } else if (currentPlaybackRate === 0.75) {
        currentPlaybackRate = 0.5;
        btn.classList.add("btn-speed-active");
    } else {
        currentPlaybackRate = 1;
        btn.classList.remove("btn-speed-active");
    }
    btn.textContent = `Speed: ${currentPlaybackRate}x`;
}

function shuffleAll() {
  sentences = shuffle([...originalSentences]);
  currentIndex = 0;
  correctCount = 0;
  totalTime = 0;
  loadSentence(currentIndex);
}

function pronounce(word) {
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  utterance.rate = currentPlaybackRate;
  const voices = speechSynthesis.getVoices();
  utterance.voice = voices.find(v => v.lang === "en-US" && v.name.includes("Google")) || voices[0];
  speechSynthesis.speak(utterance);
}

function playSentenceAudio(index) {
  const sentenceId = sentences[index].id;
  const audio = new Audio(`sounds/Sound ${sentenceId}.mp3`);
  audio.playbackRate = currentPlaybackRate;
  
  audio.play().catch(e => {
    const utterance = new SpeechSynthesisUtterance(sentences[index].text);
    utterance.lang = "en-US";
    utterance.rate = currentPlaybackRate;
    speechSynthesis.speak(utterance);
  });
}

function showTranslation(event) {
    event.preventDefault();
    const popup = document.getElementById("trans-popup");
    const textEl = document.getElementById("trans-text");
    textEl.textContent = sentences[currentIndex].vi;
    popup.style.display = "block";
    if (popupTimeout) clearTimeout(popupTimeout);
    popupTimeout = setTimeout(() => { popup.style.display = "none"; }, 4500);
}

function playFullSentence(event) {
    event.preventDefault();
    playSentenceAudio(currentIndex);
}

function loadSentence(index) {
  clearInterval(interval);
  timer = 0;
  document.getElementById("timer").textContent = timer;
  interval = setInterval(() => {
    timer++;
    document.getElementById("timer").textContent = timer;
  }, 1000);

  document.getElementById("result").textContent = "";
  document.getElementById("summary").textContent = "";
  document.getElementById("current-question").textContent = index + 1;
  document.getElementById("total-question").textContent = sentences.length;

  const sentence = sentences[index];
  correctWords = sentence.text.replace(/\./g, " .").split(" ");
  const shuffled = shuffle(correctWords);

  history = [];
  const wordBank = document.getElementById("word-bank");
  wordBank.innerHTML = "";
  shuffled.forEach(word => {
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = word;
    span.onclick = () => {
      pronounce(word);
      selectWord(span);
    };
    wordBank.appendChild(span);
  });
  document.getElementById("drop-area").innerHTML = "";
}

function selectWord(span) {
  const text = span.textContent;
  span.classList.add("used");
  const newSpan = document.createElement("span");
  newSpan.className = "word";
  newSpan.textContent = text;
  newSpan.onclick = () => {
    newSpan.remove();
    span.classList.remove("used");
    const histIndex = history.findIndex(h => h.span === newSpan);
    if(histIndex > -1) history.splice(histIndex, 1);
  };
  document.getElementById("drop-area").appendChild(newSpan);
  history.push({ span: newSpan, source: span });
}

function undo() {
  const last = history.pop();
  if (last) {
    last.span.remove();
    last.source.classList.remove("used");
  }
}

function restart() { loadSentence(currentIndex); }

function checkSentence() {
  const dropWords = Array.from(document.getElementById("drop-area").children).map(el => el.textContent);
  const result = dropWords.join(" ") === correctWords.join(" ");
  if (result) {
    document.getElementById("result").textContent = "✅ Correct!";
    clearInterval(interval);
    totalTime += timer;
    correctCount++;

    // HIỆU ỨNG PHÁO BÔNG KHI ĐÚNG
    confetti({
      particleCount: 150,
      spread: 70,
      origin: { y: 0.6 },
      colors: ['#2ecc71', '#f1c40f', '#3498db', '#e74c3c']
    });

    playSentenceAudio(currentIndex);
  } else {
    document.getElementById("result").innerHTML = `❌ Try again!<br><span style="color:green;">✔ Correct answer: ${correctWords.join(" ")}</span>`;
    playSentenceAudio(currentIndex); 
  }
}

function showHint() {
  const dropWords = Array.from(document.getElementById("drop-area").children).map(el => el.textContent);
  const nextWord = correctWords[dropWords.length];
  if (nextWord) { alert("Hint: The next word is \"" + nextWord + "\""); }
}

function nextSentence() {
  if (currentIndex < sentences.length - 1) {
    currentIndex++;
    loadSentence(currentIndex);
  } else {
    clearInterval(interval);
    const avgTime = (correctCount > 0) ? (totalTime / correctCount).toFixed(2) : 0;
    document.getElementById("summary").innerHTML = `<br>🎯 Game Over!<br>✅ Correct sentences: ${correctCount}/${sentences.length}<br>⏱️ Average time: ${avgTime}s`;
  }
}

loadSentence(currentIndex);

function toggleSidebar(side) {
  const sidebar = document.getElementById(side + 'Sidebar');
  sidebar.classList.toggle('hidden');
}
window.addEventListener('keydown', function(event) {
  // Ngăn chặn cuộn trang mặc định của phím PageUp/PageDown
  if(['PageUp', 'PageDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
    event.preventDefault();
  }

  switch(event.key) {
    case 'PageDown':
    case 'ArrowRight':
      // Chế độ thông minh: 
      // Nếu câu trả lời đang hiển thị "Correct", bấm Next sẽ sang câu tiếp theo.
      // Nếu chưa Check hoặc đang sai, bấm Next sẽ thực hiện Check bài.
      const resultText = document.getElementById("result").textContent;
      if (resultText.includes("✅") || resultText.includes("Correct")) {
        nextSentence();
      } else {
        checkSentence();
      }
      break;
      
    case 'PageUp':
    case 'ArrowLeft':
      undo(); // Bấm nút lùi trên bút sẽ thực hiện lệnh Undo
      break;
      
    case 'b':
    case '.':
      showHint(); // Một số bút có nút tắt màn hình (phím b hoặc dấu chấm), dùng để hiện Hint
      break;

    case 'Escape':
      restart(); // Bấm Esc để chơi lại câu hiện tại
      break;
  }
});
</script>
</body>
