    function initInk() {
      inkCanvas = document.getElementById("inkCanvas");
      inkCtx = inkCanvas.getContext("2d");
      const container = document.getElementById("main-container");
      inkCanvas.width = container.offsetWidth;
      inkCanvas.height = container.offsetHeight;

      const getPos = (e) => {
        const rect = inkCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const start = (e) => { if (inkCanvas.classList.contains("drawing")) { isDrawing = true; const pos = getPos(e); inkCtx.beginPath(); inkCtx.moveTo(pos.x, pos.y); } };
      const move = (e) => { if (isDrawing) { const pos = getPos(e); inkCtx.lineTo(pos.x, pos.y); inkCtx.strokeStyle = "#d35400"; inkCtx.lineWidth = 4; inkCtx.lineCap = "round"; inkCtx.stroke(); } };
      const stop = () => { isDrawing = false; };

      inkCanvas.addEventListener("mousedown", start);
      inkCanvas.addEventListener("mousemove", move);
      window.addEventListener("mouseup", stop);
      inkCanvas.addEventListener("touchstart", (e) => { if(inkCanvas.classList.contains("drawing")) e.preventDefault(); start(e); }, {passive: false});
      inkCanvas.addEventListener("touchmove", (e) => { if(inkCanvas.classList.contains("drawing")) e.preventDefault(); move(e); }, {passive: false});
      inkCanvas.addEventListener("touchend", stop);
    }

    function toggleInk() {
      const active = inkCanvas.classList.toggle("drawing");
      document.getElementById("penBtn").textContent = active ? "Pen: ON" : "Pen: OFF";
      document.getElementById("penBtn").classList.toggle("active");
    }
    function clearInk() { inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height); }

    function speak(text) {
      const u = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      u.voice = voices.find(v => v.name.includes("Google US English") || v.name.includes("Samantha")) || voices[0];
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

   function loadNextQuestion() {
  speechSynthesis.cancel(); 

  const mainAudio = document.getElementById("mainAudio");
  if (mainAudio) {
    mainAudio.pause();
    mainAudio.currentTime = 0;
  }

  currentIdx++;

  // ✅ RANDOM khi hết vòng
  if (currentIdx >= miniGameData.length) {
    shuffleArray(miniGameData);
    currentIdx = 0;
  }

  if (!timerInterval) {
    timerInterval = setInterval(() => { 
      seconds++; 
      document.getElementById("timer").textContent = seconds; 
    }, 1000);
  }

  const container = document.getElementById("game-container");
  container.style.opacity = 0;

  setTimeout(() => {
    render();
    container.style.opacity = 1;
    container.style.transition = "opacity 0.3s";
  }, 100);
}
   /* Tìm đến hàm render() và thay thế bằng đoạn mã dưới đây */

// 1. Thêm hàm xáo trộn mảng (Fisher-Yates Shuffle)
function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex != 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

function render() {
  const q = miniGameData[currentIdx];
  
  // 2. Tạo một bản sao của options và xáo trộn nó
  const shuffledOptions = shuffleArray([...q.options]); 

  document.getElementById("game-container").innerHTML = `<h3>${wrapWords(q.question)}</h3><div class="options-grid">` + 
    shuffledOptions.map(o => `<div class="option-button" onclick="check(this,'${o.replace(/'/g, "\\'")}','${q.correct.replace(/'/g, "\\'")}')">${wrapWords(o)}</div>`).join("") + `</div>`;
  
  speak(q.question);
  attachWordLogic();
}
    function wrapWords(t) { return t.split(" ").map(w => `<span class="word" data-word="${w.toLowerCase().replace(/\W/g,'')}">${w}</span>`).join(" "); }

    function attachWordLogic() {
      document.querySelectorAll(".word").forEach(w => {
        w.onclick = (e) => {
          if (inkCanvas.classList.contains("drawing")) return;
          e.stopPropagation();
          const d = dictionary[w.dataset.word];
          if (d) {
            const p = document.getElementById("dictPopup");
            p.innerHTML = `<strong>${w.textContent}</strong> <span class="word-type">(${d.type})</span><br>${d.phonetic}<br>${d.meaning}`;
            p.style.display = "block"; p.style.top = (e.pageY + 10) + "px"; p.style.left = e.pageX + "px";
            speak(w.textContent);
          }
        };
      });
      document.getElementById("game-container").oncontextmenu = (e) => {
  e.preventDefault();
  // Lấy text và xóa khoảng trắng thừa ở 2 đầu
  const txt = e.target.closest("h3, .option-button")?.innerText.trim();
  
  if (txt && translations[txt]) {
    const p = document.getElementById("sentenceTranslation");
    p.innerHTML = translations[txt];
    p.style.display = "block"; 
    p.style.top = e.pageY + "px"; 
    p.style.left = e.pageX + "px";
  }
};
    }

    // XỬ LÝ ĐÚNG SAI
function check(btn, choice, ans) {
  if (btn.classList.contains('correct') || btn.classList.contains('incorrect')) return;

  // Chuẩn hóa dấu nháy cong thành thẳng và xóa khoảng trắng thừa
  const cleanChoice = choice.replace(/[\u2018\u2019]/g, "'").trim();
  const cleanAns = ans.replace(/[\u2018\u2019]/g, "'").trim();

  if (cleanChoice === cleanAns) { 
    btn.classList.add("correct"); 
    correct++; 
    correctAudio.play();
    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
  } else { 
    btn.classList.add("incorrect"); 
    incorrect++; 
    incorrectAudio.play();
    speak("Wrong answer. Correct is " + ans); 
  }
  document.getElementById("correctCount").textContent = correct;
  document.getElementById("incorrectCount").textContent = incorrect;
}
    function toggleSidebar(side) {
      const sb = document.querySelector('.sidebar.' + side);
      if (sb) sb.classList.toggle('visible');
    }

    window.onload = () => { initInk(); loadNextQuestion(); };
    document.addEventListener("click", () => { 
      document.getElementById("dictPopup").style.display = "none"; 
      document.getElementById("sentenceTranslation").style.display = "none"; 
    });
document.addEventListener("keydown", (e) => {
  console.log("KEY:", e.code);

  if (
    e.code === "PageDown" ||
    e.code === "ArrowRight" ||
    e.code === "Enter"
  ) {
    loadNextQuestion();
  }
});
