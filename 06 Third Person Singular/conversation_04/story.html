// --- AUDIO SYSTEM TỰ ĐỘNG (Web Audio API) ---
const AudioContextAPI = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioContextAPI();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playOsc(freq, type, delay, duration, volume = 0.1) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gainNode.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
}

function playSound(type) {
    initAudio();
    if(type === 'correct') {
        playOsc(523.25, 'sine', 0, 0.1);    
        playOsc(659.25, 'sine', 0.1, 0.1);  
        playOsc(783.99, 'sine', 0.2, 0.1);  
        playOsc(1046.50, 'sine', 0.3, 0.4); 
        
        setTimeout(() => {
            if(!audioCtx) return;
            let popOsc = audioCtx.createOscillator();
            let popGain = audioCtx.createGain();
            popOsc.type = 'square';
            popOsc.frequency.setValueAtTime(150, audioCtx.currentTime);
            popOsc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            popGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            popGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            popOsc.connect(popGain);
            popGain.connect(audioCtx.destination);
            popOsc.start();
            popOsc.stop(audioCtx.currentTime + 0.1);
        }, 150);
    } else {
        playOsc(150, 'sawtooth', 0, 0.3, 0.15);
        playOsc(140, 'sawtooth', 0.1, 0.3, 0.15);
    }
}

// --- LOGIC QUIZ ---
const quizData = [
  {
    question: "Where does the dog find the bone?",
    options: ["In a trash can", "In the park", "Under the bridge", "In the school"],
    correct: "In a trash can"
  },
  {
    question: "How does the dog feel when he finds the bone?",
    options: ["Sad", "Happy and lucky", "Angry", "Scared"],
    correct: "Happy and lucky"
  },
  {
    question: "What does the dog see when he looks down from the bridge?",
    options: ["A fish", "Another dog with a bone", "A piece of cheese", "A boat"],
    correct: "Another dog with a bone"
  },
  {
    question: "Why does the dog growl at the other dog?",
    options: ["Because the other dog is barking", "Because he wants to play", "Because he thinks the other bone is bigger", "Because he is scared"],
    correct: "Because he thinks the other bone is bigger"
  },
  {
    question: "What does the greedy dog decide to do?",
    options: ["Share his bone", "Run away", "Go to sleep", "Steal the other dog's bone"],
    correct: "Steal the other dog's bone"
  },
  {
    question: "What was the 'other dog' in the water really?",
    options: ["A wolf", "His brother", "His own reflection", "A fish"],
    correct: "His own reflection"
  },
  {
    question: "What happens to his bone when he barks for help?",
    options: ["He eats it", "It drops and sinks to the bottom", "The other dog takes it", "It floats away"],
    correct: "It drops and sinks to the bottom"
  },
  {
    question: "What is the moral of the story?",
    options: ["Always wash your bone", "Be happy with what you have. Don't be greedy", "Dogs can't swim", "Don't look into the water"],
    correct: "Be happy with what you have. Don't be greedy"
  }
];
let currentQIndex = 0;

function wrapWordsForDict(text) {
  return text.split(/\s+/).map(w => {
    const clean = w.replace(/[.,!?"“”]/g, "").toLowerCase();
    const cleanEscaped = clean.replace(/'/g, "\\'");
    return `<span class="word" onclick="handleWordClick(event, '${cleanEscaped}')">${w}</span>`;
  }).join(" ");
}

function renderQuiz() {
  const qp = document.getElementById("quizContent");

  if (currentQIndex >= quizData.length) {
    qp.innerHTML = `
      <h4 style='text-align:center; color:#28a745; margin-top:20px; font-size: 26px;'>
        🎉 You finished the quiz! 🎉
      </h4>
      <button class='quiz-option' style='margin-top:20px; text-align:center;' onclick='resetQuiz()'>
        Play Again 🔄
      </button>`;
      
    if (typeof confetti !== 'undefined') {
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, zIndex: 3000 });
    }
    return;
  }

  const q = quizData[currentQIndex];

  let html = `
    <div>
      <div style="font-weight:bold; margin-bottom:15px; font-size:24px;">
        Question ${currentQIndex + 1}: ${wrapWordsForDict(q.question)}
      </div>
  `;

  q.options.forEach(opt => {
    const isCorrect = (opt === q.correct);
    html += `
      <button class="quiz-option"
        onclick="checkAns(this, ${isCorrect})">
        ${wrapWordsForDict(opt)}
      </button>`;
  });

  html += `</div>`;
  qp.innerHTML = html;
}

function checkAns(btn, isCorrect) {
  initAudio();
  
  const btns = btn.parentElement.querySelectorAll('.quiz-option');
  btns.forEach(b => b.style.pointerEvents = 'none'); 
  
  if (isCorrect) {
    btn.classList.add('correct');
    playSound('correct'); 
    
    if (typeof confetti !== 'undefined') {
        var duration = 1.2 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 3000 };

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        var interval = setInterval(function() {
          var timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) { return clearInterval(interval); }
          var particleCount = 50 * (timeLeft / duration);
          
          confetti(Object.assign({}, defaults, { particleCount,
            origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
          }));
          confetti(Object.assign({}, defaults, { particleCount,
            origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
          }));
        }, 250);
    }

    setTimeout(() => {
      currentQIndex++;
      renderQuiz();
    }, 1500); 
  } else {
    btn.classList.add('wrong');
    btn.classList.add('shake'); 
    playSound('wrong'); 
    
    setTimeout(() => {
      btn.classList.remove('wrong');
      btn.classList.remove('shake');
      btns.forEach(b => b.style.pointerEvents = 'auto');
    }, 800);
  }
}

function resetQuiz() {
  currentQIndex = 0;
  renderQuiz();
}

function toggleQuiz() {
  const qp = document.getElementById("quizPanel");
  const topBtn = document.getElementById("quizBtnTop");
  
  if (qp.style.display === "none" || qp.style.display === "") {
    qp.style.display = "block";
    topBtn.classList.add("active");
    topBtn.innerHTML = "<span>❓</span> Quiz: ON";
    if(currentQIndex === 0) renderQuiz();
  } else {
    qp.style.display = "none";
    topBtn.classList.remove("active");
    topBtn.innerHTML = "<span>❓</span> Quiz: OFF";
  }
}

function renderSentence(s){
  const words=s.text.split(/\s+/);
  bubble.innerHTML=words.map((w)=>{
    const clean=w.replace(/[.,!?"“”]/g,"").toLowerCase();
    const cleanEscaped=clean.replace(/'/g,"\\'");
    return `<span class="word" onclick="handleWordClick(event, '${cleanEscaped}')">${w}</span>`;
  }).join(" ");
  bubble.dataset.activeStart=s.start;
}

bubble.addEventListener('contextmenu', function(e) {
  e.preventDefault(); 
  
  const activeStart = bubble.dataset.activeStart;
  if (activeStart) {
    const s = sentences.find(x => String(x.start) === activeStart);
    if (s && s.translation) {
      dictPopup.innerHTML = `
        <b style="color: #c36a2d; font-size: 16px;">🌐 Dịch câu:</b>
        <p style="margin-top: 8px; font-size: 16px; color: #333;">${s.translation}</p>
      `;
      
      dictPopup.style.left = e.clientX + "px";
      dictPopup.style.top = (e.clientY - 90) + "px";
      dictPopup.style.display = "block";

      clearTimeout(window.dictTimeout);
      window.dictTimeout = setTimeout(() => {
        dictPopup.style.display = "none";
      }, 4000);
    }
  }
});

function handleWordClick(event, word) {
  if(event) event.stopPropagation();

  if(!canvas.classList.contains("pen-active")) {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  const data = dictionary[word];
  if (data) {
    dictPopup.innerHTML = `
      <b style="text-transform: capitalize;">${word}</b> 
      <i style="color: #666; font-size: 16px;">(${data.type || 'n/a'})</i><br>
      <span style="color: #c36a2d; font-size: 16px;">${data.phonetic}</span>
      <p style="margin-top: 8px;">➡️ ${data.meaning}</p>
    `;
    
    dictPopup.style.left = event.clientX + "px";
    dictPopup.style.top = (event.clientY - 130) + "px";
    dictPopup.style.display = "block";

    clearTimeout(window.dictTimeout);
    window.dictTimeout = setTimeout(() => {
      dictPopup.style.display = "none";
    }, 3000);
  }
}

function toggleSubtitle(){
  subtitleOn = !subtitleOn;
  const btn = document.getElementById("subBtn");

  if(subtitleOn){
    btn.innerHTML = "<span>💬</span> Subtitle: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>💬</span> Subtitle: OFF";
    btn.classList.remove("active");
    bubble.innerHTML = ""; 
  }
}

function syncSubtitle(){
  if(!isSyncing) return;

  const ct = video.currentTime;

  if(!subtitleOn){
    bubble.innerHTML = "";
  } else {
    const s = sentences.find(x => ct >= x.start && ct <= x.end);
    if(s && bubble.dataset.activeStart != s.start) renderSentence(s);
  }

  animationFrameId = requestAnimationFrame(syncSubtitle);
}

function playConversation(){
  cancelAnimationFrame(animationFrameId);
  isSyncing=true;
  video.play();
  syncSubtitle();
}

function pauseToggle(){
  video.paused ? video.play() : video.pause();
}

function stopConversation(){
  video.pause(); video.currentTime=0; isSyncing=false;
  bubble.innerText="Bấm Play All để bắt đầu học!";
}

function handleVideoClick(){ video.paused?playConversation():pauseToggle(); }
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

function getPos(e) {
  if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

// --- XỬ LÝ SỰ KIỆN CHO MOUSE (PC) VÀ TOUCH (ĐIỆN THOẠI) ---

// Sự kiện chuột (Mouse)
canvas.addEventListener("mousedown", (e) => {
  if(!canvas.classList.contains("pen-active")) return;
  isDrawing = true; 
  ctx.beginPath();
  const p = getPos(e); 
  ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("mousemove", (e) => {
  if(!isDrawing) return;
  const p = getPos(e);
  ctx.lineTo(p.x, p.y); 
  ctx.strokeStyle = "red"; 
  ctx.lineWidth = 4;
  ctx.lineCap = 'round'; 
  ctx.stroke();
});

canvas.addEventListener("mouseup", () => isDrawing = false);
canvas.addEventListener("mouseleave", () => isDrawing = false);


// Sự kiện cảm ứng (Touch)
canvas.addEventListener("touchstart", (e) => { 
  if(!canvas.classList.contains("pen-active")) return;
  if (e.cancelable) e.preventDefault(); 
  isDrawing = true; 
  ctx.beginPath();
  const p = getPos(e); 
  ctx.moveTo(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", (e) => { 
  if (e.cancelable) e.preventDefault(); 
  if(!isDrawing) return; 
  const p = getPos(e);
  ctx.lineTo(p.x, p.y); 
  ctx.strokeStyle = "red"; 
  ctx.lineWidth = 4;
  ctx.lineCap = 'round'; 
  ctx.stroke(); 
}, { passive: false });

canvas.addEventListener("touchend", () => isDrawing = false);


window.addEventListener("keydown", (e) => {
  if (e.key === "PageDown" || e.key === "ArrowRight" || e.key === "PageUp" || e.key === "ArrowLeft" || e.code === "Space") {
    e.preventDefault(); handleVideoClick();
  }
});

window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });
</script>
