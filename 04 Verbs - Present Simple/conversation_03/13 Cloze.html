    const placedHistory = [];
    let selectedWord = null;
    let selectedVoice = null, isPenActive = false, isMusicPlaying = false;

    // Logic ẩn/hiện Video
    function toggleVideo() {
      const videoBox = document.getElementById('videoBox');
      const btn = document.getElementById('toggleVideoBtn');
      const videoEl = document.getElementById('videoLesson');
      
      if (videoBox.style.display === 'none') {
        videoBox.style.display = 'block';
        btn.textContent = 'Hide Video';
      } else {
        videoBox.style.display = 'none';
        videoEl.pause(); // Dừng video khi ẩn
        btn.textContent = 'Show Video';
      }
    }

    // Canvas Pen logic
    const canvas = document.getElementById('penCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    function togglePen() {
      isPenActive = !isPenActive;
      canvas.style.pointerEvents = isPenActive ? "auto" : "none";
      const btn = document.getElementById('penToggle');
      btn.textContent = isPenActive ? "Pen: ON" : "Pen";
      btn.classList.toggle('active-mode', isPenActive);
    }
    function clearPen() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function startDrawing(e) { if (!isPenActive) return; drawing = true; ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); }
    function draw(e) { if (!drawing || !isPenActive) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke(); }
    function stopDrawing() { drawing = false; }
    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }
    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }); canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }); canvas.addEventListener('touchend', stopDrawing);

    function toggleMusic() {
      const music = document.getElementById('bgMusic'); const btn = document.getElementById('musicBtn');
      if (!isMusicPlaying) { music.play(); btn.textContent = "Music: ON"; }
      else { music.pause(); btn.textContent = "Music"; }
      isMusicPlaying = !isMusicPlaying; btn.classList.toggle('active-mode', isMusicPlaying);
    }

    function showAnswers() {
      document.querySelectorAll('.drop-zone').forEach(zone => { zone.textContent = zone.getAttribute('data-answer'); zone.style.backgroundColor = "#e3f2fd"; zone.style.borderStyle = "solid"; });
      document.getElementById("dragWords").innerHTML = "";
    }

    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      selectedVoice = voices.find(v => v.name.includes("Google US English") || v.name.includes("Samantha")) || voices.find(v => v.lang.includes("en-US"));
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

    function speak(text) { 
      speechSynthesis.cancel(); 
      const utter = new SpeechSynthesisUtterance(text); 
      if (selectedVoice) utter.voice = selectedVoice;
      utter.pitch = 1.1; utter.rate = 0.9;
      speechSynthesis.speak(utter); 
    }

    function wrapWords(text) {
      let html = text;
      const sorted = [...targetWords].sort((a, b) => b.length - a.length);
      const usedMap = {}; 
      sorted.forEach(word => {
        const regex = new RegExp(`\\b${word}\\b`, 'g');
        html = html.replace(regex, match => {
            if (!usedMap[word]) {
                usedMap[word] = true;
                return `<span class="drop-zone" data-answer="${word}"></span>`;
            }
            return match;
        });
      });
      return html.replace(/(<span class="drop-zone".*?<\/span>)|(\b\w+\b)/g, (m, d, w) => d ? d : `<span class="text-word">${w}</span>`);
    }

    function renderDragWords() {
      const box = document.getElementById("dragWords");
      box.innerHTML = '';

      targetWords
        .filter(w => !placedHistory.some(p => p.word === w))
        .sort(() => Math.random() - 0.5)
        .forEach(word => {

          const el = document.createElement('div');
          el.className = 'drag-word';
          el.textContent = word;

          // CLICK thay vì drag
          el.onclick = () => {
            document.querySelectorAll('.drag-word').forEach(w => 
              w.style.background = "#bbdefb"
            );

            el.style.background = "#ffcc80";
            selectedWord = word;
          };

          box.appendChild(el);
        });
    }

    function handleWordPlacement(zone, word, x, y) { 
      zone.textContent = word; 
      zone.style.backgroundColor = "#e3f2fd"; 
      speak(word); 
      showPopup(word, x, y); 
      placedHistory.push({ word, zone }); 
      renderDragWords(); 
    }

    function checkAnswers() {
      let correct = 0;
      document.querySelectorAll('.drop-zone').forEach(zone => {
        const exp = zone.getAttribute('data-answer'); 
        const act = zone.textContent.trim();
        if (act !== "") { 
          zone.style.backgroundColor = exp === act ? "#c8f7c5" : "#ffcdd2"; 
          if (exp === act) correct++; 
        }
      });

      // Kiểm tra nếu trả lời đúng hết toàn bộ
      if (correct === targetWords.length) {
        // 1. Phát âm thanh
        const fireworkAudio = document.getElementById('fireworkSound');
        if (fireworkAudio) {
          fireworkAudio.currentTime = 0; // Tua lại từ đầu
          fireworkAudio.play().catch(e => console.log("Lỗi phát âm thanh:", e));
        }

        // 2. Hiệu ứng pháo bông bắn trong 3 giây
        const duration = 3 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 3000 };

        function randomInRange(min, max) {
          return Math.random() * (max - min) + min;
        }

        const interval = setInterval(function() {
          const timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) {
            return clearInterval(interval);
          }
          const particleCount = 50 * (timeLeft / duration);
          // Bắn từ lề trái
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
          // Bắn từ lề phải
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);

        // 3. Hiển thị thông báo (delay một chút để kịp nhìn pháo bông)
        setTimeout(() => {
          alert(`Tuyệt vời! Bạn đã trả lời đúng tất cả: ${correct}/${targetWords.length}`);
        }, 500);

      } else {
        // Nếu chưa đúng hết thì chỉ báo điểm như cũ
        alert(`Kết quả: ${correct}/${targetWords.length}`);
      }
    }

    function translateSentence(element, x, y) {
      const sentence = element.closest('.content-box').innerText;
      const clickedText = element.innerText;
      const lines = Object.keys(translationDict);
      for(let line of lines) {
        if(line.includes(clickedText)) {
          showTransPopup(translationDict[line], x, y);
          break;
        }
      }
    }

    function showPopup(word, x, y) {
      closePopups(); const data = phoneticDict[word.toLowerCase()]; const pop = document.getElementById('popup');
      document.getElementById('popupWord').innerText = word;
      if (data) { document.getElementById('popupPhonetic').innerHTML = `<span class="word-type">(${data.type})</span><strong>Phiên âm:</strong> ${data.phonetic}<br><strong>Nghĩa:</strong> ${data.meaning}`; }
      pop.style.display = 'block'; pop.style.left = `${Math.min(x, window.innerWidth - 260)}px`; pop.style.top = `${Math.min(y - 140, window.innerHeight - 150)}px`;
    }

    function showTransPopup(text, x, y) { closePopups(); const pop = document.getElementById('transPopup'); document.getElementById('transContent').innerText = text; pop.style.display = 'block'; pop.style.left = `${Math.min(x, window.innerWidth - 320)}px`; pop.style.top = `${Math.min(y - 100, window.innerHeight - 200)}px`; }
    function closePopups() { document.getElementById('popup').style.display = 'none'; document.getElementById('transPopup').style.display = 'none'; }

    function init() {
      const box = document.getElementById("textContent"); box.innerHTML = wrapWords(originalText); renderDragWords();
      
      document.querySelectorAll('.drop-zone').forEach(zone => {
        zone.onclick = (e) => {
          // Tính năng Hoàn Tác (Click thẳng vào ô đã điền chữ)
          if (!selectedWord && zone.textContent.trim() !== "") {
            zone.textContent = "";
            zone.style.backgroundColor = "#fffde7"; // Màu gốc
            
            // Xóa từ khỏi lịch sử để nó hiện lại ở danh sách dưới
            const historyIdx = placedHistory.findIndex(p => p.zone === zone);
            if (historyIdx > -1) {
              placedHistory.splice(historyIdx, 1);
            }
            renderDragWords();
            return;
          }

          if (!selectedWord) return;

          // Nếu ô đã có chữ, xóa chữ cũ về danh sách trước khi điền chữ mới
          if (zone.textContent.trim() !== "") {
            const historyIdx = placedHistory.findIndex(p => p.zone === zone);
            if (historyIdx > -1) {
              placedHistory.splice(historyIdx, 1);
            }
          }

          handleWordPlacement(zone, selectedWord, e.clientX, e.clientY);
          selectedWord = null;
        };
      });

      box.addEventListener('click', e => { 
        const el = e.target.closest('.text-word'); 
        if (el) { showPopup(el.textContent.replace(/[.,]/g, ''), e.clientX, e.clientY); speak(el.textContent); } 
      });
      box.addEventListener('contextmenu', e => { e.preventDefault(); translateSentence(e.target, e.clientX, e.clientY); });
    }

    document.getElementById('undoBtn').onclick = () => { const last = placedHistory.pop(); if (last) { last.zone.textContent = ''; last.zone.style.backgroundColor = "#fffde7"; renderDragWords(); } };
    function toggleSidebar(side) { document.querySelector(`.sidebar.${side}`).classList.toggle('visible'); }
    init();
    loadVoices();
// --- REMOTE CONTROL (ĐIỀU KHIỂN TỪ XA) ---
    window.addEventListener('keydown', function(e) {
  const video = document.getElementById('videoLesson');
  const key = e.key.toLowerCase();

  // ===== 1. PLAY / PAUSE =====
  if (key === 'b' || key === '.') {
    e.preventDefault();
    video.paused ? video.play() : video.pause();
    return;
  }

  // ===== 2. TUA NHANH (→ hoặc PageDown giữ nguyên) =====
  if (key === 'arrowright') {
    e.preventDefault();
    video.currentTime += 5; // tua +5 giây
    return;
  }

  // ===== 3. TUA LÙI (←) =====
  if (key === 'arrowleft') {
    e.preventDefault();
    video.currentTime -= 5; // lùi -5 giây
    return;
  }

  // ===== 4. ÂM LƯỢNG =====
  if (key === 'arrowup') {
    e.preventDefault();
    video.volume = Math.min(1, video.volume + 0.1);
    return;
  }

  if (key === 'arrowdown') {
    e.preventDefault();
    video.volume = Math.max(0, video.volume - 0.1);
    return;
  }

  // ===== 5. ẨN / HIỆN VIDEO =====
  if (key === 'v') {
    e.preventDefault();
    toggleVideo();
    return;
  }

  // ===== 6. CHECK GAME (giữ PageDown riêng) =====
  if (key === 'pagedown') {
    e.preventDefault();
    checkAnswers();
    return;
  }

  // ===== 7. UNDO =====
  if (key === 'pageup') {
    e.preventDefault();
    const last = placedHistory.pop(); 
    if (last) { 
      last.zone.textContent = ''; 
      last.zone.style.backgroundColor = "#fffde7"; 
      renderDragWords(); 
    }
    return;
  }

  // ===== 8. RESET =====
  if (key === 'escape') {
    location.reload();
  }
});

  </script>
