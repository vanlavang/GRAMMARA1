  const sb = document.getElementById(id);

let currentQIndex = 0;

function wrapWordsForDict(text) {
  return text.split(/\s+/).map(w => {
    const clean = w.replace(/[.,!?]/g, "").toLowerCase();
    const cleanEscaped = clean.replace(/'/g, "\\'");
    return `<span class="word" onclick="handleWordClick(event, '${cleanEscaped}')">${w}</span>`;
  }).join(" ");
}

function renderQuiz() {
  const qp = document.getElementById("quizContent");

  if (currentQIndex >= quizData.length) {
    qp.innerHTML = `
      <h4 style='text-align:center; color:#28a745; margin-top:20px;'>
        🎉 You finished the quiz!
      </h4>
      <button class='quiz-option' style='margin-top:20px; text-align:center;' onclick='resetQuiz()'>
        Play Again
      </button>`;
    return;
  }

  const q = quizData[currentQIndex];

  let html = `
    <div>
      <div style="font-weight:bold; margin-bottom:15px; font-size:24px;">
        Question ${currentQIndex + 1}: ${wrapWordsForDict(q.question)}
      </div>
  `;

  q.options.forEach(opt => {
    // FIX BUG: So sánh giá trị boolean ngay tại đây để tránh lỗi parse chuỗi trong onclick HTML
    const isCorrect = (opt === q.correct);
    html += `
      <button class="quiz-option"
        onclick="checkAns(this, ${isCorrect})">
        ${wrapWordsForDict(opt)}
      </button>`;
  });

  html += `</div>`;
  qp.innerHTML = html;
}

function checkAns(btn, isCorrect) {
  const btns = btn.parentElement.querySelectorAll('.quiz-option');
  btns.forEach(b => b.style.pointerEvents = 'none'); 
  if (isCorrect) {
    btn.classList.add('correct');
    setTimeout(() => {
      currentQIndex++;
      renderQuiz();
    }, 1000);
  } else {
    btn.classList.add('wrong');
    setTimeout(() => {
      btn.classList.remove('wrong');
      btns.forEach(b => b.style.pointerEvents = 'auto');
    }, 800);
  }
}

function resetQuiz() {
  currentQIndex = 0;
  renderQuiz();
}

function toggleQuiz() {
  const qp = document.getElementById("quizPanel");
  const topBtn = document.getElementById("quizBtnTop");
  
  if (qp.style.display === "none" || qp.style.display === "") {
    qp.style.display = "block";
    topBtn.classList.add("active");
    topBtn.innerHTML = "<span>❓</span> Quiz: ON";
    if(currentQIndex === 0) renderQuiz();
  } else {
    qp.style.display = "none";
    topBtn.classList.remove("active");
    topBtn.innerHTML = "<span>❓</span> Quiz: OFF";
  }
}

const sentences = [
  { text: "Oh no! The screen is black. It doesn't work.", start: 0, end: 5, translation: "Ôi không! Màn hình đen thui rồi. Nó không hoạt động." },

  { text: "Morning, Emma. Why do you look so stressed?", start: 23, end: 26, translation: "Chào buổi sáng Emma. Sao trông cậu căng thẳng thế?" },
  { text: "Hi Anna! My phone is broken. Look. The screen is black. It won't turn on.", start: 26, end: 34, translation: "Chào Anna! Điện thoại mình hỏng rồi. Nhìn này. Màn hình đen xì. Nó không lên nguồn." },
  { text: "Oh, that's sad. Did you charge it?", start: 34, end: 37, translation: "Ồ, buồn nhỉ. Cậu đã sạc pin chưa?" },
  { text: "Yes, I tried. No light, no sound. Nothing.", start: 37, end: 43, translation: "Rồi, mình thử rồi. Không đèn, không tiếng. Không có gì hết." },
  { text: "Hm, maybe the battery is broken.", start: 43, end: 47, translation: "Hm, có lẽ pin bị hỏng rồi." },
  { text: "Without my phone, I feel lost. I can't play music, I can't check messages, I can't even see the time.", start: 47, end: 56, translation: "Không có điện thoại, mình thấy lạc lõng quá. Không nghe nhạc, không check tin nhắn, thậm chí chẳng biết mấy giờ nữa." },
  { text: "Don't panic. Let's take it to the repair shop. Maybe they can fix it.", start: 56, end: 61, translation: "Đừng hoảng hốt. Cùng mang nó ra tiệm sửa chữa đi. Có lẽ họ sửa được đấy." },
  { text: "The repair shop? Where?", start: 61, end: 64, translation: "Tiệm sửa chữa á? Ở đâu cơ?" },
  { text: "On Green Street, near the café. We can walk there.", start: 64, end: 68, translation: "Ở phố Green, gần quán cà phê. Chúng ta có thể đi bộ ra đó." },
  { text: "Okay... I have no choice. Let's go.", start: 68, end: 112, translation: "Được rồi... mình không còn cách nào khác. Đi thôi." },
  { text: "Without my phone, I feel nervous. I can't check the time. I can't listen to music.", start: 112, end: 120, translation: "Không có điện thoại, mình thấy lo lo. Không xem được giờ, không nghe được nhạc." },
  { text: "Don't worry. Look around. The morning is beautiful.", start: 120, end: 125, translation: "Đừng lo. Nhìn quanh đi. Buổi sáng đẹp thế này mà." },
  { text: "Mmm... maybe. But it feels strange. Usually I just look at my screen.", start: 125, end: 133, translation: "Mmm... có lẽ vậy. Nhưng cảm giác lạ lắm. Thường thì mình chỉ dán mắt vào màn hình thôi." },
  { text: "Try to look outside. The street, the people, the shops.", start: 133, end: 138, translation: "Thử nhìn ra ngoài xem. Đường phố, mọi người, các cửa hàng." },
  { text: "Oh, the smell. Wow, the bakery smells so good.", start: 138, end: 144, translation: "Ồ, cái mùi này. Wow, tiệm bánh thơm quá đi mất." },
  { text: "Yes, fresh bread, warm bread.", start: 144, end: 148, translation: "Đúng rồi, bánh mì mới ra lò, bánh mì nóng hổi." },
  { text: "Usually, I just order food online. Now I see real bread, right here.", start: 148, end: 156, translation: "Bình thường mình toàn đặt đồ ăn qua mạng. Giờ mình mới thấy ổ bánh mì thực sự, ngay tại đây." },
  { text: "See? Real bread, real life. The smell is sweet. Mmm, it makes me hungry.", start: 156, end: 205, translation: "Thấy chưa? Bánh thật, đời thực. Mùi thật ngọt ngào. Mmm, làm mình đói bụng rồi đây." },
  { text: "Fresh bread is always better than food on a screen.", start: 205, end: 210, translation: "Bánh mì tươi luôn tốt hơn đồ ăn trên màn hình." },

  { text: "Yes, people go to work every morning.", start: 213, end: 216, translation: "Đúng vậy, mọi người đi làm mỗi sáng mà." },

  { text: "Exactly. Full means no space.", start: 221, end: 225, translation: "Chính xác. 'Full' nghĩa là không còn chỗ." },

  { text: "See? You can learn new things by looking around.", start: 233, end: 238, translation: "Thấy không? Cậu có thể học được nhiều điều mới bằng cách quan sát xung quanh." },
  { text: "Oh wow, the trees are tall. The sky is so blue.", start: 238, end: 244, translation: "Ôi chao, mấy cái cây cao thật. Bầu trời thật là xanh." },
  { text: "Beautiful, right?", start: 244, end: 246, translation: "Đẹp đúng không?" },
  { text: "Yes. I usually look down at my screen. Now I look up.", start: 246, end: 253, translation: "Đúng vậy. Thường mình hay cúi đầu nhìn màn hình. Giờ mình đã nhìn lên." },
  { text: "Up is better.", start: 253, end: 257, translation: "Nhìn lên thì tốt hơn." },
  { text: "The birds sing. The air feels fresh. I like this.", start: 257, end: 303, translation: "Chim hót líu lo. Không khí thật trong lành. Mình thích thế này." },
  { text: "Yes, listen carefully. This is the real world.", start: 303, end: 309, translation: "Đúng vậy, hãy nghe kỹ nhé. Đây mới là thế giới thực." },

  { text: "Oh, the children are so happy. They laugh so much.", start: 458, end: 504, translation: "Ồ, bọn trẻ trông hạnh phúc quá. Chúng cười đùa thật nhiều." },

  { text: "Yes. Small things, big joy.", start: 512, end: 516, translation: "Đúng vậy. Điều nhỏ bé, niềm vui lớn." },

  { text: "The park feels peaceful.", start: 542, end: 545, translation: "Công viên thật yên bình." },

  { text: "Mmm, the smell is sweet. My mouth feels hungry.", start: 558, end: 603, translation: "Mmm, mùi thật ngọt. Làm mình thèm quá." },

  { text: "I usually buy them online. Now I see the real fruit, here in front of me.", start: 605, end: 612, translation: "Mình thường mua chúng qua mạng. Giờ mình thấy trái cây thật, ngay trước mặt luôn." },
  { text: "Touch it, smell it, choose it. That is better.", start: 612, end: 617, translation: "Chạm vào, ngửi thử, chọn lấy nó. Như vậy tốt hơn nhiều." },
  { text: "Yes. Real is better.", start: 617, end: 620, translation: "Đúng vậy. Đồ thật thì tốt hơn." },
  { text: "The street is alive. So many faces, so many voices.", start: 620, end: 627, translation: "Đường phố thật sống động. Bao nhiêu khuôn mặt, bao nhiêu giọng nói." },
  { text: "Yes. You see more without a phone in your hand.", start: 627, end: 631, translation: "Đúng vậy. Cậu sẽ thấy nhiều điều hơn khi không cầm điện thoại trên tay." },
  { text: "True. Today feels different. Strange, but also good.", start: 631, end: 638, translation: "Thật đấy. Hôm nay cảm giác thật khác. Lạ lẫm, nhưng cũng rất tuyệt." },
  { text: "This is a lesson. The world is bigger than the phone.", start: 638, end: 643, translation: "Đây là một bài học. Thế giới này rộng lớn hơn chiếc điện thoại nhiều." },
  { text: "Mmm... maybe this broken phone is a small gift.", start: 643, end: 649, translation: "Mmm... có lẽ chiếc điện thoại hỏng này lại là một món quà nhỏ." },
  { text: "Hello. How can I help you?", start: 650, end: 652, translation: "Xin chào. Tôi có thể giúp gì cho hai cô?" },
  { text: "Hi... my phone is broken. The screen is black. It doesn't start.", start: 652, end: 658, translation: "Chào anh... điện thoại của tôi bị hỏng. Màn hình đen thui. Nó không khởi động được." },
  { text: "Okay, let me see.", start: 659, end: 671, translation: "Được rồi, để tôi xem nào." },
  { text: "Oh, I feel nervous. Can you fix it?", start: 701, end: 704, translation: "Ôi mình thấy lo quá. Anh có sửa được không?" },
  { text: "Mmm, yes. I think it's only the battery. I can change it.", start: 705, end: 710, translation: "Mmm, được. Tôi nghĩ chỉ do pin thôi. Tôi có thể thay nó." },
  { text: "Really? That's great!", start: 710, end: 712, translation: "Thật sao? Tuyệt quá!" },
  { text: "It will take about one hour.", start: 712, end: 714, translation: "Sẽ mất khoảng một tiếng đồng hồ." },
  { text: "One hour? Okay, we can wait.", start: 714, end: 717, translation: "Một tiếng ư? Được, chúng tôi có thể đợi." },
  { text: "Yes, we can wait. Thank you.", start: 718, end: 720, translation: "Vâng, chúng tôi chờ được. Cảm ơn anh." },
  { text: "One more hour without a phone. One more hour to enjoy life.", start: 721, end: 726, translation: "Thêm một tiếng không điện thoại. Thêm một tiếng để tận hưởng cuộc sống." },
  { text: "Ah, maybe you're right. Today I saw the bakery, the flowers, the park. All without a phone.", start: 727, end: 735, translation: "À, có lẽ cậu đúng. Hôm nay mình đã thấy tiệm bánh, những bông hoa, công viên. Tất cả đều không cần điện thoại." },
  { text: "Yes. And you smiled more.", start: 736, end: 738, translation: "Đúng vậy. Và cậu đã cười nhiều hơn đấy." },
  { text: "Mmm... maybe I did.", start: 738, end: 740, translation: "Mmm... có lẽ vậy thật." },
  { text: "So many people need their phones fixed. Phones break, but life doesn't stop.", start: 741, end: 746, translation: "Rất nhiều người cần sửa điện thoại. Điện thoại có thể hỏng, nhưng cuộc sống thì không dừng lại." },
  { text: "True. Life goes on. People walk, talk, smile... even without phones.", start: 747, end: 753, translation: "Đúng. Đời vẫn trôi. Mọi người vẫn đi bộ, trò chuyện, mỉm cười... kể cả khi không có điện thoại." },
  { text: "Yes. We sometimes forget that. Today is a big lesson.", start: 754, end: 759, translation: "Đúng. Đôi khi chúng ta quên mất điều đó. Hôm nay là một bài học lớn." },
  { text: "Here you are. New battery. It works now.", start: 800, end: 803, translation: "Của cô đây. Pin mới nhé. Nó chạy rồi đấy." },
  { text: "Oh wow! The screen is on. My phone is alive again. Thank you so much.", start: 804, end: 810, translation: "Oh wow! Màn hình sáng rồi. Điện thoại mình 'sống' lại rồi. Cảm ơn anh rất nhiều." },
  { text: "You're welcome. Take care of it.", start: 811, end: 812, translation: "Không có gì. Nhớ giữ gìn nó nhé." },
  { text: "Yes, I will. Thank you. Strange... I have my phone again, but I don't feel the same.", start: 813, end: 819, translation: "Vâng tôi sẽ nhớ. Cảm ơn anh. Lạ thật... mình có điện thoại lại rồi, nhưng cảm giác không còn như trước." },
  { text: "What do you mean?", start: 820, end: 821, translation: "Ý cậu là sao?" },
  { text: "Before, I felt lost without it. Now I feel free with or without it.", start: 822, end: 827, translation: "Trước đây, mình thấy lạc lõng nếu thiếu nó. Giờ mình thấy tự do dù có nó hay không." },
  { text: "That's good. You learned something.", start: 828, end: 830, translation: "Tốt đấy. Cậu đã học được điều gì đó rồi." },

function renderSentence(s){
  const words=s.text.split(/\s+/);
  bubble.innerHTML=words.map((w)=>{
    const clean=w.replace(/[.,!?]/g,"").toLowerCase();
    return `<span class="word" onclick="handleWordClick(event, '${clean}')">${w}</span>`;
  }).join(" ");
  bubble.dataset.activeStart=s.start;
}

bubble.addEventListener('contextmenu', function(e) {
  e.preventDefault(); 
  
  const activeStart = bubble.dataset.activeStart;
  if (activeStart) {
    const s = sentences.find(x => String(x.start) === activeStart);
    if (s && s.translation) {
      dictPopup.innerHTML = `
        <b style="color: #c36a2d; font-size: 16px;">🌐 Dịch câu:</b>
        <p style="margin-top: 8px; font-size: 16px; color: #333;">${s.translation}</p>
      `;
      
      dictPopup.style.left = e.clientX + "px";
      dictPopup.style.top = (e.clientY - 90) + "px";
      dictPopup.style.display = "block";

      clearTimeout(window.dictTimeout);
      window.dictTimeout = setTimeout(() => {
        dictPopup.style.display = "none";
      }, 4000);
    }
  }
});

function handleWordClick(event, word) {
  // Ngăn chặn sự kiện click lan truyền ra ngoài nút đáp án của Quiz
  if(event) event.stopPropagation();

  if(!canvas.classList.contains("pen-active")) {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  const data = dictionary[word];
  if (data) {
    dictPopup.innerHTML = `
      <b style="text-transform: capitalize;">${word}</b> 
      <i style="color: #666; font-size: 16px;">(${data.type || 'n/a'})</i><br>
      <span style="color: #c36a2d; font-size: 16px;">${data.phonetic}</span>
      <p style="margin-top: 8px;">➡️ ${data.meaning}</p>
    `;
    
    dictPopup.style.left = event.clientX + "px";
    dictPopup.style.top = (event.clientY - 130) + "px";
    dictPopup.style.display = "block";

    clearTimeout(window.dictTimeout);
    window.dictTimeout = setTimeout(() => {
      dictPopup.style.display = "none";
    }, 3000);
  }
}

function toggleSubtitle(){
  subtitleOn = !subtitleOn;
  const btn = document.getElementById("subBtn");

  if(subtitleOn){
    btn.innerHTML = "<span>💬</span> Subtitle: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>💬</span> Subtitle: OFF";
    btn.classList.remove("active");
    bubble.innerHTML = ""; 
  }
}

function syncSubtitle(){
  if(!isSyncing) return;

  const ct = video.currentTime;

  if(!subtitleOn){
    bubble.innerHTML = "";
  } else {
    const s = sentences.find(x => ct >= x.start && ct <= x.end);
    if(s && bubble.dataset.activeStart != s.start) renderSentence(s);
  }

  animationFrameId = requestAnimationFrame(syncSubtitle);
}

function playConversation(){
  cancelAnimationFrame(animationFrameId);
  isSyncing=true;
  video.play();
  syncSubtitle();
}

function pauseToggle(){
  video.paused ? video.play() : video.pause();
}

function stopConversation(){
  video.pause(); video.currentTime=0; isSyncing=false;
  bubble.innerText="Bấm Play All để bắt đầu học!";
}

function handleVideoClick(){ video.paused?playConversation():pauseToggle(); }
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

function getPos(e) {
  if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener("touchstart", (e) => { 
  if(!canvas.classList.contains("pen-active")) return;
  if (e.cancelable) e.preventDefault(); 
  isDrawing = true; ctx.beginPath();
  const p = getPos(e); ctx.moveTo(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", (e) => { 
  if (e.cancelable) e.preventDefault(); 
  if(!isDrawing) return; 
  const p = getPos(e);
  ctx.lineTo(p.x, p.y); ctx.strokeStyle = "red"; ctx.lineWidth = 4;
  ctx.lineCap = 'round'; ctx.stroke(); 
}, { passive: false });

canvas.addEventListener("touchend", () => isDrawing = false);

window.addEventListener("keydown", (e) => {
  if (e.key === "PageDown" || e.key === "ArrowRight" || e.key === "PageUp" || e.key === "ArrowLeft" || e.code === "Space") {
    e.preventDefault(); handleVideoClick();
  }
});

window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });
</script>
