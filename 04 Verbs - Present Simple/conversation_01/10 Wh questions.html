<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>01 Be Verbs 1 - WH Questions</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* TONE MÀU NÂU VÀ NÂU NHẠT CHỦ ĐẠO */
      --primary: #8b5e3c;         /* Nâu chủ đạo */
      --primary-hover: #704b30;   /* Nâu đậm khi hover */
      --secondary: #fdf5eb;       /* Nâu cực nhạt (màu kem) cho nền nút/box */
      --accent: #d35400;          /* Cam đất/Nâu đỏ tạo điểm nhấn */
      --text-main: #3e2723;       /* Nâu đen cho chữ chính (đọc không mỏi mắt) */
      --text-muted: #795548;      /* Nâu xám cho chữ phụ */
      --bg-color: #f5ebe0;        /* Nâu nhạt làm màu nền tổng thể */
      --card-bg: #ffffff;         /* Trắng cho các thẻ/bảng để nổi bật nội dung */
      --border-color: #e6ccb2;    /* Nâu nhạt cho viền */
      
      --success: #10b981;         /* Xanh lá cho đáp án đúng */
      --danger: #ef4444;          /* Đỏ cho đáp án sai / Bút vẽ */
      
      --shadow-sm: 0 1px 2px 0 rgb(139 94 60 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(139 94 60 / 0.1), 0 2px 4px -2px rgb(139 94 60 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(139 94 60 / 0.1), 0 4px 6px -4px rgb(139 94 60 / 0.1);
      --radius-md: 12px;
      --radius-lg: 24px;
      --radius-full: 9999px;
    }

    @font-face {
      font-family: 'UTM Avo';
      src: url('fonts/UTM Avo.ttf') format('truetype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'UTM Avo', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-top: 100px;
      padding-bottom: 120px !important;
      margin: 0 !important; 
      min-height: 100vh;
      background-image: radial-gradient(circle at top right, #fffcf9, #f5ebe0);
    }

    /* HEADER - GLASSMORPHISM */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
    }

    header nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
    }

    header button {
      background-color: transparent;
      border: 1px solid var(--border-color);
      padding: 10px 24px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 16px;
      font-weight: 500; 
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    header button:hover {
      background-color: var(--secondary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    header button.active-nav {
      font-weight: 700; 
      background-color: var(--primary); 
      border-color: var(--primary);     
      color: white;
      box-shadow: var(--shadow-md);
    }

    /* SIDEBARS */
    .sidebar {
      width: 200px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: fixed;
      top: 130px;
      bottom: 0;
      overflow-y: auto;
      z-index: 100;
      box-shadow: var(--shadow-lg);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

    .sidebar.left {
      left: 0;
      transform: translateX(-100%); 
      border-right: 1px solid var(--border-color);
      border-top-right-radius: var(--radius-lg);
    }
    .sidebar.left.visible { transform: translateX(0); }

    .sidebar.right {
      right: 0;
      transform: translateX(100%);
      border-left: 1px solid var(--border-color);
      border-top-left-radius: var(--radius-lg);
    }
    .sidebar.right.visible { transform: translateX(0); }

    .sidebar button {
      font-size: 16px;
      padding: 14px 16px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-align: left;
      color: var(--text-main);
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .sidebar button:hover {
      background: var(--secondary);
      border-color: var(--border-color);
    }

    .sidebar button.active {
      background-color: var(--primary); 
      color: white;               
      box-shadow: var(--shadow-md);
    }
    .sidebar button.active b { color: white; }

    /* TOGGLE BUTTONS */
    .toggle-btn {
      position: fixed;
      top: 80px;
      z-index: 90;
      padding: 12px 18px; 
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-btn:hover { 
      background: var(--secondary); 
      color: var(--primary-hover); 
    }
    
    .toggle-left { 
      left: 0; 
      border-left: none; 
      border-radius: 0 var(--radius-full) var(--radius-full) 0; 
    }
    
    .toggle-right { 
      right: 0; 
      border-right: none; 
      border-radius: var(--radius-full) 0 0 var(--radius-full); 
    }

    /* MAIN CONTENT AREA */
    .outer-box {
      background: var(--card-bg);
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 1200px;
      margin: 20px auto;
      border: 1px solid rgba(255,255,255,0.7);
      position: relative;
      z-index: 10;
    }

    h2 {
      color: var(--text-main);
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
      font-weight: 700;
    }

    audio {
      display: block;
      margin: 0 auto 30px auto;
      height: 40px;
      border-radius: var(--radius-full);
      outline: none;
    }

    .question-box {
      background: var(--secondary);
      padding: 30px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
      text-align: center;
    }

    #questionLabel {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      display: block;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .word {
      cursor: pointer;
      color: var(--text-main);
      border-bottom: 2px dotted var(--primary);
      transition: color 0.2s;
    }
    .word:hover { color: var(--accent); border-bottom-color: var(--accent); }

    input {
      font-size: 28px;
      padding: 12px 20px;
      width: 100%;
      max-width: 1000px;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--primary);
      font-weight: 600;
      background: var(--card-bg);
      transition: all 0.3s ease;
      text-align: center;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(139, 94, 60, 0.15); 
    }

    .feedback {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 700;
      min-height: 30px;
    }
    .correct { color: var(--success); }
    .wrong { color: var(--danger); }

    /* ACTION BUTTONS */
    #navigation {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-md);
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    button:active { transform: translateY(0); }

    #submitBtn {
      display: block;
      margin: 20px auto 0;
      background: var(--success);
    }
    #submitBtn:hover { background: #059669; }

    #result {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      color: var(--primary);
    }

    /* DICTIONARY POPUP */
    #dictionaryPopup {
      display: none;
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 25px;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 25px -5px rgba(139,94,60,0.2), 0 10px 10px -5px rgba(139,94,60,0.1);
      font-size: 22px;
      z-index: 9999;
      width: 90%;
      max-width: 450px;
      text-align: center;
    }

    #dictWord { font-weight: 700; font-size: 32px; color: var(--primary); margin-bottom: 5px; }
    #dictPhonetic { font-style: italic; color: var(--text-muted); font-size: 20px; }
    #dictType { color: var(--accent); font-weight: 600; font-size: 18px; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
    #dictMeaning { margin: 15px 0 20px; font-weight: 500; color: var(--text-main); }
    
    #dictionaryPopup button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 0 5px;
      background: var(--secondary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    #dictionaryPopup button:hover { background: var(--bg-color); color: var(--primary); }

    /* CANVAS */
    #paintCanvas {
        position: fixed;
        top: 0; 
        left: 0;
        z-index: 5; 
        pointer-events: none;
        display: block;
    }

    #paintCanvas.active {
        pointer-events: auto;
        z-index: 9998; 
        cursor: crosshair;
    }

    /* FLOATING FOOTER DOCK */
    footer {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        padding: 12px 25px;
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border-color);
        z-index: 9999;
    }

    footer button {
        padding: 10px 20px;
        border-radius: var(--radius-full);
        border: 1px solid transparent;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        background: var(--secondary);
        color: var(--primary);
        box-shadow: var(--shadow-sm);
    }
    
    footer button:hover { background: var(--border-color); }
    
    footer button#penBtn.active { background: var(--danger); color: white; border-color: var(--danger); }
    footer button#musicBtn.active { background: var(--primary); color: white; border-color: var(--primary); }
    footer button:last-child { background: #fff0e6; color: var(--danger); }
    footer button:last-child:hover { background: #fecaca; }

  </style>
</head>

  <script>
    const questions = [
      { q: "1. What does the woman do first in the morning?", a: ["She wakes up.", "She wakes up", "The woman wakes up.", "The woman wakes up"] },
      { q: "2. What does she do after waking up?", a: ["She takes a shower.", "She takes a shower", "The woman takes a shower.", "The woman takes a shower"] },
      { q: "3. Does she get dressed before breakfast?", a: ["Yes, she gets dressed before breakfast.", "Yes, she gets dressed before breakfast", "Yes, she does.", "Yes, she does"] },
      { q: "4. When does the woman get up?", a: ["She gets up at 6.", "She gets up at 6", "The woman gets up at 6.", "The woman gets up at 6", "She gets up at 6:00.", "She gets up at 6:00"] },
      { q: "5. What does the man say about her wake-up time?", a: ["He says that is early.", "He says that is early", "The man says that is early.", "The man says that is early", "He says it is early.", "He says it is early"] },
      { q: "6. Does the woman like mornings?", a: ["Yes, she likes mornings.", "Yes, she likes mornings", "Yes, she does.", "Yes, she does"] },
      { q: "7. Who asks the questions?", a: ["The man asks the questions.", "The man asks the questions", "The man does.", "The man does", "He does.", "He does"] },
      { q: "8. What does the woman eat in the morning?", a: ["She eats breakfast.", "She eats breakfast", "The woman eats breakfast.", "The woman eats breakfast"] }
    ];
   
const dictionary = {
  // ===== PRONOUNS =====
  "i": { meaning: "tôi", phonetic: "/aɪ/", type: "pronoun" },
  "you": { meaning: "bạn", phonetic: "/juː/", type: "pronoun" },
  "he": { meaning: "anh ấy", phonetic: "/hiː/", type: "pronoun" },
  "she": { meaning: "cô ấy", phonetic: "/ʃiː/", type: "pronoun" },
  "that": { meaning: "điều đó / cái đó", phonetic: "/ðæt/", type: "pronoun" },

  // ===== QUESTION WORDS =====
  "what": { meaning: "cái gì / gì", phonetic: "/wɒt/", type: "question word" },
  "when": { meaning: "khi nào", phonetic: "/wen/", type: "question word" },
  "who": { meaning: "ai", phonetic: "/huː/", type: "question word" },

  // ===== VERBS =====
  "do": { meaning: "làm / trợ động từ", phonetic: "/duː/", type: "verb" },
  "does": { meaning: "trợ động từ", phonetic: "/dʌz/", type: "auxiliary verb" },
  "is": { meaning: "là / thì / ở", phonetic: "/ɪz/", type: "verb" },
  "wake": { meaning: "tỉnh giấc", phonetic: "/weɪk/", type: "verb" },
  "take": { meaning: "tắm (take a shower) / lấy", phonetic: "/teɪk/", type: "verb" },
  "get": { meaning: "nhận / trở nên / dậy (get up)", phonetic: "/ɡet/", type: "verb" },
  "dressed": { meaning: "mặc quần áo", phonetic: "/drest/", type: "verb / adjective" },
  "eat": { meaning: "ăn", phonetic: "/iːt/", type: "verb" },
  "know": { meaning: "biết", phonetic: "/nəʊ/", type: "verb" },
  "like": { meaning: "thích", phonetic: "/laɪk/", type: "verb" },
  "say": { meaning: "nói", phonetic: "/seɪ/", type: "verb" },
  "says": { meaning: "nói (số ít)", phonetic: "/sez/", type: "verb" },

  // ===== ADJECTIVES / ADVERBS / PREPOSITIONS =====
  "early": { meaning: "sớm", phonetic: "/ˈɜːli/", type: "adjective / adverb" },
  "though": { meaning: "mặc dù vậy", phonetic: "/ðəʊ/", type: "adverb" },
  "up": { meaning: "lên / dậy", phonetic: "/ʌp/", type: "adverb / preposition" },
  "in": { meaning: "vào / trong", phonetic: "/ɪn/", type: "preposition" },
  "at": { meaning: "tại / lúc", phonetic: "/æt/", type: "preposition" },

  // ===== NOUNS =====
  "morning": { meaning: "buổi sáng", phonetic: "/ˈmɔːnɪŋ/", type: "noun" },
  "mornings": { meaning: "những buổi sáng", phonetic: "/ˈmɔːnɪŋz/", type: "noun (plural)" },
  "shower": { meaning: "vòi hoa sen / tắm vòi hoa sen", phonetic: "/ˈʃaʊə(r)/", type: "noun" },
  "breakfast": { meaning: "bữa sáng", phonetic: "/ˈbrekfəst/", type: "noun" },
  "time": { meaning: "thời gian / giờ", phonetic: "/taɪm/", type: "noun" },
  "man": { meaning: "người đàn ông", phonetic: "/mæn/", type: "noun" },
  "woman": { meaning: "người phụ nữ", phonetic: "/ˈwʊmən/", type: "noun" },
  "questions": { meaning: "câu hỏi", phonetic: "/ˈkwestʃənz/", type: "noun (plural)" },

  // ===== OTHERS =====
  "oh": { meaning: "ồ", phonetic: "/əʊ/", type: "exclamation" },
  "wow": { meaning: "chà / ồ", phonetic: "/waʊ/", type: "exclamation" },
  "and": { meaning: "và", phonetic: "/ænd/", type: "conjunction" }
};

    let currentPage = 0;
    const userAnswers = Array(questions.length).fill("");
    let googleUSVoice = null;

    speechSynthesis.onvoiceschanged = () => {
      const voices = speechSynthesis.getVoices();
      googleUSVoice = voices.find(v => v.name.toLowerCase().includes("google") && v.lang === "en-US");
    };

    function speak(text, callback) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      if (googleUSVoice) utter.voice = googleUSVoice;
      utter.onend = callback || (() => {});
      utter.onerror = callback || (() => {}); 
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    function normalizeWord(word) {
      word = word.toLowerCase().replace(/[^a-z']/g, "");
      if (word.endsWith("'s")) return { base: word.slice(0, -2), possessive: true };
      return { base: word };
    }

    function startQuiz() {
      currentPage = 0;
      document.getElementById("playBtn").style.display = "none";
      document.getElementById("prevBtn").style.display = "inline-block";
      document.getElementById("nextBtn").style.display = "inline-block";
      document.getElementById("resetBtn").style.display = "none";
      renderPage();
    }

    function renderPage() {
      const q = questions[currentPage];
      const quizDiv = document.getElementById("quiz");

      // Xử lý an toàn các dấu nháy đơn
      const highlighted = q.q.replace(/\b[\w’']+\b/g, (word) => {
        let safeWord = word.replace(/'/g, "\\'"); 
        return `<span class="word" onclick="showDict('${safeWord}')">${word}</span>`;
      });

      quizDiv.innerHTML = `
        <label id="questionLabel">${highlighted}</label><br>
        <input type="text" id="answerInput" onkeypress="if(event.key === 'Enter') submitAnswer()" placeholder="Type your answer here..." />
        <button onclick="submitAnswer()" id="submitBtn">Submit Answer</button>
        <div class="feedback" id="feedback"></div>
      `;

      speak(q.q);

      setTimeout(() => { document.getElementById("answerInput").focus(); }, 100);

      document.getElementById("prevBtn").style.display = currentPage > 0 ? "inline-block" : "none";
      document.getElementById("nextBtn").style.display = currentPage < questions.length - 1 ? "inline-block" : "none";
      
      if(userAnswers[currentPage]) {
          document.getElementById("answerInput").value = userAnswers[currentPage];
      }
    }

    function submitAnswer() {
      let input = document.getElementById("answerInput").value.trim().replace(/\s+/g, ' ');
      if(!input) return; 
      
      userAnswers[currentPage] = input;
      const correctAnswers = questions[currentPage].a;
      const feedbackDiv = document.getElementById("feedback");

      // So sánh chính xác phân biệt hoa thường
      if (correctAnswers.includes(input)) {
        feedbackDiv.textContent = "Correct!";
        feedbackDiv.className = "feedback correct";
      } else {
        feedbackDiv.textContent = `Wrong! Correct answer: ${correctAnswers[0]}`;
        feedbackDiv.className = "feedback wrong";
      }

      speak(feedbackDiv.textContent);
      updateScore();
    }

    function nextPage() {
      if (currentPage < questions.length - 1) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    function resetQuiz() {
      currentPage = 0;
      userAnswers.fill("");
      document.getElementById("result").textContent = "";
      document.getElementById("resetBtn").style.display = "none";
      document.getElementById("playBtn").style.display = "inline-block";
      document.getElementById("prevBtn").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("quiz").innerHTML = "";
      speechSynthesis.cancel();
    }

    function updateScore() {
      const resultEl = document.getElementById("result");
      let correct = 0;
      for (let i = 0; i < questions.length; i++) {
        if (questions[i].a.includes(userAnswers[i])) correct++;
      }
      resultEl.textContent = `Score: ${correct} / ${questions.length}`;
      if (currentPage === questions.length - 1) {
        document.getElementById("resetBtn").style.display = "inline-block";
      }
    }

    function speakWord() {
      const word = document.getElementById("dictWord").textContent;
      speak(word);
    }

    function showDict(rawWord) {
      const info = normalizeWord(rawWord);
      const dictData = dictionary[info.base];

      if (dictData) {
        let finalMeaning = dictData.meaning;
        if (info.possessive) {
          finalMeaning = "của " + finalMeaning; 
        }

        document.getElementById("dictWord").textContent = rawWord;
        document.getElementById("dictPhonetic").textContent = dictData.phonetic;
        
        // Hiển thị từ loại có bọc ngoặc
        const typeText = dictData.type ? `(${dictData.type})` : "";
        document.getElementById("dictType").textContent = typeText;

        document.getElementById("dictMeaning").textContent = finalMeaning;
        document.getElementById("dictionaryPopup").style.display = "block";
        speakWord();
      } else {
        document.getElementById("dictWord").textContent = rawWord;
        document.getElementById("dictPhonetic").textContent = "";
        document.getElementById("dictType").textContent = ""; 
        document.getElementById("dictMeaning").textContent = "(Từ này chưa có trong từ điển)";
        document.getElementById("dictionaryPopup").style.display = "block";
      }
    }

    function closeDict() {
      document.getElementById("dictionaryPopup").style.display = "none";
    }

    function toggleSidebar(side) {
      const sidebar = document.querySelector(`.sidebar.${side}`);
      sidebar.classList.toggle('visible');
    }

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bgMusic');
    let isPainting = false;
    let penActive = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight; 
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function toggleMusic() {
        const btn = document.getElementById('musicBtn');
        if (bgMusic.paused) {
            bgMusic.play().catch(() => alert("Click vào màn hình để cho phép phát nhạc"));
            btn.textContent = "🎵 Music: ON";
            btn.classList.add('active');
        } else {
            bgMusic.pause();
            btn.textContent = "🎵 Music: OFF";
            btn.classList.remove('active');
        }
    }

    function togglePen() {
        penActive = !penActive;
        const btn = document.getElementById('penBtn');
        if (penActive) {
            canvas.classList.add('active');
            btn.textContent = "✏️ Pen: ON";
            btn.classList.add('active');
        } else {
            canvas.classList.remove('active');
            btn.textContent = "✏️ Pen: OFF";
            btn.classList.remove('active');
            isPainting = false;
        }
    }

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function getEventPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
        if (!penActive) return;
        isPainting = true;
        const pos = getEventPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        if (e.cancelable) e.preventDefault();
    }

    function doDraw(e) {
        if (!isPainting || !penActive) return;
        const pos = getEventPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.stroke();
        if (e.cancelable) e.preventDefault();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', doDraw);
    window.addEventListener('mouseup', () => isPainting = false);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', doDraw, { passive: false });
    canvas.addEventListener('touchend', () => isPainting = false);

// ===== REMOTE CONTROL (BÚT TRÌNH CHIẾU) =====
document.addEventListener("keydown", function(e) {
        const key = e.key.toLowerCase();
        
        // BẢO VỆ: Nếu học sinh đang gõ trong ô Input, sẽ bỏ qua phím tắt chữ 'p' và mũi tên
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
            if (key === "enter") {
                const submitBtn = document.getElementById("submitBtn");
                if (submitBtn) submitBtn.click();
            }
            return; 
        }

        if (key === "arrowright" || key === "pagedown") nextPage();
        if (key === "arrowleft" || key === "pageup") prevPage();
        if (key === "enter") {
            const submitBtn = document.getElementById("submitBtn");
            if (submitBtn) submitBtn.click();
        }
        if (key === "p") togglePen();
    });

document.addEventListener("contextmenu", function(e) {
  e.preventDefault();

  const text = e.target.innerText?.trim();

  if (text && translations[text]) {
    const popup = document.getElementById("dictionaryPopup");

    document.getElementById("dictWord").textContent = text;
    document.getElementById("dictPhonetic").textContent = "";
    document.getElementById("dictType").textContent = "Translation";
    document.getElementById("dictMeaning").textContent = translations[text];

    popup.style.display = "block";
  }
});

  "8. What does the woman eat in the morning?": "Người phụ nữ ăn gì vào buổi sáng?"
