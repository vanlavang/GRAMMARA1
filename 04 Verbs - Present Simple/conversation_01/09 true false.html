  <script>
    const audioPlayer = document.getElementById('mainAudioControl');
    const fireworkSound = document.getElementById('fireworkSound');
    const wrongSound = document.getElementById('wrongSound');

    function toggleSidebar(side) {
      document.querySelector(`.sidebar.${side}`).classList.toggle('visible');
    }

    const questions = [
  { q: "The woman wakes up and eats breakfast.", a: true },
  { q: "The woman does not take a shower.", a: false },
  { q: "The woman gets up at 6.", a: true },
  { q: "The man says 6 is late.", a: false },
  { q: "The woman likes mornings.", a: true }
];

const dictionary = {

  // ===== ARTICLES =====
  "the": { type: "Article", meaning: "mạo từ xác định", phonetic: "/ðə/" },
  "a": { type: "Article", meaning: "một", phonetic: "/ə/" },

  // ===== PRONOUNS =====
  "woman": { type: "Noun", meaning: "người phụ nữ", phonetic: "/ˈwʊmən/" },
  "man": { type: "Noun", meaning: "người đàn ông", phonetic: "/mæn/" },

  // ===== VERBS =====
  "wake": { type: "Verb", meaning: "thức dậy", phonetic: "/weɪk/" },
  "wakes": { type: "Verb", meaning: "thức dậy", phonetic: "/weɪks/" },
  "eat": { type: "Verb", meaning: "ăn", phonetic: "/iːt/" },
  "eats": { type: "Verb", meaning: "ăn", phonetic: "/iːts/" },
  "take": { type: "Verb", meaning: "tắm / thực hiện", phonetic: "/teɪk/" },
  "get": { type: "Verb", meaning: "trở nên / thức dậy", phonetic: "/ɡet/" },
  "gets": { type: "Verb", meaning: "thức dậy", phonetic: "/ɡets/" },
  "say": { type: "Verb", meaning: "nói", phonetic: "/seɪ/" },
  "says": { type: "Verb", meaning: "nói", phonetic: "/sez/" },
  "like": { type: "Verb", meaning: "thích", phonetic: "/laɪk/" },
  "likes": { type: "Verb", meaning: "thích", phonetic: "/laɪks/" },

  // ===== AUXILIARY VERBS =====
  "does": { type: "Auxiliary Verb", meaning: "trợ động từ", phonetic: "/dʌz/" },
  "is": { type: "Verb (be)", meaning: "là", phonetic: "/ɪz/" },

  // ===== ADVERBS =====
  "not": { type: "Adverb", meaning: "không", phonetic: "/nɒt/" },

  // ===== NOUNS =====
  "breakfast": { type: "Noun", meaning: "bữa sáng", phonetic: "/ˈbrekfəst/" },
  "shower": { type: "Noun", meaning: "tắm", phonetic: "/ˈʃaʊə(r)/" },
  "morning": { type: "Noun", meaning: "buổi sáng", phonetic: "/ˈmɔːnɪŋ/" },
  "mornings": { type: "Noun (plural)", meaning: "những buổi sáng", phonetic: "/ˈmɔːnɪŋz/" },

  // ===== ADJECTIVES =====
  "late": { type: "Adjective", meaning: "muộn", phonetic: "/leɪt/" },

  // ===== PREPOSITIONS =====
  "at": { type: "Preposition", meaning: "lúc", phonetic: "/æt/" },

  // ===== NUMBERS =====
  "6": { type: "Number", meaning: "số 6", phonetic: "/sɪks/" },

  // ===== CONJUNCTION =====
  "and": { type: "Conjunction", meaning: "và", phonetic: "/ænd/" },
"up": { type: "Adverb", meaning: "dậy / lên", phonetic: "/ʌp/" }
};
const translations = {
  "The woman wakes up and eats breakfast.": "Người phụ nữ thức dậy và ăn sáng.",
  "The woman does not take a shower.": "Người phụ nữ không tắm.",
  "The woman gets up at 6.": "Người phụ nữ thức dậy lúc 6 giờ.",
  "The man says 6 is late.": "Người đàn ông nói 6 giờ là muộn.",
  "The woman likes mornings.": "Người phụ nữ thích buổi sáng."
};
    let currentIndex = 0;
    let score = 0;
    let incorrectScore = 0; // Thêm biến đếm câu sai
    let startTime = Date.now();
    let timerInterval;
    let inkCanvas, inkCtx, isDrawing = false; // Các biến cho Pen

    function speakQuestion(text) {
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      const femaleVoice = voices.find(v => 
        (v.name.includes('Female') || v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Zira')) && v.lang.startsWith('en')
      );
      if (femaleVoice) utter.voice = femaleVoice;
      utter.lang = 'en-US';
      utter.rate = 0.85;
      utter.pitch = 1.1;
      speechSynthesis.speak(utter);
    }

    function speakWord(text) {
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      speechSynthesis.speak(utter);
    }

    function updateTimer() {
      document.getElementById("timer").textContent = Math.floor((Date.now() - startTime) / 1000);
    }

    function loadQuestion() {
      const q = questions[currentIndex].q;
      document.getElementById("counter").textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextBtn").classList.add("hidden");
      document.getElementById("score").textContent = score;

      const words = q.replace(/[.,!?']/g, "").split(" ");
      document.getElementById("question").innerHTML = words.map(word => 
        `<span class="word" onclick="showMeaning(event, '${word.toLowerCase()}')">${word}</span>`
      ).join(" ");

      audioPlayer.currentTime = 0;
      setTimeout(() => speakQuestion(q), 500);
    }

    function submitAnswer(userAnswer) {
      const correct = questions[currentIndex].a;
      const fb = document.getElementById("feedback");
      if (userAnswer === correct) {
        fb.textContent = "✅ Correct!"; fb.style.color = "green";
        score++;
        startFireworkEffect();
      } else {
        fb.textContent = "❌ Wrong!"; fb.style.color = "red";
        incorrectScore++;
        wrongSound.currentTime = 0;
        wrongSound.play();
      }
      // Cập nhật điểm trên thanh trên cùng và thanh footer
      document.getElementById("score").textContent = score;
      document.getElementById("correctCountDisplay").textContent = score;
      document.getElementById("incorrectCountDisplay").textContent = incorrectScore;
      
      document.getElementById("nextBtn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion();
      } else {
        clearInterval(timerInterval);
        document.querySelector(".container").innerHTML = `<h2>🎉 Completed!</h2><p>Correct: ${score}/${questions.length}</p><button class="btn next-btn" onclick="location.reload()">Restart</button>`;
      }
    }

    function showMeaning(event, word) {
  event.stopPropagation();

  // Xử lý dạng sở hữu: beths → beth
  if (word.endsWith("s") && !dictionary[word]) {
    word = word.slice(0, -1);
  }

  const popup = document.getElementById("dictPopup");
  const entry = dictionary[word];

  if (entry) {
    document.getElementById("dictContent").innerHTML = `
      <strong>${word}</strong><br>
      (${entry.type})<br>
      ${entry.phonetic}<br>
      👉 ${entry.meaning}
    `;
  } else {
    document.getElementById("dictContent").innerHTML =
      `<strong>${word}</strong><br>No definition`;
  }

  popup.style.left = event.pageX + 'px';
  popup.style.top = event.pageY + 'px';
  popup.style.display = 'block';

  speakWord(word);
}

    function closePopup() { document.getElementById("dictPopup").style.display = "none"; }

    window.onload = () => {
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => { if(currentIndex === 0) loadQuestion(); };
      }
      loadQuestion();
      timerInterval = setInterval(updateTimer, 1000);
      initFireworks();
      initInk(); // Khởi tạo Pen
    };

    document.addEventListener('click', (e) => {
      if (!document.getElementById('dictPopup').contains(e.target)) closePopup();
    });

    // --- TOOLS (MUSIC & PEN) ---
    function toggleMusic() {
      const bg = document.getElementById('bgMusic');
      const btn = document.getElementById('musicBtn');
      if (bg.paused) { bg.play(); btn.textContent = "Music: ON"; btn.classList.add('active'); }
      else { bg.pause(); btn.textContent = "Music: OFF"; btn.classList.remove('active'); }
    }

    function initInk() {
      inkCanvas = document.getElementById("inkCanvas");
      inkCtx = inkCanvas.getContext("2d");
      const resize = () => { inkCanvas.width = window.innerWidth; inkCanvas.height = window.innerHeight; };
      window.addEventListener('resize', resize);
      resize();

      const getPos = (e) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX, y: clientY };
      };

      const start = (e) => { if (!inkCanvas.classList.contains("drawing")) return; isDrawing = true; const pos = getPos(e); inkCtx.beginPath(); inkCtx.moveTo(pos.x, pos.y); };
      const move = (e) => { if (!isDrawing) return; const pos = getPos(e); inkCtx.lineTo(pos.x, pos.y); inkCtx.strokeStyle = "red"; inkCtx.lineWidth = 3; inkCtx.stroke(); };
      const stop = () => { isDrawing = false; };

      inkCanvas.addEventListener("mousedown", start); inkCanvas.addEventListener("mousemove", move); window.addEventListener("mouseup", stop);
      inkCanvas.addEventListener("touchstart", (e) => { if(inkCanvas.classList.contains("drawing")) e.preventDefault(); start(e); }, {passive: false});
      inkCanvas.addEventListener("touchmove", (e) => { if(inkCanvas.classList.contains("drawing")) e.preventDefault(); move(e); }, {passive: false});
      inkCanvas.addEventListener("touchend", stop);
    }

    function toggleInk() {
      const active = inkCanvas.classList.toggle("drawing");
      document.getElementById("penBtn").textContent = active ? "Pen: ON" : "Pen: OFF";
      document.getElementById("penBtn").classList.toggle("active");
    }
    function clearInk() { inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height); }

    // --- PHÁO HOA ---
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initFireworks() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', initFireworks);

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
        this.alpha = 1; this.friction = 0.95;
      }
      draw() {
        ctx.globalAlpha = this.alpha; ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2, false);
        ctx.fillStyle = this.color; ctx.fill();
      }
      update() {
        this.velocity.x *= this.friction; this.velocity.y *= this.friction;
        this.velocity.y += 0.05; this.x += this.velocity.x; this.y += this.velocity.y;
        this.alpha -= 0.01;
      }
    }

    function startFireworkEffect() {
      fireworkSound.currentTime = 0; fireworkSound.play();
      const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
      for (let i = 0; i < 3; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * (canvas.height * 0.5);
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let j = 0; j < 50; j++) particles.push(new Particle(x, y, color));
      }
      animate();
    }

    let animationId;
    function animate() {
      animationId = requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        if (p.alpha > 0) { p.update(); p.draw(); }
        else { particles.splice(i, 1); }
      });
      if (particles.length === 0) cancelAnimationFrame(animationId);
    }
function highlightButton(btn) {
  btn.classList.add("active");

  setTimeout(() => {
    btn.classList.remove("active");
  }, 300);
}

// --- NÂNG CẤP REMOTE CONTROL SUPPORT ---
document.addEventListener("keydown", function(e) {
  const key = e.key;
  const keyCode = e.keyCode;

  // 1. Nút "Tới" (Right / PageDown)
  if (key === "ArrowRight" || key === "PageDown" || keyCode === 34) {
    e.preventDefault();
    const nextBtn = document.getElementById("nextBtn");
    
    // Nếu nút Next đang hiện (tức là đã trả lời xong câu hỏi) -> Chuyển câu tiếp
    if (nextBtn && !nextBtn.classList.contains("hidden")) {
      nextBtn.click();
    } 
    // Nếu bài đã hoàn thành (màn hình báo Completed) -> Chuyển sang bài tiếp theo (10 Wh questions)
    else if (document.querySelector('.container').innerHTML.includes('Completed')) {
      window.location.href = '10 Wh questions.html';
    }
    // Nếu đang ở màn hình câu hỏi -> Chọn đáp án True
    else {
      const trueBtn = document.getElementById("trueBtn");
      if (trueBtn) { highlightButton(trueBtn); trueBtn.click(); }
    }
  }

  // 2. Nút "Lùi" (Left / PageUp) -> Chọn đáp án False
  if (key === "ArrowLeft" || key === "PageUp" || keyCode === 33) {
    e.preventDefault();
    // Ngăn chặn nếu bài đã kết thúc thì không làm gì cả
    if (!document.querySelector('.container').innerHTML.includes('Completed')) {
      const falseBtn = document.getElementById("falseBtn");
      if (falseBtn) { highlightButton(falseBtn); falseBtn.click(); }
    }
  }

  // 3. Phím "B" (Nút màn hình đen trên bút) -> Phát lại file mp3
  if (key === 'b' || key === 'B' || keyCode === 66) {
    e.preventDefault();
    const audio = document.getElementById('mainAudioControl');
    if (audio) {
      audio.currentTime = 0;
      audio.play();
    }
  }

  // 4. Phím "F5" (Nút bắt đầu trên bút) -> Trợ lý ảo đọc lại câu hỏi
  if (key === 'F5' || keyCode === 116) {
    e.preventDefault();
    if (questions[currentIndex] && !document.querySelector('.container').innerHTML.includes('Completed')) {
      speakQuestion(questions[currentIndex].q);
    }
  }
});
document.addEventListener("contextmenu", function(e) {
  e.preventDefault();

  const popup = document.getElementById("dictPopup");

  // 🔥 Lấy câu gốc từ data (CHUẨN NHẤT)
  const fullSentence = questions[currentIndex].q;

  // 🔥 Chuẩn hóa (bỏ dấu chấm nếu có)
  const cleanSentence = fullSentence.replace(/[.,!?]/g, "").trim();

  // 👉 Ưu tiên dịch câu
  if (translations[fullSentence] || translations[cleanSentence]) {
    document.getElementById("dictContent").innerHTML = `
      <strong>${fullSentence}</strong><br>
      <span style="color:green;">
        ${translations[fullSentence] || translations[cleanSentence]}
      </span>
    `;
  } 
  else {
    // 👉 fallback: dịch từ
    let word = e.target.innerText?.toLowerCase().replace(/[^a-z']/g, "");
    const entry = dictionary[word];

    if (entry) {
      document.getElementById("dictContent").innerHTML = `
        <strong>${word}</strong><br>
        (${entry.type})<br>
        ${entry.phonetic}<br>
        👉 ${entry.meaning}
      `;
    } else {
      document.getElementById("dictContent").innerHTML = `
        <strong>${fullSentence}</strong><br>
        ❌ No translation
      `;
    }
  }

  popup.style.left = e.pageX + "px";
  popup.style.top = e.pageY + "px";
  popup.style.display = "block";
});
  
</script>
</body>
</html>
