<script>
  function toggleSidebar(side) {
    document.querySelector(`.sidebar.${side}`).classList.toggle('visible');
  }

  function toggleHeader() {
    const header = document.getElementById('mainHeader');
    const btn = document.querySelector('.btn-header');
    header.classList.toggle('hidden');
    btn.textContent = header.classList.contains('hidden') ? 'Show Header' : 'Hide Header';
  }

  const canvas = document.getElementById('drawingCanvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let penEnabled = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function togglePen() {
    penEnabled = !penEnabled;
    const btn = document.getElementById('penBtn');
    if (penEnabled) {
      canvas.classList.add('active');
      btn.textContent = "Pen: ON";
      btn.classList.add('active');
    } else {
      canvas.classList.remove('active');
      btn.textContent = "Pen: OFF";
      btn.classList.remove('active');
    }
  }

  function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

  function startDrawing(e) { if (!penEnabled) return; drawing = true; draw(e); }
  function stopDrawing() { drawing = false; ctx.beginPath(); }
  function draw(e) {
    if (!drawing || !penEnabled) return;
    e.preventDefault();
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#ff0000';
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || e.touches[0].clientX) - rect.left;
    const y = (e.clientY || e.touches[0].clientY) - rect.top;
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('touchstart', startDrawing);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDrawing);

  function resetAll() {
    document.querySelectorAll('.line').forEach(line => {
      const selects = line.querySelectorAll('select');
      const result = line.querySelector('.result');
      selects.forEach(select => { select.disabled = false; select.value = "--"; });
      if (result) { result.textContent = ""; result.className = "result"; }
    });
    closeDict();
    clearCanvas();
  }

  const dictionary = {
  "man": { meaning: "người đàn ông", phonetic: "/mæn/", type: "Noun" },
  "woman": { meaning: "người phụ nữ", phonetic: "/ˈwʊmən/", type: "Noun" },

  "i": { meaning: "tôi", phonetic: "/aɪ/", type: "Pronoun" },
  "you": { meaning: "bạn", phonetic: "/juː/", type: "Pronoun" },
  "your": { meaning: "của bạn", phonetic: "/jʊə(r)/", type: "Possessive" },
  "they": { meaning: "họ / chúng", phonetic: "/ðeɪ/", type: "Pronoun" },

  "like": { meaning: "thích", phonetic: "/laɪk/", type: "Verb" },
  "shoes": { meaning: "giày", phonetic: "/ʃuːz/", type: "Noun" },

  "are": { meaning: "thì / là / ở", phonetic: "/ɑː(r)/", type: "Verb (be)" },
  "am": { meaning: "thì / là / ở (với I)", phonetic: "/æm/", type: "Verb (be)" },
  "is": { meaning: "thì / là / ở (với he/she/it)", phonetic: "/ɪz/", type: "Verb (be)" },

  "new": { meaning: "mới", phonetic: "/njuː/", type: "Adjective" },
  "yes": { meaning: "vâng / có", phonetic: "/jes/", type: "Interjection" },
  "no": { meaning: "không", phonetic: "/nəʊ/", type: "Interjection" },

  "expensive": { meaning: "đắt", phonetic: "/ɪkˈspensɪv/", type: "Adjective" },
  "cheap": { meaning: "rẻ", phonetic: "/tʃiːp/", type: "Adjective" },

  "comfortable": { meaning: "thoải mái", phonetic: "/ˈkʌmftəbl/", type: "Adjective" },

  "very": { meaning: "rất", phonetic: "/ˈveri/", type: "Adverb" },

  "from": { meaning: "từ", phonetic: "/frɒm/", type: "Preposition" },
  "the": { meaning: "mạo từ xác định", phonetic: "/ðə/", type: "Article" },

  "discount": { meaning: "giảm giá", phonetic: "/ˈdɪskaʊnt/", type: "Noun/Adj" },
  "shoe": { meaning: "giày (số ít)", phonetic: "/ʃuː/", type: "Noun" },
  "shop": { meaning: "cửa hàng", phonetic: "/ʃɒp/", type: "Noun" },

  "how": { meaning: "như thế nào", phonetic: "/haʊ/", type: "Question word" },
  "did": { meaning: "đã (trợ động từ quá khứ)", phonetic: "/dɪd/", type: "Auxiliary verb" },
  "guess": { meaning: "đoán", phonetic: "/ɡes/", type: "Verb" }
};

  document.querySelectorAll('.word').forEach(el => {
    el.addEventListener('click', () => { if(!penEnabled) showDict(el.textContent); });
  });

  document.querySelectorAll('.line').forEach(line => {
    const selects = line.querySelectorAll('select');
    const result = line.querySelector('.result');
    const index = line.getAttribute('data-index');

    selects.forEach(select => {
      select.addEventListener('change', () => {
        const allFilled = [...selects].every(s => s.value !== "--");
        if (!allFilled) return;
        const allCorrect = [...selects].every(s => s.value === s.dataset.answer);
        result.textContent = allCorrect ? "Correct!" : "Wrong!";
        result.className = "result " + (allCorrect ? "correct" : "wrong");
        if (allCorrect && index) playAudio(`sounds/sentence${index}.mp3`);
        if (allCorrect) selects.forEach(s => s.disabled = true);
      });
    });
  });

  function showDict(word) {
  const cleanWord = word.replace(/[.,!]/g, "").toLowerCase();

  document.getElementById("dictWord").textContent = word;

  if (dictionary[cleanWord]) {

    document.getElementById("dictPhonetic").textContent =
      dictionary[cleanWord].phonetic || "";

    // 👉 lấy pos trước, nếu không có thì lấy type
    const part = dictionary[cleanWord].pos || dictionary[cleanWord].type || "";

    document.getElementById("dictMeaning").textContent =
      (part ? "(" + part + ") " : "") + dictionary[cleanWord].meaning;

  } else {
    document.getElementById("dictPhonetic").textContent = "";
    document.getElementById("dictMeaning").textContent = "(Chưa có trong từ điển)";
  }

  document.getElementById("dictionaryPopup").style.display = "block";
  speakWord();
}

  function closeDict() { document.getElementById("dictionaryPopup").style.display = "none"; }
  function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    speechSynthesis.speak(msg);
  }
  function speakWord() { speak(document.getElementById("dictWord").textContent); }
  function playAudio(url) {
    const audioPlayer = document.getElementById("audioPlayer");
    audioPlayer.src = url;
    audioPlayer.play();
  }
/* === REMOTE CONTROL FOR DROPDOWN === */

let currentLine = 0;
const lines = document.querySelectorAll(".line");

function highlightLine(index) {
  lines.forEach(l => l.style.background = "");
  if (lines[index]) {
    lines[index].style.background = "#fff3cd";
    lines[index].scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

highlightLine(0);

// NEXT / PREV LINE
function nextLine() {
  if (currentLine < lines.length - 1) {
    currentLine++;
    highlightLine(currentLine);
  }
}

function prevLine() {
  if (currentLine > 0) {
    currentLine--;
    highlightLine(currentLine);
  }
}

// CHECK CURRENT LINE
function checkCurrentLine() {
  const line = lines[currentLine];
  const selects = line.querySelectorAll("select");
  const result = line.querySelector(".result");

  if (!selects.length) return;

  const allFilled = [...selects].every(s => s.value !== "--");
  if (!allFilled) return;

  const allCorrect = [...selects].every(s => s.value === s.dataset.answer);
  result.textContent = allCorrect ? "Correct!" : "Wrong!";
  result.className = "result " + (allCorrect ? "correct" : "wrong");

  selects.forEach(s => s.disabled = true);
}

// KEY CONTROL
document.addEventListener("keydown", function (e) {
  console.log("KEY:", e.code);

  // NEXT
  if (e.code === "PageDown" || e.code === "ArrowRight") {
    nextLine();
  }

  // PREV
  if (e.code === "PageUp" || e.code === "ArrowLeft") {
    prevLine();
  }

  // CHECK
  if (e.code === "Enter" || e.code === "NumpadEnter") {
    checkCurrentLine();
  }

  // TOGGLE PEN
  if (e.code === "Space") {
    togglePen();
  }

  // RESET
  if (e.code === "Escape") {
    resetAll();
  }
});
</script>
