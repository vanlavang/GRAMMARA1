// ================= LỚP ÂM THANH & HIỆU ỨNG =================
let audioCtx;

function playSound(type) {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  if (type === 'correct') {
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      osc.start(now + i * 0.1);
      gain.gain.setValueAtTime(0, now + i * 0.1);
      gain.gain.linearRampToValueAtTime(0.2, now + i * 0.1 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.5);
      osc.stop(now + i * 0.1 + 0.5);
    });

    setTimeout(() => {
      const bufferSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 1000;
      const noiseGain = audioCtx.createGain();
      
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      noiseGain.gain.setValueAtTime(0.8, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      noise.start(now);
    }, 300);

  } else {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 120;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    osc.start(now);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.stop(now + 0.4);
  }
}

function shootFireworks() {
  var duration = 2000;
  var animationEnd = Date.now() + duration;
  var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 3000 };

  function randomInRange(min, max) {
    return Math.random() * (max - min) + min;
  }

  var interval = setInterval(function() {
    var timeLeft = animationEnd - Date.now();

    if (timeLeft <= 0) {
      return clearInterval(interval);
    }

    var particleCount = 50 * (timeLeft / duration);
    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
  }, 250);
}

const quizData = [
  {
    question: "What is Ethan's new job?",
    options: ["SysAdmin", "Manager", "Teacher", "Chef"],
    correct: "SysAdmin"
  },
  {
    question: "Why is Ethan nervous at the beginning?",
    options: ["He has an exam.", "It's his first day at work.", "He lost his bag.", "He broke a computer."],
    correct: "It's his first day at work."
  },
  {
    question: "What happens to the main computer system?",
    options: ["It shuts down.", "It catches fire.", "It has a very bad bug.", "Someone steals it."],
    correct: "It has a very bad bug."
  },
  {
    question: "Why can't the team fix the computer bug themselves?",
    options: ["They don't have internet.", "The head SysAdmin is sick.", "It's too late.", "They are eating lunch."],
    correct: "The head SysAdmin is sick."
  },
  {
    question: "What color does the screen turn when Ethan fixes the bug?",
    options: ["Red", "Blue", "Green", "Yellow"],
    correct: "Green"
  }
];

let currentQIndex = 0;

function wrapWordsForDict(text) {
  return text.split(/\s+/).map(w => {
    const clean = w.replace(/[^a-zA-Z0-9'-]/g, "").toLowerCase();
    const cleanEscaped = clean.replace(/'/g, "\\'");
    return `<span class="word" onclick="handleWordClick(event, '${cleanEscaped}')">${w}</span>`;
  }).join(" ");
}

function renderQuiz() {
  const qp = document.getElementById("quizContent");

  if (currentQIndex >= quizData.length) {
    qp.innerHTML = `
      <h4 style='text-align:center; color:#28a745; margin-top:20px;'>
        🎉 You finished the quiz!
      </h4>
      <button class='quiz-option' style='margin-top:20px; text-align:center;' onclick='resetQuiz()'>
        Play Again
      </button>`;
    shootFireworks();
    return;
  }

  const q = quizData[currentQIndex];

  let html = `
    <div>
      <div style="font-weight:bold; margin-bottom:15px; font-size:24px;">
        Question ${currentQIndex + 1}: ${wrapWordsForDict(q.question)}
      </div>
  `;

  q.options.forEach(opt => {
    const isCorrect = (opt === q.correct);
    html += `
      <button class="quiz-option"
        onclick="checkAns(this, ${isCorrect})">
        ${wrapWordsForDict(opt)}
      </button>`;
  });
  html += `</div>`;
  qp.innerHTML = html;
}

function checkAns(btn, isCorrect) {
  const btns = btn.parentElement.querySelectorAll('.quiz-option');
  btns.forEach(b => b.style.pointerEvents = 'none'); 
  if (isCorrect) {
    btn.classList.add('correct');
    playSound('correct');
    shootFireworks();
    
    setTimeout(() => {
      currentQIndex++;
      renderQuiz();
    }, 2500); 
  } else {
    btn.classList.add('wrong');
    playSound('wrong');
    
    setTimeout(() => {
      btn.classList.remove('wrong');
      btns.forEach(b => b.style.pointerEvents = 'auto');
    }, 800);
  }
}

function resetQuiz() {
  currentQIndex = 0;
  renderQuiz();
}

function toggleQuiz() {
  const qp = document.getElementById("quizPanel");
  const topBtn = document.getElementById("quizBtnTop");
  
  if (qp.style.display === "none" || qp.style.display === "") {
    qp.style.display = "block";
    topBtn.classList.add("active");
    topBtn.innerHTML = "<span>❓</span> Quiz: ON";
    if(currentQIndex === 0) renderQuiz();
  } else {
    qp.style.display = "none";
    topBtn.classList.remove("active");
    topBtn.innerHTML = "<span>❓</span> Quiz: OFF";
  }
}

function renderSentence(s){
  const words=s.text.split(/\s+/);
  bubble.innerHTML=words.map((w)=>{
    const clean=w.replace(/[^a-zA-Z0-9'-]/g,"").toLowerCase();
    const cleanEscaped = clean.replace(/'/g, "\\'");
    return `<span class="word" onclick="handleWordClick(event, '${cleanEscaped}')">${w}</span>`;
  }).join(" ");
  bubble.dataset.activeStart=s.start;
}

bubble.addEventListener('contextmenu', function(e) {
  e.preventDefault(); 
  
  const activeStart = bubble.dataset.activeStart;
  if (activeStart) {
    const s = sentences.find(x => String(x.start) === activeStart);
    if (s && s.translation) {
      dictPopup.innerHTML = `
        <b style="color: #c36a2d; font-size: 16px;">🌐 Dịch câu:</b>
        <p style="margin-top: 8px; font-size: 16px; color: #333;">${s.translation}</p>
      `;
      
      dictPopup.style.left = e.clientX + "px";
      dictPopup.style.top = (e.clientY - 90) + "px";
      dictPopup.style.display = "block";

      clearTimeout(window.dictTimeout);
      window.dictTimeout = setTimeout(() => {
        dictPopup.style.display = "none";
      }, 4000);
    }
  }
});

function getDictData(word) {
  if (!word) return null;
  word = word.toLowerCase();
  
  if (dictionary[word]) return dictionary[word];
  
  if (word.includes("'")) {
    let base = word.split("'")[0];
    if (base === 'don') base = 'do';
    if (base === 'won') base = 'will';
    if (base === 'can') base = 'can';
    if (dictionary[base]) return dictionary[base];
  }
  
  if (word.endsWith('s') && dictionary[word.slice(0, -1)]) return dictionary[word.slice(0, -1)];
  if (word.endsWith('es') && dictionary[word.slice(0, -2)]) return dictionary[word.slice(0, -2)];
  if (word.endsWith('ies') && dictionary[word.slice(0, -3) + 'y']) return dictionary[word.slice(0, -3) + 'y'];
  if (word.endsWith('ed') && dictionary[word.slice(0, -1)]) return dictionary[word.slice(0, -1)]; 
  if (word.endsWith('ed') && dictionary[word.slice(0, -2)]) return dictionary[word.slice(0, -2)];
  if (word.endsWith('ing') && dictionary[word.slice(0, -3)]) return dictionary[word.slice(0, -3)];
  if (word.endsWith('ing') && dictionary[word.slice(0, -3) + 'e']) return dictionary[word.slice(0, -3) + 'e'];
  if (word.endsWith('ly') && dictionary[word.slice(0, -2)]) return dictionary[word.slice(0, -2)];
  
  return null;
}

function handleWordClick(event, word) {
  if(event) event.stopPropagation();

  if(!canvas.classList.contains("pen-active")) {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  const data = getDictData(word);
  
  if (data) {
    dictPopup.innerHTML = `
      <b style="text-transform: capitalize;">${word}</b> 
      <i style="color: #666; font-size: 16px;">(${data.type || 'n/a'})</i><br>
      <span style="color: #c36a2d; font-size: 16px;">${data.phonetic || ''}</span>
      <p style="margin-top: 8px;">➡️ ${data.meaning}</p>
    `;
  } else {
    dictPopup.innerHTML = `
      <b style="text-transform: capitalize;">${word}</b><br>
      <p style="margin-top: 8px; color: #888;"><i>(Chưa có trong từ điển)</i></p>
    `;
  }
  
  dictPopup.style.left = event.clientX + "px";
  dictPopup.style.top = (event.clientY - 130) + "px";
  dictPopup.style.display = "block";

  clearTimeout(window.dictTimeout);
  window.dictTimeout = setTimeout(() => {
    dictPopup.style.display = "none";
  }, 3000);
}

function toggleSubtitle(){
  subtitleOn = !subtitleOn;
  const btn = document.getElementById("subBtn");

  if(subtitleOn){
    btn.innerHTML = "<span>💬</span> Subtitle: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>💬</span> Subtitle: OFF";
    btn.classList.remove("active");
    bubble.innerHTML = ""; 
  }
}

function syncSubtitle(){
  if(!isSyncing) return;

  const ct = video.currentTime;

  if(!subtitleOn){
    bubble.innerHTML = "";
  } else {
    const s = sentences.find(x => ct >= x.start && ct <= x.end);
    if(s && bubble.dataset.activeStart != s.start) renderSentence(s);
  }

  animationFrameId = requestAnimationFrame(syncSubtitle);
}

function playConversation(){
  cancelAnimationFrame(animationFrameId);
  isSyncing=true;
  video.play();
  syncSubtitle();
}

function pauseToggle(){
  video.paused ? video.play() : video.pause();
}

function stopConversation(){
  video.pause(); video.currentTime=0; isSyncing=false;
  bubble.innerText="Bấm Play All để bắt đầu học!";
}

function handleVideoClick(){ video.paused?playConversation():pauseToggle(); }
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

function getPos(e) {
  if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener("mousedown", (e) => {
  if(!canvas.classList.contains("pen-active")) return;
  isDrawing = true; ctx.beginPath();
  const p = getPos(e); ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("mousemove", (e) => {
  if(!isDrawing) return;
  const p = getPos(e);
  ctx.lineTo(p.x, p.y); ctx.strokeStyle = "red"; ctx.lineWidth = 4;
  ctx.lineCap = 'round'; ctx.stroke();
});

canvas.addEventListener("mouseup", () => isDrawing = false);
canvas.addEventListener("mouseleave", () => isDrawing = false);

canvas.addEventListener("touchstart", (e) => { 
  if(!canvas.classList.contains("pen-active")) return;
  if (e.cancelable) e.preventDefault(); 
  isDrawing = true; ctx.beginPath();
  const p = getPos(e); ctx.moveTo(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", (e) => { 
  if (e.cancelable) e.preventDefault(); 
  if(!isDrawing) return; 
  const p = getPos(e);
  ctx.lineTo(p.x, p.y); ctx.strokeStyle = "red"; ctx.lineWidth = 4;
  ctx.lineCap = 'round'; ctx.stroke(); 
}, { passive: false });

canvas.addEventListener("touchend", () => isDrawing = false);

window.addEventListener("keydown", (e) => {
  if (e.key === "PageDown" || e.key === "ArrowRight" || e.key === "PageUp" || e.key === "ArrowLeft" || e.code === "Space") {
    e.preventDefault(); handleVideoClick();
  }
});

window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });

</script>
