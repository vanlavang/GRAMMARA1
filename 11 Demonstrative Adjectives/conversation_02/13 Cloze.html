    const placedHistory = [];
    let selectedWord = null;
    let selectedVoice = null, isPenActive = false, isMusicPlaying = false;

    function toggleVideo() {
      const videoBox = document.getElementById('videoBox');
      const btn = document.getElementById('toggleVideoBtn');
      const videoEl = document.getElementById('videoLesson');
      
      if (videoBox.style.display === 'none') {
        videoBox.style.display = 'block';
        btn.textContent = 'Hide Video';
      } else {
        videoBox.style.display = 'none';
        videoEl.pause();
        btn.textContent = 'Show Video';
      }
    }

    const canvas = document.getElementById('penCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    function togglePen() {
      isPenActive = !isPenActive;
      canvas.style.pointerEvents = isPenActive ? "auto" : "none";
      const btn = document.getElementById('penToggle');
      btn.textContent = isPenActive ? "Pen: ON" : "Pen";
      btn.classList.toggle('active-mode', isPenActive);
    }
    function clearPen() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function startDrawing(e) { if (!isPenActive) return; drawing = true; ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); }
    function draw(e) { if (!drawing || !isPenActive) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke(); }
    function stopDrawing() { drawing = false; }
    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }
    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }); canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }); canvas.addEventListener('touchend', stopDrawing);

    function toggleMusic() {
      const music = document.getElementById('bgMusic'); const btn = document.getElementById('musicBtn');
      if (!isMusicPlaying) { music.play(); btn.textContent = "Music: ON"; }
      else { music.pause(); btn.textContent = "Music"; }
      isMusicPlaying = !isMusicPlaying; btn.classList.toggle('active-mode', isMusicPlaying);
    }

    function showAnswers() {
      document.querySelectorAll('.drop-zone').forEach(zone => { zone.textContent = zone.getAttribute('data-answer'); zone.style.backgroundColor = "#e3f2fd"; zone.style.borderStyle = "solid"; });
      document.getElementById("dragWords").innerHTML = "";
    }

    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      selectedVoice = voices.find(v => v.name.includes("Google US English") || v.name.includes("Samantha")) || voices.find(v => v.lang.includes("en-US"));
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

    function speak(text) { 
      speechSynthesis.cancel(); 
      const utter = new SpeechSynthesisUtterance(text); 
      if (selectedVoice) utter.voice = selectedVoice;
      utter.pitch = 1.1; utter.rate = 0.9;
      speechSynthesis.speak(utter); 
    }

    function wrapWords(text) {
      const parts = text.split(/([\w']+)/); 
      let html = "";
      const usedMap = {};

      parts.forEach(part => {
        if (!/[A-Za-z0-9]/.test(part)) {
          html += part;
          return;
        }

        const lowerPart = part.toLowerCase();
        const isTarget = targetWords.some(w => w.toLowerCase() === lowerPart);

        if (isTarget && !usedMap[lowerPart]) {
          usedMap[lowerPart] = true;
          html += `<span class="drop-zone" data-answer="${part}"></span>`;
        } else {
          html += `<span class="text-word">${part}</span>`;
        }
      });

      return html;
    }

    function renderDragWords() {
      const box = document.getElementById("dragWords");
      box.innerHTML = '';

      targetWords
        .filter(w => !placedHistory.some(p => p.word.toLowerCase() === w.toLowerCase()))
        .sort(() => Math.random() - 0.5)
        .forEach(word => {

          const el = document.createElement('div');
          el.className = 'drag-word';
          el.textContent = word;

          el.onclick = () => {
            document.querySelectorAll('.drag-word').forEach(w => 
              w.style.background = "#bbdefb"
            );

            el.style.background = "#ffcc80";
            selectedWord = word;
          };

          box.appendChild(el);
        });
    }

    function handleWordPlacement(zone, word, x, y) { 
      zone.textContent = word; 
      zone.style.backgroundColor = "#e3f2fd"; 
      speak(word); 
      showPopup(word, x, y); 
      placedHistory.push({ word, zone }); 
      renderDragWords(); 
    }

    function checkAnswers() {
      let correct = 0;
      document.querySelectorAll('.drop-zone').forEach(zone => {
        const exp = zone.getAttribute('data-answer'); 
        const act = zone.textContent.trim();
        if (act !== "") { 
          const isCorrect = exp.toLowerCase() === act.toLowerCase();
          zone.style.backgroundColor = isCorrect ? "#c8f7c5" : "#ffcdd2"; 
          if (isCorrect) correct++; 
        }
      });

      if (correct === targetWords.length) {
        const fireworkAudio = document.getElementById('fireworkSound');
        if (fireworkAudio) {
          fireworkAudio.currentTime = 0;
          fireworkAudio.play().catch(e => console.log("Lỗi phát âm thanh:", e));
        }

        const duration = 3 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 3000 };

        function randomInRange(min, max) {
          return Math.random() * (max - min) + min;
        }

        const interval = setInterval(function() {
          const timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) {
            return clearInterval(interval);
          }
          const particleCount = 50 * (timeLeft / duration);
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);

        setTimeout(() => {
          alert(`Tuyệt vời! Bạn đã trả lời đúng tất cả: ${correct}/${targetWords.length}`);
        }, 500);

      } else {
        alert(`Kết quả: ${correct}/${targetWords.length}`);
      }
    }

    function translateSentence(element, x, y) {
      const clickedWord = element.textContent.replace(/[.,]/g, '').trim(); 
      if (!clickedWord) return;

      const lines = Object.keys(translationDict);
      let foundTranslation = "Không tìm thấy bản dịch cho câu này.";

      for (let line of lines) {
        if (line.toLowerCase().includes(clickedWord.toLowerCase())) {
          foundTranslation = translationDict[line];
          // Vừa hiển thị popup dịch, vừa tự động đọc câu tiếng Anh lên
          speak(line);
          break;
        }
      }

      showTransPopup(foundTranslation, x, y);
    }

    function showPopup(word, x, y) {
      closePopups(); 
      const data = phoneticDict[word.toLowerCase()]; 
      const pop = document.getElementById('popup');
      document.getElementById('popupWord').innerText = word;
      
      if (data) { 
        document.getElementById('popupPhonetic').innerHTML = `<span class="word-type">(${data.type})</span><strong>Phiên âm:</strong> ${data.phonetic}<br><strong>Nghĩa:</strong> ${data.meaning}`; 
      } else {
        document.getElementById('popupPhonetic').innerHTML = `<em>(Chưa có trong từ điển)</em>`;
      }
      
      pop.style.display = 'block'; 
      pop.style.left = `${Math.min(x, window.innerWidth - 260)}px`; 
      pop.style.top = `${Math.min(y - 140, window.innerHeight - 150)}px`;
    }

    function showTransPopup(text, x, y) { 
      closePopups(); 
      const pop = document.getElementById('transPopup'); 
      document.getElementById('transContent').innerText = text; 
      pop.style.display = 'block'; 
      pop.style.left = `${Math.min(x, window.innerWidth - 320)}px`; 
      pop.style.top = `${Math.min(y - 100, window.innerHeight - 200)}px`; 
    }

    function closePopups() { 
      document.getElementById('popup').style.display = 'none'; 
      document.getElementById('transPopup').style.display = 'none'; 
    }

    function init() {
      const box = document.getElementById("textContent"); 
      box.innerHTML = wrapWords(originalText); 
      renderDragWords();

      box.addEventListener('click', (e) => {
        if (e.target.classList.contains('drop-zone')) {
          const zone = e.target;

          if (!selectedWord && zone.textContent.trim() !== "") {
            zone.textContent = "";
            zone.style.backgroundColor = "#fffde7"; 
            
            const historyIdx = placedHistory.findIndex(p => p.zone === zone);
            if (historyIdx > -1) {
              placedHistory.splice(historyIdx, 1);
            }
            renderDragWords();
            return;
          }

          if (selectedWord) {
            if (zone.textContent.trim() !== "") {
              const historyIdx = placedHistory.findIndex(p => p.zone === zone);
              if (historyIdx > -1) {
                placedHistory.splice(historyIdx, 1);
              }
            }
            handleWordPlacement(zone, selectedWord, e.clientX, e.clientY);
            selectedWord = null;
          }
          return;
        }

        const el = e.target.closest('.text-word'); 
        if (el) { 
          showPopup(el.textContent.replace(/[.,]/g, ''), e.clientX, e.clientY); 
          speak(el.textContent); 
        } 
      });

      // Click chuột phải (hoặc nhấn giữ lâu trên màn hình cảm ứng) vào bất kỳ từ nào để dịch và đọc câu
      box.addEventListener('contextmenu', e => { 
        e.preventDefault(); 
        if (e.target.classList.contains('text-word') || e.target.classList.contains('drop-zone')) {
          translateSentence(e.target, e.clientX, e.clientY); 
        }
      });
    }

    document.getElementById('undoBtn').onclick = () => { 
      const last = placedHistory.pop(); 
      if (last) { 
        last.zone.textContent = ''; 
        last.zone.style.backgroundColor = "#fffde7"; 
        renderDragWords(); 
      } 
    };

    function toggleSidebar(side) { document.querySelector(`.sidebar.${side}`).classList.toggle('visible'); }
    
    init();
    loadVoices();

    window.addEventListener('keydown', function(e) {
      const video = document.getElementById('videoLesson');
      const key = e.key.toLowerCase();

      if (key === 'b' || key === '.') {
        e.preventDefault();
        video.paused ? video.play() : video.pause();
        return;
      }

      if (key === 'arrowright') {
        e.preventDefault();
        video.currentTime += 5;
        return;
      }

      if (key === 'arrowleft') {
        e.preventDefault();
        video.currentTime -= 5;
        return;
      }

      if (key === 'arrowup') {
        e.preventDefault();
        video.volume = Math.min(1, video.volume + 0.1);
        return;
      }

      if (key === 'arrowdown') {
        e.preventDefault();
        video.volume = Math.max(0, video.volume - 0.1);
        return;
      }

      if (key === 'v') {
        e.preventDefault();
        toggleVideo();
        return;
      }

      if (key === 'pagedown') {
        e.preventDefault();
        checkAnswers();
        return;
      }

      if (key === 'pageup') {
        e.preventDefault();
        const last = placedHistory.pop(); 
        if (last) { 
          last.zone.textContent = ''; 
          last.zone.style.backgroundColor = "#fffde7"; 
          renderDragWords(); 
        }
        return;
      }

      if (key === 'escape') {
        location.reload();
      }
    });
  </script>
</body>
</html>
