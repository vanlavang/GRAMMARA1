  <script>
    const questions = [
  { q: "1. What does the man like first?", a: ["these jeans", "the jeans", "jeans"] },
  { q: "2. Does the woman like the jeans too?", a: ["yes", "yes she does", "she likes those too"] },
  { q: "3. Does the woman like this shirt?", a: ["no", "no she doesn't", "no she likes that shirt"] },
  { q: "4. Which shirt does the woman like?", a: ["the green one", "that shirt", "green one"] },
  { q: "5. Does the man like the green color?", a: ["no", "no he doesn't", "he doesn't like that color"] }
];

const dictionary = {
  // ===== QUESTION WORDS & PRONOUNS =====
  "what": { meaning: "cái gì", phonetic: "/wʌt/", type: "question word" },
  "which": { meaning: "cái nào", phonetic: "/wɪtʃ/", type: "question word" },
  "these": { meaning: "những cái này", phonetic: "/ðiːz/", type: "pronoun / determiner" },
  "those": { meaning: "những cái kia", phonetic: "/ðoʊz/", type: "pronoun / determiner" },
  "this": { meaning: "cái này", phonetic: "/ðɪs/", type: "pronoun / determiner" },
  "that": { meaning: "cái kia / đó", phonetic: "/ðæt/", type: "pronoun / determiner" },
  "it": { meaning: "nó", phonetic: "/ɪt/", type: "pronoun" },
  "one": { meaning: "cái (dùng thay thế cho danh từ)", phonetic: "/wʌn/", type: "pronoun" },

  // ===== VERBS & AUXILIARIES =====
  "do": { meaning: "trợ động từ", phonetic: "/duː/", type: "auxiliary verb" },
  "does": { meaning: "trợ động từ (ngôi thứ 3)", phonetic: "/dʌz/", type: "auxiliary verb" },
  "like": { meaning: "thích", phonetic: "/laɪk/", type: "verb" },
  "don't": { meaning: "không (do not)", phonetic: "/doʊnt/", type: "auxiliary verb" },

  // ===== NOUNS =====
  "jeans": { meaning: "quần bò / quần jean", phonetic: "/dʒiːnz/", type: "noun" },
  "shirt": { meaning: "áo sơ mi", phonetic: "/ʃɜːrt/", type: "noun" },
  "color": { meaning: "màu sắc", phonetic: "/ˈkʌlər/", type: "noun" },
  "man": { meaning: "người đàn ông", phonetic: "/mæn/", type: "noun" },
  "woman": { meaning: "người phụ nữ", phonetic: "/ˈwʊmən/", type: "noun" },

  // ===== ADJECTIVES & ADVERBS =====
  "blue": { meaning: "màu xanh dương", phonetic: "/bluː/", type: "adjective" },
  "green": { meaning: "màu xanh lá", phonetic: "/ɡriːn/", type: "adjective" },
  "too": { meaning: "cũng", phonetic: "/tuː/", type: "adverb" },
  "no": { meaning: "không", phonetic: "/noʊ/", type: "adverb" },
  "really": { meaning: "thật sự", phonetic: "/ˈriːəli/", type: "adverb" },
  "first": { meaning: "đầu tiên", phonetic: "/fɜːrst/", type: "adverb" },

  // ===== ARTICLES & CONJUNCTIONS =====
  "the": { meaning: "mạo từ xác định", phonetic: "/ðə/", type: "article" },
  "but": { meaning: "nhưng", phonetic: "/bʌt/", type: "conjunction" }
};
    let currentPage = 0;
    const userAnswers = Array(questions.length).fill("");
    let googleUSVoice = null;

    speechSynthesis.onvoiceschanged = () => {
      const voices = speechSynthesis.getVoices();
      googleUSVoice = voices.find(v => v.name.toLowerCase().includes("google") && v.lang === "en-US");
    };

    function speak(text, callback) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      if (googleUSVoice) utter.voice = googleUSVoice;
      utter.onend = callback || (() => {});
      utter.onerror = callback || (() => {}); 
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    function normalizeWord(word) {
      word = word.toLowerCase().replace(/[^a-z']/g, "");
      if (word.endsWith("'s")) return { base: word.slice(0, -2), possessive: true };
      return { base: word };
    }

    function startQuiz() {
      currentPage = 0;
      document.getElementById("playBtn").style.display = "none";
      document.getElementById("prevBtn").style.display = "inline-flex";
      document.getElementById("nextBtn").style.display = "inline-flex";
      document.getElementById("resetBtn").style.display = "none";
      renderPage();
    }

    function renderPage() {
      const q = questions[currentPage];
      const quizDiv = document.getElementById("quiz");

      const highlighted = q.q.replace(/\b[\w’']+\b/g, (word) => {
        let safeWord = word.replace(/'/g, "\\'"); 
        return `<span class="word" onclick="showDict('${safeWord}')">${word}</span>`;
      });

      quizDiv.innerHTML = `
        <label id="questionLabel">${highlighted}</label><br>
        <input type="text" id="answerInput" onkeypress="if(event.key === 'Enter') submitAnswer()" />
        <button onclick="submitAnswer()" id="submitBtn">Submit</button>
        <div class="feedback" id="feedback"></div>
      `;

      speak(q.q);

      setTimeout(() => { document.getElementById("answerInput").focus(); }, 100);

      document.getElementById("prevBtn").style.display = currentPage > 0 ? "inline-flex" : "none";
      document.getElementById("nextBtn").style.display = currentPage < questions.length - 1 ? "inline-flex" : "none";
      
      if(userAnswers[currentPage]) {
          document.getElementById("answerInput").value = userAnswers[currentPage];
      }
    }

    function submitAnswer() {
      const input = document.getElementById("answerInput").value.trim().toLowerCase();
      if(!input) return; 
      
      userAnswers[currentPage] = input;
      const correctAnswers = questions[currentPage].a;
      const feedbackDiv = document.getElementById("feedback");

      if (correctAnswers.includes(input)) {
        feedbackDiv.textContent = "Correct!";
        feedbackDiv.className = "feedback correct";
      } else {
        feedbackDiv.textContent = `Wrong! Correct answer: ${correctAnswers[0]}`;
        feedbackDiv.className = "feedback wrong";
      }

      speak(feedbackDiv.textContent);
      updateScore();
    }

    function nextPage() {
      if (currentPage < questions.length - 1) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    function resetQuiz() {
      currentPage = 0;
      userAnswers.fill("");
      document.getElementById("result").textContent = "";
      document.getElementById("resetBtn").style.display = "none";
      document.getElementById("playBtn").style.display = "inline-flex";
      document.getElementById("prevBtn").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("quiz").innerHTML = "";
      speechSynthesis.cancel();
    }

    function updateScore() {
      const resultEl = document.getElementById("result");
      let correct = 0;
      for (let i = 0; i < questions.length; i++) {
        if (questions[i].a.includes(userAnswers[i])) correct++;
      }
      resultEl.textContent = `Score: ${correct} / ${questions.length}`;
      if (currentPage === questions.length - 1) {
        document.getElementById("resetBtn").style.display = "inline-flex";
      }
    }

    function speakWord() {
      const word = document.getElementById("dictWord").textContent;
      speak(word);
    }

    function showDict(rawWord) {
      const info = normalizeWord(rawWord);
      const dictData = dictionary[info.base];

      if (dictData) {
        let finalMeaning = dictData.meaning;
        if (info.possessive) {
          finalMeaning = "của " + finalMeaning; 
        }

        document.getElementById("dictWord").textContent = rawWord;
        document.getElementById("dictPhonetic").textContent = dictData.phonetic;
        
        const typeText = dictData.type ? `(${dictData.type})` : "";
        document.getElementById("dictType").textContent = typeText;

        document.getElementById("dictMeaning").textContent = finalMeaning;
        document.getElementById("dictionaryPopup").style.display = "block";
        speakWord();
      } else {
        document.getElementById("dictWord").textContent = rawWord;
        document.getElementById("dictPhonetic").textContent = "";
        document.getElementById("dictType").textContent = ""; 
        document.getElementById("dictMeaning").textContent = "(Từ này chưa có trong từ điển)";
        document.getElementById("dictionaryPopup").style.display = "block";
      }
    }

    function closeDict() {
      document.getElementById("dictionaryPopup").style.display = "none";
    }

    function toggleSidebar(side) {
      const sidebar = document.querySelector(`.sidebar.${side}`);
      const button = document.querySelector(`.toggle-${side}`);
      sidebar.classList.toggle('visible');
    }

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const bgMusic = document.getElementById('bgMusic');
    let isPainting = false;
    let penActive = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight; 
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function toggleMusic() {
        const btn = document.getElementById('musicBtn');
        if (bgMusic.paused) {
            bgMusic.play().catch(() => alert("Click vào màn hình để cho phép phát nhạc"));
            btn.textContent = "🎵 Music: ON";
            btn.style.background = "#e6ccb2";
            btn.style.borderColor = "var(--primary-color)";
        } else {
            bgMusic.pause();
            btn.textContent = "🎵 Music: OFF";
            btn.style.background = "white";
            btn.style.borderColor = "#d4bfa6";
        }
    }

    function togglePen() {
        penActive = !penActive;
        const btn = document.getElementById('penBtn');
        if (penActive) {
            canvas.classList.add('active');
            btn.textContent = "✏️ Pen: ON";
            btn.style.background = "var(--primary-color)";
            btn.style.borderColor = "var(--primary-color)";
            btn.style.color = "white";
        } else {
            canvas.classList.remove('active');
            btn.textContent = "✏️ Pen: OFF";
            btn.style.background = "white";
            btn.style.borderColor = "#d4bfa6";
            btn.style.color = "#8b5e3c";
            isPainting = false;
        }
    }

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function getEventPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
        if (!penActive) return;
        isPainting = true;
        const pos = getEventPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        if (e.cancelable) e.preventDefault();
    }

    function doDraw(e) {
        if (!isPainting || !penActive) return;
        const pos = getEventPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = "#e74c3c";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
        if (e.cancelable) e.preventDefault();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', doDraw);
    window.addEventListener('mouseup', () => isPainting = false);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', doDraw, { passive: false });
    canvas.addEventListener('touchend', () => isPainting = false);

    // ===== REMOTE CONTROL (BÚT TRÌNH CHIẾU) =====
    document.addEventListener("keydown", function(e) {
        const key = e.key.toLowerCase();
        
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
            if (key === "enter") {
                const submitBtn = document.getElementById("submitBtn");
                if (submitBtn) submitBtn.click();
            }
            return; 
        }

        if (key === "arrowright" || key === "pagedown") nextPage();
        if (key === "arrowleft" || key === "pageup") prevPage();
        if (key === "enter") {
            const submitBtn = document.getElementById("submitBtn");
            if (submitBtn) submitBtn.click();
        }
        if (key === "p") togglePen();
    });

    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();

      const text = e.target.innerText?.trim();

      if (text && translations[text]) {
        const popup = document.getElementById("dictionaryPopup");

        document.getElementById("dictWord").textContent = text;
        document.getElementById("dictPhonetic").textContent = "";
        document.getElementById("dictType").textContent = "Translation";
        document.getElementById("dictMeaning").textContent = translations[text];

        popup.style.display = "block";
      }
    });
