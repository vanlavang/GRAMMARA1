.sidebar button.active b {

      position: fixed;
      top: 10px; /* Nằm ngay dưới header */

    }
    .toggle-left { left: 0; border-radius: 0 8px 8px 0; }

    /* ĐÁP ÁN CÂN ĐỐI VỚI CÂU HỎI */

    .word { cursor: pointer; border-radius: 4px; padding: 0 2px; }

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
 const dictionary = {
  "what": { type: "question word", meaning: "cái gì", phonetic: "/wɒt/" },
  "how": { type: "adverb", meaning: "bao nhiêu (how much)", phonetic: "/haʊ/" },
  "much": { type: "adverb", meaning: "nhiều", phonetic: "/mʌtʃ/" },
  "is": { type: "verb", meaning: "là / thì / ở", phonetic: "/ɪz/" },
  "are": { type: "verb", meaning: "là / thì / ở", phonetic: "/ɑːr/" },
  "does": { type: "auxiliary verb", meaning: "trợ động từ", phonetic: "/dʌz/" },
  "this": { type: "pronoun", meaning: "này", phonetic: "/ðɪs/" },
  "that": { type: "pronoun", meaning: "đó", phonetic: "/ðæt/" },
  "these": { type: "pronoun", meaning: "những cái này", phonetic: "/ðiːz/" },
  "those": { type: "pronoun", meaning: "những cái kia", phonetic: "/ðəʊz/" },
  "coffee": { type: "noun", meaning: "cà phê", phonetic: "/ˈkɒfi/" },
  "maker": { type: "noun", meaning: "máy làm", phonetic: "/ˈmeɪkər/" },
  "plates": { type: "noun", meaning: "những cái đĩa", phonetic: "/pleɪts/" },
  "spoons": { type: "noun", meaning: "những cái thìa", phonetic: "/spuːnz/" },
  "ten": { type: "number", meaning: "mười", phonetic: "/ten/" },
  "five": { type: "number", meaning: "năm", phonetic: "/faɪv/" },
  "one": { type: "number", meaning: "một", phonetic: "/wʌn/" },
  "dollar": { type: "noun", meaning: "đô la", phonetic: "/ˈdɒlər/" },
  "dollars": { type: "noun", meaning: "đô la", phonetic: "/ˈdɒlərz/" },
  "each": { type: "adverb/pronoun", meaning: "mỗi", phonetic: "/iːtʃ/" },
  "and": { type: "conjunction", meaning: "và", phonetic: "/ænd/" },
  "about": { type: "preposition", meaning: "về", phonetic: "/əˈbaʊt/" },
  "i": { type: "pronoun", meaning: "tôi", phonetic: "/aɪ/" },
  "ill": { type: "phrase", meaning: "tôi sẽ (I will)", phonetic: "/aɪl/" },
  "take": { type: "verb", meaning: "lấy / mua", phonetic: "/teɪk/" },
  "them": { type: "pronoun", meaning: "chúng", phonetic: "/ðəm/" },
  "sold": { type: "verb", meaning: "đã bán (chốt đơn)", phonetic: "/səʊld/" },
  "the": { type: "article", meaning: "mạo từ", phonetic: "/ðə/" },
  "man": { type: "noun", meaning: "người đàn ông", phonetic: "/mæn/" },
  "woman": { type: "noun", meaning: "người phụ nữ", phonetic: "/ˈwʊmən/" },
  "say": { type: "verb", meaning: "nói", phonetic: "/seɪ/" },
  "at": { type: "preposition", meaning: "ở / tại", phonetic: "/æt/" },
  "end": { type: "noun", meaning: "kết thúc", phonetic: "/end/" },
  "when": { type: "conjunction", meaning: "khi", phonetic: "/wen/" },
  "agrees": { type: "verb", meaning: "đồng ý", phonetic: "/əˈɡriːz/" },
  "to": { type: "preposition", meaning: "để", phonetic: "/tuː/" },
  "buy": { type: "verb", meaning: "mua", phonetic: "/baɪ/" },
  "no": { type: "interjection", meaning: "không", phonetic: "/nəʊ/" },
  "thank": { type: "verb", meaning: "cảm ơn", phonetic: "/θæŋk/" },
  "you": { type: "pronoun", meaning: "bạn", phonetic: "/juː/" },
  "expensive": { type: "adjective", meaning: "đắt", phonetic: "/ɪkˈspensɪv/" },
  "dont": { type: "contraction", meaning: "không (do not)", phonetic: "/dəʊnt/" },
  "like": { type: "verb", meaning: "thích", phonetic: "/laɪk/" },
  "here": { type: "adverb", meaning: "ở đây", phonetic: "/hɪər/" },
  "go": { type: "verb", meaning: "đi", phonetic: "/ɡəʊ/" },
  "goodbye": { type: "noun", meaning: "tạm biệt", phonetic: "/ˌɡʊdˈbaɪ/" }
};

const translations = {
  "How much is this coffee maker?": "Máy pha cà phê này giá bao nhiêu?",
  "How much are these plates?": "Những cái đĩa này giá bao nhiêu?",
  "How much are these spoons?": "Những cái thìa này giá bao nhiêu?",
  "What does the man say at the end?": "Người đàn ông nói gì vào lúc cuối?",
  "What does the woman say when the man agrees to buy?": "Người phụ nữ nói gì khi người đàn ông đồng ý mua?",
  "Ten dollars": "Mười đô la",
  "Five dollars": "Năm đô la",
  "One dollar": "Một đô la",
  "Fifteen dollars": "Mười lăm đô la",
  "Ten dollars each": "Mười đô la mỗi cái",
  "Five dollars each": "Năm đô la mỗi cái",
  "One dollar each": "Một đô la mỗi cái",
  "Two dollars each": "Hai đô la mỗi cái",
  "I'll take them.": "Tôi sẽ lấy chúng.",
  "No, thank you.": "Không, cảm ơn bạn.",
  "That is expensive.": "Cái đó đắt quá.",
  "I don't like them.": "Tôi không thích chúng.",
  "Sold!": "Đã bán!",
  "Thank you!": "Cảm ơn!",
  "Here you go.": "Của bạn đây.",
  "Goodbye!": "Tạm biệt!"
};

const miniGameData = [
  {
    question: "How much is this coffee maker?",
    options: ["Ten dollars", "Five dollars", "One dollar", "Fifteen dollars"],
    correct: "Ten dollars"
  },
  {
    question: "How much are these plates?",
    options: ["Ten dollars each", "Five dollars each", "One dollar each", "Two dollars each"],
    correct: "Five dollars each"
  },
  {
    question: "How much are these spoons?",
    options: ["One dollar each", "Five dollars each", "Ten dollars each", "Two dollars each"],
    correct: "One dollar each"
  },
  {
    question: "What does the man say at the end?",
    options: ["I'll take them.", "No, thank you.", "That is expensive.", "I don't like them."],
    correct: "I'll take them."
  },
  {
    question: "What does the woman say when the man agrees to buy?",
    options: ["Sold!", "Thank you!", "Here you go.", "Goodbye!"],
    correct: "Sold!"
  }
];

    let currentIdx = -1, correct = 0, incorrect = 0, seconds = 0, timerInterval, inkCanvas, inkCtx, isDrawing = false;
    const correctAudio = new Audio('../../shared-sounds/firework.mp3');
    const incorrectAudio = new Audio('sounds/incorrect.mp3');

    document.addEventListener("keydown", (e) => {
      const nextKeys = ["PageDown", "ArrowRight", "ArrowDown", "Enter", " "];
      if (nextKeys.includes(e.key)) {
        if (e.key === " " || e.key === "Enter") e.preventDefault();
        loadNextQuestion(); 
      }
    });

    function initInk() {
      inkCanvas = document.getElementById("inkCanvas");
      inkCtx = inkCanvas.getContext("2d");
      const container = document.getElementById("main-container");
      inkCanvas.width = container.offsetWidth;
      inkCanvas.height = container.offsetHeight;

      const getPos = (e) => {
        const rect = inkCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const start = (e) => { if (inkCanvas.classList.contains("drawing")) { isDrawing = true; const pos = getPos(e); inkCtx.beginPath(); inkCtx.moveTo(pos.x, pos.y); } };
      const move = (e) => { if (isDrawing) { const pos = getPos(e); inkCtx.lineTo(pos.x, pos.y); inkCtx.strokeStyle = "#d35400"; inkCtx.lineWidth = 4; inkCtx.lineCap = "round"; inkCtx.stroke(); } };
      const stop = () => { isDrawing = false; };

      inkCanvas.addEventListener("mousedown", start);
      inkCanvas.addEventListener("mousemove", move);
      window.addEventListener("mouseup", stop);
      inkCanvas.addEventListener("touchstart", (e) => { if(inkCanvas.classList.contains("drawing")) e.preventDefault(); start(e); }, {passive: false});
      inkCanvas.addEventListener("touchmove", (e) => { if(inkCanvas.classList.contains("drawing")) e.preventDefault(); move(e); }, {passive: false});
      inkCanvas.addEventListener("touchend", stop);
    }

    function toggleInk() {
      const active = inkCanvas.classList.toggle("drawing");
      document.getElementById("penBtn").textContent = active ? "Pen: ON" : "Pen: OFF";
      document.getElementById("penBtn").classList.toggle("active");
    }
    function clearInk() { inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height); }

    function speak(text) {
      const u = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      u.voice = voices.find(v => v.name.includes("Google US English") || v.name.includes("Samantha")) || voices[0];
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

    function loadNextQuestion() {
  speechSynthesis.cancel(); 

  const mainAudio = document.getElementById("mainAudio");
  if (mainAudio) {
    mainAudio.pause();
    mainAudio.currentTime = 0;
  }

  currentIdx++;

  // ✅ RANDOM khi hết vòng
  if (currentIdx >= miniGameData.length) {
    shuffleArray(miniGameData);
    currentIdx = 0;
  }

  if (!timerInterval) {
    timerInterval = setInterval(() => { 
      seconds++; 
      document.getElementById("timer").textContent = seconds; 
    }, 1000);
  }

  const container = document.getElementById("game-container");
  container.style.opacity = 0;

  setTimeout(() => {
    render();
    container.style.opacity = 1;
    container.style.transition = "opacity 0.3s";
  }, 100);
}

    function shuffleArray(array) {
      let currentIndex = array.length, randomIndex;
      while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    function render() {
      const q = miniGameData[currentIdx];
      const shuffledOptions = shuffleArray([...q.options]); 
      document.getElementById("game-container").innerHTML = `<h3>${wrapWords(q.question)}</h3><div class="options-grid">` + 
        shuffledOptions.map(o => `<div class="option-button" onclick="check(this,'${o.replace(/'/g, "\\'")}','${q.correct.replace(/'/g, "\\'")}')">${wrapWords(o)}</div>`).join("") + `</div>`;
      speak(q.question);
      attachWordLogic();
    }
    function wrapWords(t) { return t.split(" ").map(w => `<span class="word" data-word="${w.toLowerCase().replace(/\W/g,'')}">${w}</span>`).join(" "); }

    function attachWordLogic() {
      document.querySelectorAll(".word").forEach(w => {
        w.onclick = (e) => {
          if (inkCanvas.classList.contains("drawing")) return;
          e.stopPropagation();
          const d = dictionary[w.dataset.word];
          if (d) {
            const p = document.getElementById("dictPopup");
            p.innerHTML = `<strong>${w.textContent}</strong> <span class="word-type">(${d.type})</span><br>${d.phonetic}<br>${d.meaning}`;
            p.style.display = "block"; p.style.top = (e.pageY + 10) + "px"; p.style.left = e.pageX + "px";
            speak(w.textContent);
          }
        };
      });
      document.getElementById("game-container").oncontextmenu = (e) => {
        e.preventDefault();
        const txt = e.target.closest("h3, .option-button")?.innerText.trim();
        if (txt && translations[txt]) {
          const p = document.getElementById("sentenceTranslation");
          p.innerHTML = translations[txt];
          p.style.display = "block"; 
          p.style.top = e.pageY + "px"; 
          p.style.left = e.pageX + "px";
        }
      };
    }

    function check(btn, choice, ans) {
      if (btn.classList.contains('correct') || btn.classList.contains('incorrect')) return;
      const cleanChoice = choice.replace(/[\u2018\u2019]/g, "'").trim();
      const cleanAns = ans.replace(/[\u2018\u2019]/g, "'").trim();
      if (cleanChoice === cleanAns) { 
        btn.classList.add("correct"); 
        correct++; 
        correctAudio.play();
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      } else { 
        btn.classList.add("incorrect"); 
        incorrect++; 
        incorrectAudio.play();
        speak("Wrong answer. Correct is " + ans); 
      }
      document.getElementById("correctCount").textContent = correct;
      document.getElementById("incorrectCount").textContent = incorrect;
    }
    function toggleSidebar(side) {
      const sb = document.querySelector('.sidebar.' + side);
      if (sb) sb.classList.toggle('visible');
    }

    window.onload = () => { initInk(); loadNextQuestion(); };
    document.addEventListener("click", () => { 
      document.getElementById("dictPopup").style.display = "none"; 
      document.getElementById("sentenceTranslation").style.display = "none"; 
    });
document.addEventListener("keydown", (e) => {
  console.log("KEY:", e.code);

  if (
    e.code === "PageDown" ||
    e.code === "ArrowRight" ||
    e.code === "Enter"
  ) {
    loadNextQuestion();
  }
});
  </script>
