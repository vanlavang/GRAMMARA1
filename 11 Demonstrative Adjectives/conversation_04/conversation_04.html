header{

.btn{

  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
}

.btn:active {
  transform: translateY(2px);
  box-shadow: 0 0px 0 #dcdcdc;
}

.btn-side {
  background: #c36a2d;
  color: white;

  border-radius: 12px;

.btn-side:active {

}

.btn.active{
  background: #fff !important;

.sidebar {
  position: fixed;
  top: 0;
  width: 240px;
  height: 100%;
  background: #ffffff;
  z-index: 2000;
  transition: cubic-bezier(0.4, 0, 0.2, 1) 0.4s;
  padding: 30px 15px;
  box-shadow: 5px 0 25px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar.left { left: -250px; border-right: 4px solid #c36a2d; }
.sidebar.right { right: -250px; border-left: 4px solid #c36a2d; }
.sidebar.open { transform: translateX(250px); }
.sidebar.right.open { transform: translateX(-250px); }

.sidebar button {
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid #eee;
  background: #fff;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
}
.sidebar button.active { background: #c36a2d; color: #fff; }

.content{ text-align:center; padding: 0 10px; }

#mainVideo{
  width:100%; max-width:400px;
  border-radius:24px;
  cursor:pointer;
  background:#000;
  border: 10px solid #000; 
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.speech{
  margin: 30px auto;
  max-width: 1200px;
  background: #ffffff;
  border-radius: 30px;
  padding: 25px;
  font-size: 40px;
  font-weight: 700;
  box-shadow: 0 10px 0 #dcdcdc;
  line-height: 1.4;
}

.word{
  cursor:pointer;
  padding: 2px 6px;
  border-radius: 8px;
  display:inline-block;
}

.word.reading{
  background: #ffeb3b;
  color: #c36a2d;
  transform: scale(1.1);
}

canvas{
  position:fixed; top:0; left:0;
  width:100vw; height:100vh;
  pointer-events:none; z-index:900;
  touch-action: none;
}
canvas.pen-active{ pointer-events:auto; }

#dictPopup {
  position: fixed;
  background: white;
  border-top: 5px solid #c36a2d;
  padding: 15px;
  border-radius: 15px;
  z-index: 2000;
  display: none;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  min-width: 180px;
  pointer-events: none;
}
</style>

<body>

<header>
  <div class="top-nav">
    <button class="btn-side" onclick="toggleSidebar('sidebarLeft')">☰ Menu</button>
    <nav class="nav-links">
      <a href="../conversation_01/conversation_01.html" >Conversation 01</a>
      <a href="../conversation_02/conversation_02.html" >Conversation 02</a>
      <a href="../conversation_03/conversation_03.html">Conversation 03</a>
      <a href="../conversation_04/conversation_04.html" class="active-link">Conversation 04</a>
    </nav>
    <button class="btn-side" onclick="toggleSidebar('sidebarRight')">Menu ☰</button>
  </div>

  <div class="controls">
    <button class="btn" onclick="playConversation()"><span>🔊</span> Play All</button>
    <button class="btn" onclick="pauseToggle()"><span>⏸</span> Pause</button>
    <button class="btn" onclick="stopConversation()"><span>⏹</span> Stop</button>
    <button class="btn" id="penBtn" onclick="togglePen()"><span>✏️</span> Pen: OFF</button>
    <button class="btn" onclick="clearCanvas()"><span>🗑️</span> Clear</button>
<button class="btn" id="subBtn" onclick="toggleSubtitle()">
  <span>💬</span> Subtitle: ON
</button>
  </div>
</header>

<div class="content">
  <video id="mainVideo" onclick="handleVideoClick()" playsinline>
    <source src="videos/A1-11-4.mp4" type="video/mp4">
  </video>
  <div class="speech" id="currentLine">Bấm Play All để bắt đầu học!</div>
</div>

<script>
let subtitleOn = false;
const video = document.getElementById("mainVideo");
const bubble = document.getElementById("currentLine");
const canvas = document.getElementById("drawingCanvas");
const ctx = canvas.getContext("2d");
const dictPopup = document.getElementById("dictPopup");

canvas.width = innerWidth;
canvas.height = innerHeight;

let animationFrameId, isSyncing=false, isDrawing=false;

function toggleSidebar(id) {
  const sb = document.getElementById(id);
  const isOpen = sb.classList.contains('open');
  document.getElementById('sidebarLeft').classList.remove('open');
  document.getElementById('sidebarRight').classList.remove('open');
  if(!isOpen) sb.classList.add('open');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.sidebar') && !e.target.closest('.btn-side')) {
    document.getElementById('sidebarLeft').classList.remove('open');
    document.getElementById('sidebarRight').classList.remove('open');
  }
});

function togglePen(){
  canvas.classList.toggle("pen-active");
  const btn = document.getElementById("penBtn");
  if(canvas.classList.contains("pen-active")) {
    btn.innerHTML = "<span>✏️</span> Pen: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>✏️</span> Pen: OFF";
    btn.classList.remove("active");
  }
}

// Cập nhật dữ liệu từ vựng cho chủ đề mới
const dictionary = {
  "i": { meaning: "tôi", phonetic: "/aɪ/", type: "pronoun" },
  "don't": { meaning: "không", phonetic: "/doʊnt/", type: "auxiliary verb" },
  "like": { meaning: "thích", phonetic: "/laɪk/", type: "verb" },
  "this": { meaning: "này", phonetic: "/ðɪs/", type: "determiner" },
  "table": { meaning: "cái bàn", phonetic: "/ˈteɪbl/", type: "noun" },

  "why": { meaning: "tại sao", phonetic: "/waɪ/", type: "adverb" },
  "what": { meaning: "điều gì", phonetic: "/wʌt/", type: "pronoun" },
  "is": { meaning: "là, thì, ở", phonetic: "/ɪz/", type: "verb" },
  "wrong": { meaning: "có vấn đề, sai", phonetic: "/rɔːŋ/", type: "adjective" },
  "with": { meaning: "với", phonetic: "/wɪð/", type: "preposition" },
  "it": { meaning: "nó", phonetic: "/ɪt/", type: "pronoun" },

  "small": { meaning: "nhỏ", phonetic: "/smɔːl/", type: "adjective" },
  "and": { meaning: "và", phonetic: "/ænd/", type: "conjunction" },
  "these": { meaning: "những... này", phonetic: "/ðiːz/", type: "determiner" },
  "chairs": { meaning: "những cái ghế", phonetic: "/tʃerz/", type: "noun" },
  "are": { meaning: "thì, là", phonetic: "/ɑːr/", type: "verb" },
  "not": { meaning: "không", phonetic: "/nɑːt/", type: "adverb" },
  "comfortable": { meaning: "thoải mái", phonetic: "/ˈkʌmftərbl/", type: "adjective" },

  "okay": { meaning: "được, đồng ý", phonetic: "/ˌoʊˈkeɪ/", type: "interjection" },
  "where": { meaning: "ở đâu", phonetic: "/wer/", type: "adverb" },
  "do": { meaning: "trợ động từ", phonetic: "/duː/", type: "auxiliary verb" },
  "you": { meaning: "bạn", phonetic: "/juː/", type: "pronoun" },
  "want": { meaning: "muốn", phonetic: "/wɑːnt/", type: "verb" },
  "to": { meaning: "để", phonetic: "/tuː/", type: "particle" },
  "sit": { meaning: "ngồi", phonetic: "/sɪt/", type: "verb" },

  "let's": { meaning: "chúng ta hãy", phonetic: "/lets/", type: "expression" },
  "at": { meaning: "ở, tại", phonetic: "/æt/", type: "preposition" },
  "that": { meaning: "đó", phonetic: "/ðæt/", type: "determiner" },
  "over": { meaning: "ở phía", phonetic: "/ˈoʊvər/", type: "adverb" },
  "there": { meaning: "đó, ở kia", phonetic: "/ðer/", type: "adverb" },

  "but": { meaning: "nhưng", phonetic: "/bʌt/", type: "conjunction" },
  "those": { meaning: "những... kia", phonetic: "/ðoʊz/", type: "determiner" },
  "look": { meaning: "trông có vẻ", phonetic: "/lʊk/", type: "verb" },
  "too": { meaning: "cũng", phonetic: "/tuː/", type: "adverb" },

  "maybe": { meaning: "có lẽ", phonetic: "/ˈmeɪbi/", type: "adverb" },
  "the": { meaning: "mạo từ xác định", phonetic: "/ðə/", type: "article" },
  "very": { meaning: "rất", phonetic: "/ˈveri/", type: "adverb" },
  "big": { meaning: "to, lớn", phonetic: "/bɪɡ/", type: "adjective" },

  "change": { meaning: "thay đổi", phonetic: "/tʃeɪndʒ/", type: "verb" }
};
// Cập nhật câu hội thoại
const sentences = [
  { text: "I don't like this table.", start: 0, end: 3, translation: "Tôi không thích cái bàn này." },
  { text: "Why? What is wrong with it?", start: 3, end: 6, translation: "Tại sao? Nó có vấn đề gì?" },
  { text: "It is small and these chairs are not comfortable.", start: 6, end: 11, translation: "Nó nhỏ và những chiếc ghế này không thoải mái." },
  { text: "OK.", start: 11, end: 13, translation: "Được." },
  { text: "Where do you want to sit?", start: 13, end: 16, translation: "Bạn muốn ngồi ở đâu?" },
  { text: "Let's sit at that table over there, OK?", start: 16, end: 21, translation: "Hãy ngồi ở cái bàn đằng kia nhé?" },
  { text: "But those chairs look small, too.", start: 21, end: 25, translation: "Nhưng những chiếc ghế đó cũng trông nhỏ." },
  { text: "Maybe, but the table is very big.", start: 25, end: 29, translation: "Có thể, nhưng cái bàn rất lớn." },
  { text: "OK, let's change tables.", start: 29, end: 33, translation: "Được, hãy đổi bàn." }
];

function renderSentence(s){
  const words=s.text.split(/\s+/);
  bubble.innerHTML=words.map((w)=>{
    const clean=w.replace(/[.,!?]/g,"").toLowerCase();
    return `<span class="word" onclick="handleWordClick(event, '${clean}')">${w}</span>`;
  }).join(" ");
  bubble.dataset.activeStart=s.start;
}

// Bắt sự kiện chuột phải (hoặc nhấn giữ trên mobile) để dịch nghĩa toàn bộ câu
bubble.addEventListener('contextmenu', function(e) {
  e.preventDefault(); 
  
  const activeStart = bubble.dataset.activeStart;
  if (activeStart) {
    const s = sentences.find(x => String(x.start) === activeStart);
    if (s && s.translation) {
      dictPopup.innerHTML = `
        <b style="color: #c36a2d; font-size: 16px;">🌐 Dịch câu:</b>
        <p style="margin-top: 8px; font-size: 16px; color: #333;">${s.translation}</p>
      `;
      
      dictPopup.style.left = e.clientX + "px";
      dictPopup.style.top = (e.clientY - 90) + "px";
      dictPopup.style.display = "block";

      clearTimeout(window.dictTimeout);
      window.dictTimeout = setTimeout(() => {
        dictPopup.style.display = "none";
      }, 4000);
    }
  }
});

function handleWordClick(event, word) {
  // 1. Chỉ phát âm từ
  if(!canvas.classList.contains("pen-active")) {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // 2. Tra từ điển và hiển thị popup
  const data = dictionary[word];
  if (data) {
    dictPopup.innerHTML = `
      <b style="text-transform: capitalize;">${word}</b> 
      <i style="color: #666; font-size: 16px;">(${data.type || 'n/a'})</i><br>
      <span style="color: #c36a2d; font-size: 16px;">${data.phonetic}</span>
      <p style="margin-top: 8px;">➡️ ${data.meaning}</p>
    `;
    
    dictPopup.style.left = event.clientX + "px";
    dictPopup.style.top = (event.clientY - 130) + "px";
    dictPopup.style.display = "block";

    clearTimeout(window.dictTimeout);
    window.dictTimeout = setTimeout(() => {
      dictPopup.style.display = "none";
    }, 3000);
  }
}

function toggleSubtitle(){
  subtitleOn = !subtitleOn;
  const btn = document.getElementById("subBtn");

  if(subtitleOn){
    btn.innerHTML = "<span>💬</span> Subtitle: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>💬</span> Subtitle: OFF";
    btn.classList.remove("active");
    bubble.innerHTML = ""; 
  }
}

function syncSubtitle(){
  if(!isSyncing) return;

  const ct = video.currentTime;

  if(!subtitleOn){
    bubble.innerHTML = "";
  } else {
    const s = sentences.find(x => ct >= x.start && ct <= x.end);
    if(s && bubble.dataset.activeStart != s.start) renderSentence(s);
  }

  animationFrameId = requestAnimationFrame(syncSubtitle);
}

function playConversation(){
  cancelAnimationFrame(animationFrameId);
  isSyncing=true;
  video.play();
  syncSubtitle();
}

function pauseToggle(){
  video.paused ? video.play() : video.pause();
}

function stopConversation(){
  video.pause(); video.currentTime=0; isSyncing=false;
  bubble.innerText="Bấm Play All để bắt đầu học!";
}

function handleVideoClick(){ video.paused?playConversation():pauseToggle(); }
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

function getPos(e) {
  if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener("touchstart", (e) => { 
  if(!canvas.classList.contains("pen-active")) return;
  if (e.cancelable) e.preventDefault(); 
  isDrawing = true; ctx.beginPath();
  const p = getPos(e); ctx.moveTo(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", (e) => { 
  if (e.cancelable) e.preventDefault(); 
  if(!isDrawing) return; 
  const p = getPos(e);
  ctx.lineTo(p.x, p.y); ctx.strokeStyle = "red"; ctx.lineWidth = 4;
  ctx.lineCap = 'round'; ctx.stroke(); 
}, { passive: false });

canvas.addEventListener("touchend", () => isDrawing = false);

window.addEventListener("keydown", (e) => {
  if (e.key === "PageDown" || e.key === "ArrowRight" || e.key === "PageUp" || e.key === "ArrowLeft" || e.code === "Space") {
    e.preventDefault(); handleVideoClick();
  }
});

window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });
</script>

</body>
