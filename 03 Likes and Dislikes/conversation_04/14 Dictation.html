<script>
const originalSentences = [
  { audio: "videos/sentence1.mp4", text: "What snacks do you like?" },
  { audio: "videos/sentence2.mp4", text: "I like to eat fruit." },
  { audio: "videos/sentence3.mp4", text: "What fruits do you like?" },
  { audio: "videos/sentence4.mp4", text: "I like apples and oranges." },
  { audio: "videos/sentence5.mp4", text: "I like strawberries and watermelon." },
  { audio: "videos/sentence6.mp4", text: "Do you like to eat cookies?" },
  { audio: "videos/sentence7.mp4", text: "I love chocolate chip cookies." },
  { audio: "videos/sentence8.mp4", text: "Me, too!" }
];
    function toggleSidebar(side) {
      const sidebar = document.querySelector(`.sidebar.${side}`);
      const button = document.querySelector(`.toggle-${side}`);
      sidebar.classList.toggle('visible');
      button.textContent = sidebar.classList.contains('visible')
        ? (side === 'left' ? 'Menu' : 'Menu')
        : (side === 'left' ? 'Menu' : 'Menu');
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    let sentences = shuffle([...originalSentences]);
    let currentIndex = 0;
    let score = 0, totalTime = 0;
    const input = document.getElementById("inputText");
const video = document.getElementById("videoPlayer");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const timerDisplay = document.getElementById("timerDisplay");

    function normalize(text) {
  return text
    .trim()                    // Xóa khoảng trắng 2 đầu
    .toLowerCase()             // Chuyển về chữ thường
    .replace(/[^\w\s]|_/g, "") // Xóa TẤT CẢ các dấu câu và ký tự đặc biệt
    .replace(/\s+/g, " ");     // Chuyển nhiều khoảng trắng liên tiếp thành 1 khoảng trắng
}

   function loadSentence(index) {
  if (index >= sentences.length) return showFinalScore();
  const s = sentences[index];
  video.src = s.audio;
  video.load();
  input.value = "";
  
  // Cập nhật số thứ tự câu
  document.getElementById("sentenceCount").textContent = `Sentence ${index + 1} of ${sentences.length}`;
  
  timerDisplay.textContent = "";
  startTime = Date.now();
}

    function checkAnswer() {
  const userInput = normalize(input.value);
  const expected = normalize(sentences[currentIndex].text);
  const timeTaken = Date.now() - startTime;
  totalTime += timeTaken;

  if (userInput === expected) {
    showFeedback("Correct!", "correct");
    score++;
    
    // --- BẮT ĐẦU HIỆU ỨNG PHÁO HOA ---
    var duration = 3 * 1000;
    var animationEnd = Date.now() + duration;
    var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    var interval = setInterval(function() {
      var timeLeft = animationEnd - Date.now();

      if (timeLeft <= 0) {
        return clearInterval(interval);
      }

      var particleCount = 50 * (timeLeft / duration);
      // Bắn pháo hoa từ 2 góc màn hình
      confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
      confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
    }, 250);
    // --- KẾT THÚC HIỆU ỨNG PHÁO HOA ---

    document.getElementById("correctCount").textContent = `${score} Correct`;
    timerDisplay.textContent = `⏱️ Time: ${Math.floor(timeTaken / 1000)}s`;
    document.getElementById("nextButton").classList.remove("hidden");
  } else {
    showFeedback("Incorrect!", "incorrect");
  }
}

    function showFeedback(msg, type) {
      const popup = document.getElementById("feedbackPopup");
      popup.textContent = msg;
      popup.className = type;
      popup.style.display = "block";
      setTimeout(() => popup.style.display = "none", 1500);
    }

    document.getElementById("checkButton").onclick = checkAnswer;
    document.getElementById("hintButton").onclick = () => {
      const next = sentences[currentIndex].text[input.value.length];
      if (next) input.value += next;
    };
    document.getElementById("showAnswer").onclick = () => {
      document.getElementById("answerText").textContent = sentences[currentIndex].text;
      document.getElementById("answerModal").style.display = "flex";
    };
    document.getElementById("nextButton").onclick = () => {
      currentIndex++;
      loadSentence(currentIndex);
      document.getElementById("nextButton").classList.add("hidden");
    };
    document.getElementById("playAgainButton").onclick = () => location.reload();

    loadSentence(currentIndex);
// --- ĐOẠN CODE ĐIỀU KHIỂN BÚT TRÌNH CHIẾU (CLICKER) ---
window.addEventListener('keydown', function(event) {
const video = document.getElementById("videoPlayer");
const nextBtn = document.getElementById("nextButton");
const checkBtn = document.getElementById("checkButton");

// 1. Phím Next (Nút Xuống/Tiến trên bút - thường là PageDown hoặc ArrowRight)
if (event.key === 'PageDown' || event.key === 'ArrowRight') {
event.preventDefault(); // Chống cuộn trang

// Nếu nút "Next" đang hiển thị (đã làm đúng) thì bấm Next câu
if (nextBtn && !nextBtn.classList.contains("hidden")) {
  nextBtn.click();
} 
// Nếu chưa xong bài thì bấm nút "Check"
else if (checkBtn) {
  checkBtn.click();
}


}

// 2. Phím Back (Nút Lên/Lùi trên bút - thường là PageUp hoặc ArrowLeft)
if (event.key === 'PageUp' || event.key === 'ArrowLeft') {
event.preventDefault(); // Chống cuộn trang

// Điều khiển Video: Nếu đang phát thì dừng, đang dừng thì phát
if (video) {
  if (video.paused) {
    // Sử dụng try-catch để tránh lỗi Autoplay của trình duyệt
    video.play().catch(e => console.log("Cần tương tác trước khi phát"));
  } else {
    video.pause();
  }
}


}
});
  </script>
