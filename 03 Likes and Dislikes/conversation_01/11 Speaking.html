<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11 Speaking</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'UTM Avo';
      src: url('fonts/UTM Avo.ttf') format('truetype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'UTM Avo', 'Quicksand', sans-serif;
    }

    body {
      background-color: #f0e6d6;
      background-image: radial-gradient(#d3c4a9 1px, transparent 1px);
      background-size: 25px 25px; /* Họa tiết chấm bi mờ tạo cảm giác học tập */
      color: #333;
      overflow-x: hidden;
    }

    /* === HEADER NATION === */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      border-bottom: 2px solid #e6ccb2;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    header nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      max-width: 900px;
    }

    header button {
      background-color: #ffffff;
      border: 2px solid #e6ccb2;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: #8a6542;
      transition: all 0.3s ease;
      box-shadow: 0 4px 0 #e6ccb2;
    }

    header button:hover {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #e6ccb2;
      background-color: #faf5f0;
    }

    header button.active-nav {
      background-color: #c36a2d;
      color: #fff;
      border-color: #c36a2d;
      box-shadow: 0 4px 0 #a04000;
    }
    
    header button.active-nav:hover {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #a04000;
    }

    /* === SIDEBARS === */
    .sidebar {
      width: 220px;
      background: #ffffff;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: fixed;
      top: 75px;
      bottom: 60px; /* Chừa không gian cho footer */
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.left {
      left: 0;
      transform: translateX(-100%);
      border-right: 4px solid #c36a2d;
      border-radius: 0 20px 20px 0;
    }

    .sidebar.right {
      right: 0;
      transform: translateX(100%);
      border-left: 4px solid #c36a2d;
      border-radius: 20px 0 0 20px;
    }

    .sidebar.visible {
      transform: translateX(0);
    }

    .sidebar button {
      font-size: 15px;
      padding: 12px 15px;
      background: #fdfbf9;
      border: 2px solid #f0e6d6;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      font-weight: 700;
      color: #555;
      transition: all 0.2s;
    }

    .sidebar button:hover {
      border-color: #c36a2d;
      color: #c36a2d;
    }

    .sidebar button.active {
      background-color: #c36a2d;
      color: #fff;
      border-color: #c36a2d;
      box-shadow: 0 4px 0 #a04000;
      transform: translateY(-2px);
    }

    .sidebar button.active:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 #a04000;
    }

    /* === TOGGLE BUTTONS === */
    .toggle-btn {
      position: fixed;
      top: 90px;
      z-index: 20;
      width: 40px;
      height: 50px;
      background: #c36a2d;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: 0.3s;
    }
    .toggle-btn:hover { background: #a04000; }

    .toggle-left {
      left: 0;
      border-radius: 0 25px 25px 0;
    }

    .toggle-right {
      right: 0;
      border-radius: 25px 0 0 25px;
    }

    /* === MAIN CONTENT === */
    .content {
      margin-top: 0px;
      margin-bottom: 0px;
      padding: 40px 20px;
      max-width: 1200px;
      min-height: 300px;
      margin-left: auto;
      margin-right: auto;
      background: #ffffff;
      border-radius: 30px;
      border: 4px solid #fff;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      position: relative;
    }

    #gameContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #centerPanel { width: 100%; }

    #imageContainer {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Video Styling */
    #videoPlayer {
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 8px solid #f3dbc1;
      width: 220px;
      max-width: 100%;
      cursor: pointer;
      transition: transform 0.3s ease;
      background: #000;
    }
    #videoPlayer:hover {
      transform: scale(1.02);
      border-color: #c36a2d;
    }

    /* Text Displays */
    #wordDisplay {
      font-size: 42px;
      font-weight: 700;
      color: #c36a2d;
      background: #fff9f2;
      padding: 15px 30px;
      border-radius: 20px;
      border: 2px dashed #e6ccb2;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      line-height: 1.3;
      max-width: 100%;
    }
    #wordDisplay:hover {
      background: #ffecd6;
      border-color: #c36a2d;
      transform: scale(1.05);
    }

    #recognizedText {
      margin-top: 30px;
      font-size: 32px;
      font-weight: 700;
      color: #e74c3c;
      background: #fdf2f0;
      padding: 15px 30px;
      border-radius: 50px;
      display: inline-block;
      animation: pulseText 2s infinite;
      text-align: center;
      border: 2px solid #fadbd8;
    }

    @keyframes pulseText {
      0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
      100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
    }

    #scoreBoard {
      background: #e1f5fe;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      border: 2px solid #81d4fa;
      display: inline-block;
    }

    /* === POPUPS === */
    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%; /* Sửa lại cho căn giữa màn hình chuẩn hơn */
      transform: translate(-50%, -50%);
      z-index: 2000;
      pointer-events: none;
    }
    .popup img {
      width: 300px;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #micPopup {
      display: none;
      position: fixed;
      top: 90px;
      right: 30px;
      z-index: 1001;
      background: white;
      padding: 10px;
      border-radius: 50%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    #micPopup img { width: 40px; }

    /* === FOOTER BAR === */
    .footer-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 2px solid #e6ccb2;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 15px 20px;
      z-index: 1000;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
    }

    .footer-bar button {
      font-size: 18px;
      font-weight: 700;
      padding: 12px 25px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .footer-bar button[onclick="startRecognition()"] {
      background-color: #2ecc71;
      color: white;
      box-shadow: 0 4px 0 #27ae60;
    }
    .footer-bar button[onclick="startRecognition()"]:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #27ae60;
    }

    .footer-bar button[onclick="skipWord()"] {
      background-color: #f1c40f;
      color: #8c7614;
      box-shadow: 0 4px 0 #d4ac0d;
    }
    .footer-bar button[onclick="skipWord()"]:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #d4ac0d;
    }

    #timeDisplay {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: #34495e;
      padding: 8px 15px;
      border-radius: 10px;
    }

    #scoreBoardFooter {
      font-size: 16px;
      font-weight: 700;
      color: #555;
      background: #f4ece1;
      padding: 10px 20px;
      border-radius: 15px;
      border: 2px solid #e6ccb2;
    }

    @media (max-width: 1200px) {
      .content { margin-top: 100px; }
      #wordDisplay { font-size: 28px; }
      .footer-bar { padding: 10px; gap: 10px; }
      .footer-bar button { font-size: 15px; padding: 10px 15px;}
    }
  </style>
</head>

      <div id="centerPanel" style="display: block;">
        <div id="imageContainer">
          <div id="scoreBoard"></div>
          <video id="videoPlayer" width="200" controls onclick="playSound()"></video>
          <div id="wordDisplay" onclick="playSound()"></div>
          <div id="ipaDisplay" style="font-size: 32px; color: #444; margin-top: 5px;"></div>

  <div class="popup" id="winPopup"><img src="images/win.gif" alt="win"></div>
  <div class="popup" id="failPopup"><img src="images/wrong.gif" alt="fail"></div>
  <div id="micPopup"><img src="images/mic on.gif" alt="mic on"></div>

  <audio id="micSound" src="sounds/mic-on.mp3"></audio>
  <audio id="winSound" src="sounds/win.mp3"></audio>
 <audio id="wrongSound" src="sounds/wrong.mp3"></audio>

<video id="hiddenVideo" style="display:none;"></video>
  <div class="footer-bar">
    <button onclick="startRecognition()">🎙 Start Speaking</button>
    <button onclick="skipWord()">⏭ Skip</button>

    <div id="timeDisplay">00:00</div>
    <div id="scoreBoardFooter">✅ Correct: 0 | ❌ Wrong: 0 | ⏭ Skipped: 0</div>
  </div>

  <script>
  speechSynthesis.onvoiceschanged = () => {}; // Đảm bảo danh sách voice được load

const words = [
  { word: 'So what foods do you like?', video: 'sentence1.mp4' },
  { word: 'I like ice cream and pizza and apples.', video: 'sentence2.mp4' },
  { word: 'Ooh, I like those foods too.', video: 'sentence3.mp4' },
  { word: 'What foods do you like?', video: 'sentence4.mp4' },
  { word: 'I like fish, vegetables, and bananas.', video: 'sentence5.mp4' },
  { word: 'Together?', video: 'sentence6.mp4' },
  { word: 'No, not together.', video: 'sentence7.mp4' }
];
  let currentIndex = 0;
  let correctCount = 0;
  let wrongCount = 0;
  let skipCount = 0;
  let recognition = null;
  let recognizing = false;
  let currentAudio = null;

  function normalize(text) {
    return text
      .toLowerCase()
      .replace(/[.,!?'"“”‘’\-]/g, '') // Bỏ dấu câu
      .replace(/\s+/g, ' ')           // Xoá khoảng trắng thừa
      .trim();
  }

  function playSound() {
  const video = document.getElementById("videoPlayer");
  video.currentTime = 0;
  video.play();
}
  function loadWord(index) {
  const current = words[index];
  const video = document.getElementById("videoPlayer");

  video.src = 'videos/' + current.video;
  video.load();

  // 👉 AUTO PLAY (rất quan trọng)
  video.onloadeddata = () => video.play();

  document.getElementById('wordDisplay').textContent = current.word;

  document.getElementById('recognizedText').innerHTML =
    '<img src="images/mic on.gif" style="height:40px; vertical-align:middle;"> You said: ...';
}

  function updateScore() {
       document.getElementById('scoreBoardFooter').textContent =
      `✅ Correct: ${correctCount} | ❌ Wrong: ${wrongCount} | ⏭ Skipped: ${skipCount}`;
  }

  function startRecognition() {
    if (recognizing) return;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Trình duyệt không hỗ trợ Speech Recognition');
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      document.getElementById('micPopup').style.display = 'block';
      document.getElementById('recognizedText').innerHTML =
        `<img src="images/mic on.gif" style="height:40px; vertical-align:middle;"> Listening...`;
    };

    recognition.onresult = (event) => {
      recognizing = false;
      document.getElementById('micPopup').style.display = 'none';

      const transcriptRaw = event.results[0][0].transcript;
      const transcript = normalize(transcriptRaw);
      const correct = normalize(words[currentIndex].word);

      document.getElementById('recognizedText').innerHTML =
        `<img src="images/mic on.gif" style="height:40px; vertical-align:middle;"> ${transcriptRaw}`;

      if (transcript === correct) {
        document.getElementById('winPopup').style.display = 'block';
        document.getElementById('winSound').play();
        correctCount++;
        updateScore();
        setTimeout(() => {
          document.getElementById('winPopup').style.display = 'none';
          currentIndex = (currentIndex + 1) % words.length;
          loadWord(currentIndex);
        }, 1500);
      } else {
        document.getElementById('failPopup').style.display = 'block';
        wrongCount++;
        updateScore();
        document.getElementById('wrongSound').play();
        setTimeout(() => {
          document.getElementById('failPopup').style.display = 'none';
        }, 1500);
      }
    };

    recognition.onerror = (event) => {
      recognizing = false;
      document.getElementById('micPopup').style.display = 'none';
      alert('Lỗi microphone. Vui lòng thử lại.');
      console.error(event.error);
    };

    recognition.onend = () => {
      recognizing = false;
      document.getElementById('micPopup').style.display = 'none';
    };

    recognition.start();
  }

  function skipWord() {
  skipCount++;
  updateScore();
  currentIndex = (currentIndex + 1) % words.length;
  loadWord(currentIndex);
}
function flashBtn(type) {
    let btn;

    if (type === "skip") btn = document.querySelector('button[onclick="skipWord()"]');
    if (type === "mic") btn = document.querySelector('button[onclick="startRecognition()"]');

    if (!btn) return;

    btn.style.transform = "scale(1.1)";
    btn.style.boxShadow = "0 0 15px rgba(255, 152, 0, 0.8)";

    setTimeout(() => {
        btn.style.transform = "";
        btn.style.boxShadow = "";
    }, 200);
}
function flashWord() {
    const word = document.getElementById("wordDisplay");
    word.style.color = "#e74c3c";
    word.style.transform = "scale(1.1)";

    setTimeout(() => {
        word.style.color = "#c36a2d";
        word.style.transform = "";
    }, 300);
}

  function toggleSidebar(side) {
    const sidebar = document.querySelector(`.sidebar.${side}`);
    const button = document.querySelector(`.toggle-${side}`);
    sidebar.classList.toggle('visible');
    button.textContent = sidebar.classList.contains('visible')
      ? (side === 'left' ? '◀' : '▶')
      : (side === 'left' ? '▶' : '◀');
  }

  window.onload = () => {
    loadWord(currentIndex);
    updateScore();
  };
// ===== REMOTE CONTROL - SPEAKING =====
document.addEventListener("keydown", function(e) {
    const key = e.key.toLowerCase();

    // 👉 NEXT (chuyển câu)
    if (key === "arrowright" || key === "pagedown" || key === "arrowdown") {
        flashBtn("skip");
        skipWord();
    }

    // 👉 BACK (nghe lại audio)
    if (key === "arrowleft" || key === "pageup" || key === "arrowup") {
        flashWord();
        playSound();
    }

    // 👉 OK (bắt đầu nói)
    if (key === "enter") {
        flashBtn("mic");
        startRecognition();
    }
});
</script>
