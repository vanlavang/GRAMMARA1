header button {

    h2 {

    /* === FOOTER TOOLBAR === */

    button {

    .score { font-size: 16px; color: #2e7d32; font-weight: bold; background: white; padding: 5px 10px; border-radius: 5px; }
    audio { height: 32px; max-width: 280px; }

    /* === CANVAS PEN === */
    #drawing-canvas {
      position: fixed;
      top: 0;

      height: 100%;
      pointer-events: none; /* Mặc định không cho vẽ để tương tác với list */
      z-index: 1500;
    }
    #drawing-canvas.active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* === HEADER & SIDEBAR === */
    header {
      background-color: #f3dbc1;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      border-bottom: 2px solid #d4bfa6;
      z-index: 999;
      flex-wrap: wrap;
    }
    header nav a {
      font-size: 18px;
      padding: 10px 20px;
      border: 1px solid #c9a77b;
      background: #fff3e0;
      border-radius: 10px;
      text-decoration: none;
      color: black;
    }
    header.collapsed { max-height: 0; opacity: 0; overflow: hidden; }
    header.expanded { display: flex; max-height: 200px; opacity: 1; }

.toggle-btn {
  position: fixed;
  top: 50px;
  width: 35px;
  height: 50px;
  background: #c9a77b;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 18px;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
}

.toggle-left { border-radius: 0 8px 8px 0; left: 0; }
.toggle-right { border-radius: 8px 0 0 8px; right: 0; }

.sidebar {
  width: 150px;
  background-color: #f3dbc1;
  padding: 15px 10px;
  position: fixed;
  top: 100px; 
  bottom: 0;
  border: 2px solid #d4bfa6;
  overflow-y: auto;
  z-index: 997;
  display: flex;
  flex-direction: column;
  align-items: justify; 
}
.sidebar.left { 
  left: 0; 
  transform: translateX(-100%); 
  border-radius: 0 15px 15px 0;
}

.sidebar.right { 
  right: 0; 
  transform: translateX(100%); 
  border-radius: 15px 0 0 15px;
  box-shadow: -4px 0 15px rgba(0, 0, 0, 0.1);
}

.sidebar.visible { transform: translateX(0); }

.sidebar button {
  display: block;
  width: 100%;
  min-height: 30px;
  background-color: #fff;
  border: 1px solid #d4bfa6;
  margin-bottom: 12px;
  padding: 4px 6px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  color: #8b5e3c;
  text-align: left;
  font-weight: normal;
  box-sizing: border-box;
}

.sidebar button:hover {
  background-color: #8b5e3c;
  color: #fff;
  transform: translateX(5px);
}
    #dialogue-list { width: 85%; margin: 0 auto; }
    #toggleHeaderBtn {
      position: fixed; top: 5px; right: 10px; z-index: 1001; background: #c9a77b; color: white; border: none; border-radius: 6px; padding: 6px 10px; font-size: 16px; cursor: pointer;
    }

.sidebar button.active {
  background-color: #d35400;
  color: #fff;
  border: 2px solid #a04000;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
}

.sidebar button.active b {
  color: #fff;

<body>

<canvas id="drawing-canvas"></canvas>

<h2>
  Reorder the Dialogue
<audio id="mainAudio" controls preload="none">
    <source src="sounds/A1-03-1-Likes-Food.mp3" type="audio/mpeg" />
  </audio>
</h2>

<ul id="dialogue-list">
  <li data-index="1">So, what foods do you like?</li>
  <li data-index="2">I like ice cream, and pizza, and apples.</li>
  <li data-index="3">Ooh, I like those foods, too.</li>
  <li data-index="4">What foods do you like?</li>
  <li data-index="5">I like fish, vegetables, and bananas.</li>
  <li data-index="6">Together?</li>
  <li data-index="7">No, not together!</li>
</ul>
<footer>
  <div class="score" id="score-result"></div>
  <button onclick="checkAnswer()">✅ Check Answer</button>
  <button onclick="showAnswer()">👁️ Show Answer</button>
  <button onclick="resetActivity()">🔁 Reset</button>
  <button id="penToggle" onclick="togglePen()">🖊️ Pen Off</button>
  <button onclick="clearCanvas()">🗑️ Clear Pen</button>
</footer>

<script>
  const correctOrder = [
  "So, what foods do you like?",
  "I like ice cream, and pizza, and apples.",
  "Ooh, I like those foods, too.",
  "What foods do you like?",
  "I like fish, vegetables, and bananas.",
  "Together?",
  "No, not together!"
];

  const list = document.getElementById("dialogue-list");
  const scoreDisplay = document.getElementById("score-result");
  
  let selectedItem = null;
  let currentAudio = null; // Biến lưu trữ luồng âm thanh đang phát

  window.addEventListener("DOMContentLoaded", () => {
    shuffleList();
    attachClickEvents();
  });

  // LOGIC CLICK / TAP TO SWAP (Chạm để chọn & chuyển vị trí)
  function handleItemClick(e) {
    const clickedItem = e.currentTarget;

    // Xóa màu đúng/sai khi người dùng thao tác lại
    clickedItem.classList.remove("correct", "wrong");

    // Trường hợp 1: Chưa có câu nào được chọn -> Chọn câu này và PHÁT AUDIO
    if (!selectedItem) {
      selectedItem = clickedItem;
      selectedItem.classList.add("selected-to-move");
      playSentenceAudio(clickedItem);
    } 
    // Trường hợp 2: Chạm lại chính câu đang chọn -> Bỏ chọn & Ngắt audio
    else if (selectedItem === clickedItem) {
      selectedItem.classList.remove("selected-to-move");
      selectedItem = null;
      stopCurrentAudio();
    } 
    // Trường hợp 3: Chạm vào câu thứ 2 -> Đổi chỗ (Không phát audio câu 2 để tránh ồn)
    else {
      swapElements(selectedItem, clickedItem);
      selectedItem.classList.remove("selected-to-move");
      selectedItem = null;
    }
  }

  // Hàm quản lý phát âm thanh duy nhất (Đảm bảo chỉ nghe 1 âm thanh)
  function playSentenceAudio(item) {
    stopCurrentAudio(); // Tắt âm thanh cũ (nếu đang phát dở) trước khi bật câu mới

    const index = item.getAttribute("data-index");
    currentAudio = new Audio(`sounds/sentence${index}.mp3`);
    currentAudio.play().catch(() => {});
  }

  // Hàm dừng âm thanh đang phát
  function stopCurrentAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
  }

  // Hàm hoán đổi vị trí trong DOM giữa 2 node li
  function swapElements(elem1, elem2) {
    const parent = elem1.parentNode;
    const next1 = elem1.nextElementSibling === elem2 ? elem1 : elem1.nextElementSibling;
    parent.insertBefore(elem1, elem2);
    parent.insertBefore(elem2, next1);
  }

  // Gắn sự kiện click vào tất cả các li
  function attachClickEvents() {
    const items = document.querySelectorAll("#dialogue-list li");
    items.forEach(item => {
      item.removeEventListener("click", handleItemClick);
      item.addEventListener("click", handleItemClick);
    });
  }

  function checkAnswer() {
    stopCurrentAudio();
    if (selectedItem) {
      selectedItem.classList.remove("selected-to-move");
      selectedItem = null;
    }
    const items = document.querySelectorAll("#dialogue-list li");
    let correct = 0;
    items.forEach((item, index) => {
      const text = item.innerText.trim();
      if (text === correctOrder[index]) {
        item.classList.add("correct");
        item.classList.remove("wrong");
        correct++;
      } else {
        item.classList.add("wrong");
        item.classList.remove("correct");
      }
    });
    scoreDisplay.innerHTML = `✅ ${correct}/${correctOrder.length}`;
  }

  function showAnswer() {
    stopCurrentAudio();
    if (selectedItem) selectedItem = null;
    list.innerHTML = "";
    correctOrder.forEach((text, i) => {
      const li = document.createElement("li");
      li.innerText = text;
      li.setAttribute("data-index", i + 1);
      li.classList.add("correct");
      list.appendChild(li);
    });
    attachClickEvents();
  }

  function resetActivity() {
    stopCurrentAudio();
    if (selectedItem) {
      selectedItem.classList.remove("selected-to-move");
      selectedItem = null;
    }
    const items = document.querySelectorAll("#dialogue-list li");
    items.forEach(item => item.classList.remove("correct", "wrong"));
    shuffleList();
    scoreDisplay.innerHTML = "";
  }

  function shuffleList() {
    const items = Array.from(document.querySelectorAll("#dialogue-list li"));
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      list.appendChild(items[j]);
    }
    attachClickEvents();
  }

  function toggleSidebar(side) {
    const sidebar = document.querySelector(`.sidebar.${side}`);
    const btn = document.querySelector(`.toggle-${side}`);
    const show = !sidebar.classList.contains("visible");
    sidebar.classList.toggle("visible");
    btn.textContent = show ? "Menu" : "Menu";
  }

  const toggleHeaderBtn = document.getElementById("toggleHeaderBtn");
  const header = document.querySelector("header");

  toggleHeaderBtn.onclick = () => {
    const isCollapsed = header.classList.contains("collapsed");
    header.classList.toggle("collapsed", !isCollapsed);
    header.classList.toggle("expanded", isCollapsed);
    toggleHeaderBtn.textContent = isCollapsed ? "Menu" : "Menu";
  };

  /* === PEN LOGIC === */
  const canvas = document.getElementById('drawing-canvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let penEnabled = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function togglePen() {
    penEnabled = !penEnabled;
    const btn = document.getElementById('penToggle');
    if (penEnabled) {
      canvas.classList.add('active');
      btn.textContent = "🖊️ Pen On";
      btn.classList.add('active');
    } else {
      canvas.classList.remove('active');
      btn.textContent = "🖊️ Pen Off";
      btn.classList.remove('active');
    }
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function startDrawing(e) {
    if (!penEnabled) return;
    drawing = true;
    draw(e);
  }

  function stopDrawing() {
    drawing = false;
    ctx.beginPath();
  }

  function draw(e) {
    if (!drawing || !penEnabled) return;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'red';

    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
    e.preventDefault();
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('touchstart', startDrawing);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDrawing);

  /* === REMOTE CONTROL (PRESENTATION PEN) === */
  const mainAudio = document.getElementById("mainAudio");

  function togglePlayPause() {
    if (!mainAudio) return;
    if (mainAudio.paused) {
      stopCurrentAudio(); // Nếu bật audio chính, tắt audio câu nhỏ
      mainAudio.play();
    } else {
      mainAudio.pause();
    }
  }

  document.addEventListener("keydown", function (e) {
    if (
      e.code === "Space" ||
      e.code === "Enter" ||
      e.code === "NumpadEnter" ||
      e.code === "PageDown" ||
      e.code === "ArrowRight"
    ) {
      e.preventDefault();
      togglePlayPause();
    }

    if (e.code === "PageUp" || e.code === "ArrowLeft") {
      mainAudio.currentTime -= 5;
    }

    if (e.code === "ArrowUp") {
      mainAudio.volume = Math.min(1, mainAudio.volume + 0.1);
    }

    if (e.code === "ArrowDown") {
      mainAudio.volume = Math.max(0, mainAudio.volume - 0.1);
    }
  });
</script>
</body>
