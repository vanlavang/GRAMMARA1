function toggleSidebar(id) {
  const sb = document.getElementById(id);
  const isOpen = sb.classList.contains('open');
  document.getElementById('sidebarLeft').classList.remove('open');
  document.getElementById('sidebarRight').classList.remove('open');
  if(!isOpen) sb.classList.add('open');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.sidebar') && !e.target.closest('.btn-side')) {
    document.getElementById('sidebarLeft').classList.remove('open');
    document.getElementById('sidebarRight').classList.remove('open');
  }
});

function togglePen(){
  canvas.classList.toggle("pen-active");
  const btn = document.getElementById("penBtn");
  if(canvas.classList.contains("pen-active")) {
    btn.innerHTML = "<span>✏️</span> Pen: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>✏️</span> Pen: OFF";

}

function changeSpeed() {

// --- LOGIC QUIZ MỚI THÊM ---
const quizData = [
  { q: "Who are the two new students?", opts: ["Leo and Maya", "Ryan and Yummy", "Tom and Anna"], ans: 1 },
  { q: "What does the teacher ask the class to do first?", opts: ["Open books", "Introduce themselves", "Play a game"], ans: 1 },
  { q: "What does Leo like?", opts: ["Reading", "Drawing", "Singing"], ans: 1 },
  { q: "What does Maya like?", opts: ["Drawing", "Reading stories", "Dancing"], ans: 1 },
  { q: "What does Ryan like?", opts: ["Playing with cars", "Playing football", "Singing"], ans: 0 },
  { q: "What does Yummy like?", opts: ["Painting and singing", "Reading and writing", "Dancing"], ans: 0 },

  { q: "What activity do students do next?", opts: ["Work in pairs", "Write homework", "Watch video"], ans: 0 },
  { q: "What question do they ask each other?", opts: ["Where do you live?", "What do you like?", "How old are you?"], ans: 1 },
  { q: "What is Leo's favorite color?", opts: ["Blue", "Green", "Red"], ans: 1 },
  { q: "What is Yummy's favorite color?", opts: ["Pink", "Yellow", "Green"], ans: 0 },

  { q: "What does Ryan like to play with?", opts: ["Blocks and cars", "Books", "Music"], ans: 0 },
  { q: "What is Ryan's favorite color?", opts: ["Blue", "Pink", "Green"], ans: 0 },
  { q: "What does Maya like?", opts: ["Dancing", "Singing", "Drawing"], ans: 0 },
  { q: "What is Maya's favorite color?", opts: ["Yellow", "Blue", "Green"], ans: 0 },

  { q: "Who tells about Yummy?", opts: ["Ryan", "Leo", "Maya"], ans: 1 },
  { q: "What does Yummy like?", opts: ["Painting and singing", "Reading", "Football"], ans: 0 },

  { q: "Who tells about Ryan?", opts: ["Leo", "Maya", "Teacher"], ans: 1 },
  { q: "What does Ryan like?", opts: ["Cars", "Books", "Music"], ans: 0 },

  { q: "What does the teacher say at the end?", opts: ["Do homework", "You did a wonderful job", "Go home"], ans: 1 },
  { q: "What do students say to the teacher?", opts: ["Good morning", "Thank you", "See you"], ans: 1 }
];
let currentQIndex = 0;

function renderQuiz() {
  const qp = document.getElementById("quizContent");
  if (currentQIndex >= quizData.length) {
    qp.innerHTML = "<h4 style='text-align:center; color: #28a745; margin-top:20px;'>🎉 You finished the quiz!</h4><button class='quiz-option' style='margin-top:20px; text-align:center;' onclick='resetQuiz()'>Play Again</button>";
    return;
  }
  const q = quizData[currentQIndex];
  let html = `<div style="text-align: left;">
    <div style="font-weight: bold; margin-bottom: 15px; font-size: 16px;">Question ${currentQIndex + 1}: ${q.q}</div>
  `;
  q.opts.forEach((opt, idx) => {
    html += `<button class="quiz-option" onclick="checkAns(this, ${idx === q.ans})">${opt}</button>`;
  });
  html += `</div>`;
  qp.innerHTML = html;
}

function checkAns(btn, isCorrect) {
  const btns = btn.parentElement.querySelectorAll('.quiz-option');
  btns.forEach(b => b.style.pointerEvents = 'none'); 
  if (isCorrect) {
    btn.classList.add('correct');
    setTimeout(() => {
      currentQIndex++;
      renderQuiz();
    }, 1000);
  } else {
    btn.classList.add('wrong');
    setTimeout(() => {
      btn.classList.remove('wrong');
      btns.forEach(b => b.style.pointerEvents = 'auto');
    }, 800);
  }
}

function resetQuiz() {
  currentQIndex = 0;
  renderQuiz();
}

function toggleQuiz() {
  const qp = document.getElementById("quizPanel");
  const topBtn = document.getElementById("quizBtnTop");
  
  if (qp.style.display === "none" || qp.style.display === "") {
    qp.style.display = "block";
    topBtn.classList.add("active");
    topBtn.innerHTML = "<span>❓</span> Quiz: ON";
    if(currentQIndex === 0) renderQuiz();
  } else {
    qp.style.display = "none";
    topBtn.classList.remove("active");
    topBtn.innerHTML = "<span>❓</span> Quiz: OFF";
  }
}

function renderSentence(s){
  const words=s.text.split(/\s+/);
  bubble.innerHTML=words.map((w)=>{
    const clean=w.replace(/[.,!?]/g,"").toLowerCase();
    return `<span class="word" onclick="handleWordClick(event, '${clean}')">${w}</span>`;
  }).join(" ");
  bubble.dataset.activeStart=s.start;
}

bubble.addEventListener('contextmenu', function(e) {
  e.preventDefault(); 
  
  const activeStart = bubble.dataset.activeStart;
  if (activeStart) {
    const s = sentences.find(x => String(x.start) === activeStart);
    if (s && s.translation) {
      dictPopup.innerHTML = `
        <b style="color: #c36a2d; font-size: 16px;">🌐 Dịch câu:</b>
        <p style="margin-top: 8px; font-size: 16px; color: #333;">${s.translation}</p>
      `;
      
      dictPopup.style.left = e.clientX + "px";
      dictPopup.style.top = (e.clientY - 90) + "px";
      dictPopup.style.display = "block";

      clearTimeout(window.dictTimeout);
      window.dictTimeout = setTimeout(() => {
        dictPopup.style.display = "none";
      }, 4000);
    }
  }
});

function handleWordClick(event, word) {
  if(!canvas.classList.contains("pen-active")) {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  const data = dictionary[word];
  if (data) {
    dictPopup.innerHTML = `
      <b style="text-transform: capitalize;">${word}</b> 
      <i style="color: #666; font-size: 16px;">(${data.type || 'n/a'})</i><br>
      <span style="color: #c36a2d; font-size: 16px;">${data.phonetic}</span>
      <p style="margin-top: 8px;">➡️ ${data.meaning}</p>
    `;
    
    dictPopup.style.left = event.clientX + "px";
    dictPopup.style.top = (event.clientY - 130) + "px";
    dictPopup.style.display = "block";

    clearTimeout(window.dictTimeout);
    window.dictTimeout = setTimeout(() => {
      dictPopup.style.display = "none";
    }, 3000);
  }
}

function toggleSubtitle(){
  subtitleOn = !subtitleOn;
  const btn = document.getElementById("subBtn");

  if(subtitleOn){
    btn.innerHTML = "<span>💬</span> Subtitle: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>💬</span> Subtitle: OFF";
    btn.classList.remove("active");
    bubble.innerHTML = ""; 
  }
}

function syncSubtitle(){
  if(!isSyncing) return;

  const ct = video.currentTime;

  if(!subtitleOn){
    bubble.innerHTML = "";
  } else {
    const s = sentences.find(x => ct >= x.start && ct <= x.end);
    if(s && bubble.dataset.activeStart != s.start) renderSentence(s);
  }

  animationFrameId = requestAnimationFrame(syncSubtitle);
}

function playConversation(){
  cancelAnimationFrame(animationFrameId);
  isSyncing=true;
  video.play();
  syncSubtitle();
}

function pauseToggle(){
  video.paused ? video.play() : video.pause();
}

function stopConversation(){
  video.pause(); video.currentTime=0; isSyncing=false;
  bubble.innerText="Bấm Play All để bắt đầu học!";
}

function handleVideoClick(){ video.paused?playConversation():pauseToggle(); }
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

function getPos(e) {
  if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener("touchstart", (e) => { 
  if(!canvas.classList.contains("pen-active")) return;
  if (e.cancelable) e.preventDefault(); 
  isDrawing = true; ctx.beginPath();
  const p = getPos(e); ctx.moveTo(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", (e) => { 
  if (e.cancelable) e.preventDefault(); 
  if(!isDrawing) return; 
  const p = getPos(e);
  ctx.lineTo(p.x, p.y); ctx.strokeStyle = "red"; ctx.lineWidth = 4;
  ctx.lineCap = 'round'; ctx.stroke(); 
}, { passive: false });

canvas.addEventListener("touchend", () => isDrawing = false);

window.addEventListener("keydown", (e) => {
  if (e.key === "PageDown" || e.key === "ArrowRight" || e.key === "PageUp" || e.key === "ArrowLeft" || e.code === "Space") {
    e.preventDefault(); handleVideoClick();
  }
});

window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });
</script>
