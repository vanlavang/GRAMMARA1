<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Conversation – Modern Learning</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family: 'Quicksand', sans-serif;}

body{
  background: #f0e6d6; /* Màu beige đậm hơn như trong hình */
  padding-top: 170px; 
  overflow-x: hidden;
  color: #333;
}

header{
  position:fixed;top:0;left:0;right:0;
  background: #e5d8c1; /* Màu Header đậm hơn body */
  padding: 15px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  border-bottom: 2px solid #d3c4a9;
}

/* Thanh trên cùng: Menu - Conv 01-04 - Menu */
.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1200px;
}

.nav-links {
  display: flex;
  justify-content: center;
  gap: 10px;
  align-items: center;
  background: rgba(255, 255, 255, 0.4);
  padding: 5px;
  border-radius: 25px;
}

.nav-links a {
  text-decoration: none;
  color: #8a6542;
  font-weight: 700;
  font-size: 13px;
  padding: 8px 15px;
  border-radius: 25px;
  transition: 0.3s;
}

.nav-links a.active-link {
  background: #c36a2d; /* Màu cam đậm */
  color: #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* Thanh dưới: Play, Pause, Stop, Pen, Clear */
.controls{
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
}

.btn{
  padding:10px 20px;
  border-radius:25px;
  border: 1px solid #dcdcdc;
  background: #ffffff;
  color: #333;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 0 #dcdcdc;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
}

.btn:active {
  transform: translateY(2px);
  box-shadow: 0 0px 0 #dcdcdc;
}

/* Nút Menu hai bên */
.btn-side {
  background: #c36a2d;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 25px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 0 #a04000;
}

.btn-side:active {
  transform: translateY(2px);
  box-shadow: 0 0px 0 #a04000;
}

.btn.active{
  background: #fff !important;
  color: #c36a2d !important;
  border-color: #c36a2d;
}

/* Sidebar */
.sidebar {
  position: fixed;
  top: 0;
  width: 240px;
  height: 100%;
  background: #ffffff;
  z-index: 2000;
  transition: cubic-bezier(0.4, 0, 0.2, 1) 0.4s;
  padding: 30px 15px;
  box-shadow: 5px 0 25px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar.left { left: -250px; border-right: 4px solid #c36a2d; }
.sidebar.right { right: -250px; border-left: 4px solid #c36a2d; }
.sidebar.open { transform: translateX(250px); }
.sidebar.right.open { transform: translateX(-250px); }

.sidebar button {
  padding: 12px 15px;
  border-radius: 25px;
  border: 1px solid #eee;
  background: #fff;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
}
.sidebar button.active { background: #c36a2d; color: #fff; }

.content{ text-align:center; padding: 0 10px; }

#mainVideo{
  width:100%; max-width:480px;
  border-radius:25px;
  cursor:pointer;
  background:#000;
  border: 10px solid #000; /* Viền đen dày như hình */
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.speech{
  margin: 30px auto;
  max-width: 1000px;
  background: #ffffff;
  border-radius: 325px;
  padding: 25px;
  font-size: 32px;
  font-weight: 700;
  box-shadow: 0 10px 0 #dcdcdc;
  line-height: 1.4;
}

.word{
  cursor:pointer;
  padding: 2px 6px;
  border-radius: 25px;
  display:inline-block;
}

.word.reading{
  background: #ffeb3b;
  color: #c36a2d;
  transform: scale(1.1);
}

canvas{
  position:fixed; top:0; left:0;
  width:100vw; height:100vh;
  pointer-events:none; z-index:900;
  touch-action: none;
}
canvas.pen-active{ pointer-events:auto; }

#dictPopup {
  position: fixed;
  background: white;
  border-top: 5px solid #c36a2d;
  padding: 15px;
  border-radius: 25px;
  z-index: 2000;
  display: none;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  min-width: 180px;
  pointer-events: none;
}
</style>
</head>

<body>

<canvas id="drawingCanvas"></canvas>
<div id="dictPopup"></div>

<div id="sidebarLeft" class="sidebar left">
  <h3 style="margin-bottom:15px; color:#c36a2d">📚 Lessons</h3>
   <button onclick="location.href='01 Vocabulary 1.html'">Vocabulary 1</button>
  <button onclick="location.href='02 Vocabulary 2.html'">Vocabulary 2</button>
  <button onclick="location.href='03 Vocabulary memory matching.html'">Memory Matching</button>
  <button onclick="location.href='04 grammar.html'">Grammar</button>
  <button onclick="location.href='05 Sentence Swap Game.html'">Sentence Swap</button>
  <button onclick="location.href='06 Reorder.html'">Reorder</button>
  <button onclick="location.href='07 Dropdown.html'">Dropdown</button>

</div>

<div id="sidebarRight" class="sidebar right">
  <h3 style="margin-bottom:15px; color:#c36a2d">📝 Practice</h3>
    <button onclick="location.href='08 quiz.html'"><b>Quiz</b></button>
  <button onclick="location.href='09 true false.html'"><b>True / False</b></button>
  <button onclick="location.href='10 Wh questions.html'"><b>WH Questions</b></button>
  <button onclick="location.href='11 Speaking.html'"><b>Speaking</b></button>
  <button onclick="location.href='12 Sentence.html'"><b>Sentence</b></button>
  <button onclick="location.href='13 Cloze.html'"><b>Cloze</b></button>
  <button onclick="location.href='14 Dictation.html'"><b>Dictation</b></button>
<button onclick="location.href='story.html'">Story</button>
</div>

<header>
  <div class="top-nav">
    <button class="btn-side" onclick="toggleSidebar('sidebarLeft')">☰ Menu</button>
    <nav class="nav-links">
      <a href="../conversation_01/conversation_01.html" >Conversation 01</a>
      <a href="../conversation_02/conversation_02.html">Conversation 02</a>
      <a href="../conversation_03/conversation_03.html">Conversation 03</a>
      <a href="../conversation_04/conversation_04.html"class="active-link">Conversation 04</a>
    </nav>
    <button class="btn-side" onclick="toggleSidebar('sidebarRight')">Menu ☰</button>
  </div>

  <div class="controls">
    <button class="btn" onclick="playConversation()"><span>🔊</span> Play All</button>
    <button class="btn" onclick="pauseToggle()"><span>⏸</span> Pause</button>
    <button class="btn" onclick="stopConversation()"><span>⏹</span> Stop</button>
    <button class="btn" id="penBtn" onclick="togglePen()"><span>✏️</span> Pen: OFF</button>
    <button class="btn" onclick="clearCanvas()"><span>🗑️</span> Clear</button>
<button class="btn" id="subBtn" onclick="toggleSubtitle()">
  <span>💬</span> Subtitle: ON
</button>
  </div>
</header>

<div class="content">
  <video id="mainVideo" onclick="handleVideoClick()" playsinline>
    <source src="videos/conversation_04.mp4" type="video/mp4">
  </video>
  <div class="speech" id="currentLine">Bấm Play All để bắt đầu học!</div>
</div>

<script>
let subtitleOn = false;
/* GIỮ NGUYÊN TOÀN BỘ LOGIC GAME CỦA BẠN (ĐÃ FIX PHẦN PEN BUTTON TEXT) */
const video = document.getElementById("mainVideo");
const bubble = document.getElementById("currentLine");
const canvas = document.getElementById("drawingCanvas");
const ctx = canvas.getContext("2d");
const dictPopup = document.getElementById("dictPopup");

canvas.width = innerWidth;
canvas.height = innerHeight;

let animationFrameId, isSyncing=false, isDrawing=false;

function toggleSidebar(id) {
  const sb = document.getElementById(id);
  const isOpen = sb.classList.contains('open');
  document.getElementById('sidebarLeft').classList.remove('open');
  document.getElementById('sidebarRight').classList.remove('open');
  if(!isOpen) sb.classList.add('open');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.sidebar') && !e.target.closest('.btn-side')) {
    document.getElementById('sidebarLeft').classList.remove('open');
    document.getElementById('sidebarRight').classList.remove('open');
  }
});

function togglePen(){
  canvas.classList.toggle("pen-active");
  const btn = document.getElementById("penBtn");
  if(canvas.classList.contains("pen-active")) {
    btn.innerHTML = "<span>✏️</span> Pen: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>✏️</span> Pen: OFF";
    btn.classList.remove("active");
  }
}

// Dữ liệu từ điển và câu giữ nguyên...
const dictionary = {
  "tony": { meaning: "tên riêng Tony", phonetic: "/ˈtoʊni/", type: "proper noun" },
  "where": { meaning: "ở đâu", phonetic: "/wer/", type: "question word" },
  "is": { meaning: "là, ở", phonetic: "/ɪz/", type: "verb" },
  "the": { meaning: "mạo từ xác định", phonetic: "/ðə/", type: "article" },
  "computer": { meaning: "máy tính", phonetic: "/kəmˈpjuːtər/", type: "noun" },
  "lab": { meaning: "phòng thí nghiệm / phòng máy", phonetic: "/læb/", type: "noun" },

  "it’s": { meaning: "it is (nó là)", phonetic: "/ɪts/", type: "contraction" },
  "just": { meaning: "chỉ, đơn giản là", phonetic: "/dʒʌst/", type: "adverb" },
  "down": { meaning: "xuống, dọc theo", phonetic: "/daʊn/", type: "preposition" },
  "hall": { meaning: "hành lang", phonetic: "/hɔːl/", type: "noun" },

  "my": { meaning: "của tôi", phonetic: "/maɪ/", type: "possessive" },
  "spanish": { meaning: "tiếng Tây Ban Nha", phonetic: "/ˈspænɪʃ/", type: "noun" },
  "class": { meaning: "lớp học", phonetic: "/klæs/", type: "noun" },
  "there": { meaning: "ở đó", phonetic: "/ðer/", type: "adverb" },
  "tomorrow": { meaning: "ngày mai", phonetic: "/təˈmɑːroʊ/", type: "adverb" },

  "oh": { meaning: "ồ", phonetic: "/oʊ/", type: "interjection" },
  "when": { meaning: "khi nào", phonetic: "/wen/", type: "question word" },

  "at": { meaning: "tại, vào lúc", phonetic: "/æt/", type: "preposition" },
  "6": { meaning: "số 6", phonetic: "/sɪks/", type: "number" },
  "after": { meaning: "sau", phonetic: "/ˈæftər/", type: "preposition" },
  "school": { meaning: "trường học", phonetic: "/skuːl/", type: "noun" },

  "why": { meaning: "tại sao", phonetic: "/waɪ/", type: "question word" },
  "isn’t": { meaning: "is not (không phải)", phonetic: "/ˈɪzənt/", type: "contraction" },
  "online": { meaning: "trực tuyến", phonetic: "/ˈɒnlaɪn/", type: "adjective" },

  "it": { meaning: "nó", phonetic: "/ɪt/", type: "pronoun" },
  "but": { meaning: "nhưng", phonetic: "/bʌt/", type: "conjunction" },
  "i’m": { meaning: "I am (tôi là)", phonetic: "/aɪm/", type: "contraction" },
  "still": { meaning: "vẫn còn", phonetic: "/stɪl/", type: "adverb" },
  "new": { meaning: "mới", phonetic: "/nuː/", type: "adjective" },
  "in": { meaning: "trong, ở", phonetic: "/ɪn/", type: "preposition" },
  "town": { meaning: "thị trấn", phonetic: "/taʊn/", type: "noun" },
  "so": { meaning: "vì vậy", phonetic: "/soʊ/", type: "conjunction" },
  "don’t": { meaning: "do not (không)", phonetic: "/doʊnt/", type: "contraction" },
  "have": { meaning: "có", phonetic: "/hæv/", type: "verb" },
  "internet": { meaning: "mạng internet", phonetic: "/ˈɪntərnet/", type: "noun" },
  "home": { meaning: "nhà", phonetic: "/hoʊm/", type: "noun" },
  "yet": { meaning: "chưa", phonetic: "/jet/", type: "adverb" },

  "i": { meaning: "tôi", phonetic: "/aɪ/", type: "pronoun" },
  "see": { meaning: "hiểu", phonetic: "/siː/", type: "verb" },
  "well": { meaning: "à, thì", phonetic: "/wel/", type: "interjection" },
  "good": { meaning: "tốt", phonetic: "/ɡʊd/", type: "adjective" },
  "luck": { meaning: "may mắn", phonetic: "/lʌk/", type: "noun" },
  "with": { meaning: "với", phonetic: "/wɪð/", type: "preposition" },

  "thanks": { meaning: "cảm ơn", phonetic: "/θæŋks/", type: "interjection" },
  "excited": { meaning: "hào hứng", phonetic: "/ɪkˈsaɪtɪd/", type: "adjective" },
  "for": { meaning: "cho", phonetic: "/fɔːr/", type: "preposition" },
  "think": { meaning: "nghĩ", phonetic: "/θɪŋk/", type: "verb" },
  "classes": { meaning: "các lớp học", phonetic: "/ˈklæsɪz/", type: "noun" },
  "are": { meaning: "là", phonetic: "/ɑːr/", type: "verb" },
  "fun": { meaning: "vui", phonetic: "/fʌn/", type: "adjective" },

  "too": { meaning: "cũng", phonetic: "/tuː/", type: "adverb" }
};
const sentences = [
  { text: "Tony, where is the computer lab?", start: 0, end: 3 },
  { text: "It's just down the hall.", start: 3, end: 6 },
  { text: "My Spanish class is there tomorrow.", start: 6, end: 8 },
  { text: "Oh, when is the class?", start: 8, end: 11 },
  { text: "It's at six after school.", start: 11, end: 13 },
  { text: "Why isn't the class online?", start: 13, end: 16 },
  { text: "It is, but I'm still new in town, so.", start: 16, end: 20 },
  { text: "I don't have Internet at home yet.", start: 20, end: 23 },
  { text: "Ohh I see, well good luck with the class.", start: 23, end: 27 },
  { text: "Thanks, I'm excited for it.", start: 27, end: 29 },
  { text: "I think online classes are fun.", start: 29, end: 32 },
  { text: "I think so too.", start: 32, end: 35 }
];
function renderSentence(s){
  const words=s.text.split(/\s+/);
  bubble.innerHTML=words.map((w)=>{
    const clean=w.replace(/[.,!?]/g,"").toLowerCase();
    return `<span class="word" onclick="handleWordClick(event, '${clean}')">${w}</span>`;
  }).join(" ");
  bubble.dataset.activeStart=s.start;
}

function handleWordClick(event, word) {
  // 1. Chỉ phát âm từ (giữ nguyên tính năng cũ)
  if(!canvas.classList.contains("pen-active")) {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // 2. Tra từ điển và hiển thị thêm từ loại
  const data = dictionary[word];
  if (data) {
    // Thêm phần hiển thị từ loại (data.type) vào trong popup
    dictPopup.innerHTML = `
      <b style="text-transform: capitalize;">${word}</b> 
      <i style="color: #666; font-size: 13px;">(${data.type || 'n/a'})</i><br>
      <span style="color: #c36a2d; font-size: 14px;">${data.phonetic}</span>
      <p style="margin-top: 8px;">➡️ ${data.meaning}</p>
    `;
    
    // Vị trí hiển thị popup
    dictPopup.style.left = event.clientX + "px";
    dictPopup.style.top = (event.clientY - 130) + "px";
    dictPopup.style.display = "block";

    // Tự động ẩn sau 3 giây
    clearTimeout(window.dictTimeout);
    window.dictTimeout = setTimeout(() => {
      dictPopup.style.display = "none";
    }, 3000);
  }
}
function toggleSubtitle(){
  subtitleOn = !subtitleOn;
  const btn = document.getElementById("subBtn");

  if(subtitleOn){
    btn.innerHTML = "<span>💬</span> Subtitle: ON";
    btn.classList.add("active");
  } else {
    btn.innerHTML = "<span>💬</span> Subtitle: OFF";
    btn.classList.remove("active");
    bubble.innerHTML = ""; // ẩn luôn text
  }
}
function syncSubtitle(){
  if(!isSyncing) return;

  const ct = video.currentTime;

  if(!subtitleOn){
    bubble.innerHTML = "";
  } else {
    const s = sentences.find(x => ct >= x.start && ct <= x.end);
    if(s && bubble.dataset.activeStart != s.start) renderSentence(s);
  }

  animationFrameId = requestAnimationFrame(syncSubtitle);
}function playConversation(){
  cancelAnimationFrame(animationFrameId);
  isSyncing=true;
  video.play();
  syncSubtitle();
}

function pauseToggle(){
  video.paused ? video.play() : video.pause();
}

function stopConversation(){
  video.pause(); video.currentTime=0; isSyncing=false;
  bubble.innerText="Bấm Play All để bắt đầu học!";
}

function handleVideoClick(){ video.paused?playConversation():pauseToggle(); }
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

function getPos(e) {
  if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener("touchstart", (e) => { 
  if(!canvas.classList.contains("pen-active")) return;
  if (e.cancelable) e.preventDefault(); 
  isDrawing = true; ctx.beginPath();
  const p = getPos(e); ctx.moveTo(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", (e) => { 
  if (e.cancelable) e.preventDefault(); 
  if(!isDrawing) return; 
  const p = getPos(e);
  ctx.lineTo(p.x, p.y); ctx.strokeStyle = "red"; ctx.lineWidth = 4;
  ctx.lineCap = 'round'; ctx.stroke(); 
}, { passive: false });

canvas.addEventListener("touchend", () => isDrawing = false);

window.addEventListener("keydown", (e) => {
  if (e.key === "PageDown" || e.key === "ArrowRight" || e.key === "PageUp" || e.key === "ArrowLeft" || e.code === "Space") {
    e.preventDefault(); handleVideoClick();
  }
});

window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });
</script>

</body>
</html>
